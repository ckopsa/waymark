[project]
name = "waymark"
version = "0.1.0"
description = "An affordance-oriented hypermedia format and server framework for mixed human/agent clients"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "typer>=0.12",
    "httpx>=0.27",
    # the collab seam (format §2.3) serves WebSockets; uvicorn needs an impl
    "websockets>=12",
    "pyjwt>=2.8",
    "cryptography>=42",
]

[project.optional-dependencies]
testing = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "hypothesis-jsonschema>=0.23",
    "jsonschema>=4.21",
]

[project.scripts]
waymark = "waymark.cli.__main__:app"
waymark2 = "waymark2.cli.__main__:app"
waymark3 = "waymark3.cli.__main__:app"
waymark4 = "waymark4.cli.__main__:app"
waymark5 = "waymark5.cli.__main__:app"

[project.entry-points.pytest11]
waymark = "waymark.testing.pytest_plugin"
waymark2 = "waymark2.testing.pytest_plugin"
waymark3 = "waymark3.testing.pytest_plugin"
waymark4 = "waymark4.testing.pytest_plugin"
waymark5 = "waymark5.testing.pytest_plugin"

[dependency-groups]
dev = [
    "waymark[testing]",
    "uvicorn>=0.30",
    "pytest-xdist>=3.8.0",
]

[tool.uv.sources]
waymark = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["waymark", "waymark2", "waymark3", "waymark4", "waymark5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
