# A self-hosted factory (epic 00680418, T8): Postgres, a factory-only
# engine and the bench, on one machine, for one person.
#
#   docker compose up -d    # no .env needed (docs/spec-first-run.md R-4.1)
#
# A one-shot `keys` service writes the data key, the database password,
# the pull token and localfire's key into the `keys` volume once, and
# each consumer reads its file through a _FILE variable. The engine
# mounts the volume writable: an unclaimed boot's claim keeps the
# owner's id there as `owner` (docs/spec-first-run.md R-4.6). A
# value set in .env seeds its file the first time and never after. The
# data key lives only in that volume: back it up, since a database
# without its key cannot be read, and `down -v` deletes both.
#
# All three share compose's default network: the engine reaches
# Postgres at postgres:5432 and the bench at http://bench:8101/mcp/.
# Inside their containers they bind 0.0.0.0 as their images do; only
# the HOST side is restricted. The engine is published on 127.0.0.1
# and nothing is published on 0.0.0.0 — a solo engine's dev headers
# are its only identity, so only this machine may present them.

name: waymark-factory

services:
  keys:
    # runs once before the others; the postgres image is already pulled
    # and carries sh, base64 and the postgres user the password file is
    # handed to. It prints each file's name and never its value.
    image: ${POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:17}
    restart: "no"
    environment:
      WAYMARK_DATA_KEY: ${WAYMARK_DATA_KEY:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      WAYMARK_PULL_TOKEN: ${WAYMARK_PULL_TOKEN:-}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        key() { head -c 32 /dev/urandom | base64 | tr -d '\n'; }
        word() { head -c "$$1" /dev/urandom | base64 | tr '+/' '-_' | tr -d '=\n'; }
        put() {
          if [ -e "/keys/$$1" ]; then echo "keys: $$1 kept"; return 0; fi
          printf '%s' "$$2" > "/keys/$$1.new"
          mv "/keys/$$1.new" "/keys/$$1"
          echo "keys: $$1 written"
        }
        put data.key "$${WAYMARK_DATA_KEY:-$$(key)}"
        put postgres.password "$${POSTGRES_PASSWORD:-$$(word 24)}"
        put pull.token "$${WAYMARK_PULL_TOKEN:-$$(word 32)}"
        put localfire.key "$$(key)"
        chown postgres:postgres /keys/postgres.password
        # localfire runs as uid 1500 (Dockerfile.localfire)
        chown 1500:1500 /keys/pull.token /keys/localfire.key
        chmod 0400 /keys/data.key /keys/postgres.password /keys/pull.token /keys/localfire.key
    volumes:
      - keys:/keys

  postgres:
    # POSTGRES_IMAGE names another registry's copy of the same image;
    # the selfhost CI job sets it to mirror.gcr.io's
    image: ${POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:17}
    restart: unless-stopped
    depends_on:
      keys:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: waymark
      POSTGRES_USER: waymark
      POSTGRES_PASSWORD_FILE: /keys/postgres.password
    volumes:
      - postgres:/var/lib/postgresql/data
      - keys:/keys:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waymark -d waymark"]
      interval: 5s
      timeout: 5s
      retries: 20

  engine:
    image: ${WAYMARK_IMAGE:-ghcr.io/ckopsa/workqueue10:latest}
    restart: unless-stopped
    depends_on:
      keys:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      bench:
        condition: service_started
    environment:
      WORKQUEUE10_DSN: jdbc:postgresql://postgres:5432/waymark?user=waymark
      WORKQUEUE10_DSN_PASSWORD_FILE: /keys/postgres.password
      WORKQUEUE10_PORT: "8014"
      # a solo engine binds loopback unless told otherwise, and the
      # container's loopback is not the host's: the published port
      # below is what keeps it on this machine
      WAYMARK10_HOST: 0.0.0.0
      FACTORY10_ONLY: "1"
      WAYMARK10_AUTO_MIGRATE: "1"
      # empty unless .env names an owner: an engine with no solo owner
      # boots unclaimed (R-4.5) and the claim names it; repo keeps its
      # placeholder until the first card (R-5.3) names it
      WAYMARK10_SOLO_OWNER: ${WAYMARK_OWNER:-}
      # the key the seed's :at-rest :encrypted fields (the pull token)
      # are sealed with, from the keys volume
      WAYMARK10_DATA_KEY_FILE: /keys/data.key
      # the claim's `owner` file lives here (R-4.6)
      WAYMARK10_KEYS_DIR: /keys
      WAYMARK10_SEED: factory
      WAYMARK10_SEED_PARAMS: >-
        {"owner": "${WAYMARK_OWNER:-owner}",
         "repo": "${WAYMARK_REPO:-owner/repo}",
         "bench_url": "http://bench:8101/mcp/",
         "model": "${WAYMARK_MODEL:-claude-opus-5}",
         "pull_token_file": "/keys/pull.token"}
    volumes:
      # writable: the claim writes `owner` here (R-4.6)
      - keys:/keys
    ports:
      - "127.0.0.1:${WAYMARK_PORT:-8014}:8014"

  bench:
    image: ${BENCH_IMAGE:-ghcr.io/ckopsa/waymark-bench:latest}
    restart: unless-stopped
    # the image runs `bench --http 8101 --config /etc/bench/bench.json`
    # with BENCH_HOST=0.0.0.0 and data_dir /data. No bench.json is
    # mounted: repositories arrive from the engine through `enroll` and
    # persist in /data/repos.json. Not published: the engine is its
    # only caller.
    environment:
      BENCH_GIT_TOKEN: ${BENCH_GIT_TOKEN:-}
      BENCH_GITHUB_TOKEN: ${BENCH_GITHUB_TOKEN:-${BENCH_GIT_TOKEN}}
    volumes:
      - bench:/data

  localfire:
    # first-run R-5.5: the fire endpoint, its config built from the
    # command below, so no localfire.edn is written. It is idle until a
    # Claude token is entered on its page, http://127.0.0.1:8112/me:
    # sealed there under localfire.key, never shown, never logged, and
    # never sent to the engine. Then it pulls the seed's link, whose id
    # the seed fixes (factory/seed.edn) and whose token `keys` wrote.
    # Each run reaches the engine's MCP door as SELFHOST.md step 4's
    # localfire.edn has it: agent `claude`, acting for the owner the
    # claim kept in the keys volume, read as each run starts since the
    # claim may come after this starts. The run sits with its seat key.
    image: ${LOCALFIRE_IMAGE:-ghcr.io/ckopsa/localfire:latest}
    restart: unless-stopped
    depends_on:
      keys:
        condition: service_completed_successfully
      engine:
        condition: service_started
    environment:
      LOCALFIRE_PULL_TOKEN_FILE: /keys/pull.token
      LOCALFIRE_TOKEN_KEY_FILE: /keys/localfire.key
    command:
      - pull
      - --engine
      - http://engine:8014
      - --link
      - ${LOCALFIRE_LINK_ID:-10ca1f12-e000-4000-8000-000000000001}
      - --solo-tokens
      - /data/tokens
      - --mcp-header
      - "X-Waymark-Principal: claude"
      - --mcp-header
      - "X-Waymark-Actor-Type: agent"
      - --mcp-header-file
      - "X-Waymark-Acts-For: /keys/owner"
    volumes:
      - keys:/keys:ro
      - localfire:/data
    ports:
      - "127.0.0.1:${LOCALFIRE_PORT:-8112}:8112"

volumes:
  postgres:
  bench:
  keys:
  localfire:
