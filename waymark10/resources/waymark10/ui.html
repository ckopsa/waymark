<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waymark</title>
<!-- no favicon route on the engine: declare none, so the browser's
     automatic /favicon.ico probe doesn't 404 in every console -->
<link rel="icon" href="data:,">
<style>
  /* ── provenance is the aesthetic (the waymark9 UI, ported to wire 10) ─
     Every color and face encodes where a piece of truth comes from:
     serif = server prose (the document speaking), mono = machine truth
     (facts, states, ids, law tokens), sans = this client's own chrome.
     Verdigris is the one action color; violet is reserved exclusively
     for definition/deploy vocabulary — the law is visibly not an app
     concern, and nothing else may borrow its color.
     Self-contained: local font stacks only, no external hosts. */
  :root {
    --paper: #FAFAF8; --panel: #FFFFFF; --ink: #20261F; --muted: #6B7268;
    --line: #E4E5E0; --chipbg: #EFF1EC;
    --verdigris: #2E6E4E; --verdigris-deep: #245A3F; --verdigris-wash: #E7F0EA;
    --refusal: #93342B; --refusal-wash: #F7ECEA;
    --warn: #8A5A00; --warn-wash: #F6EFDF;
    --law: #5B4B9E; --law-wash: #EDEAF6;
    --radius: 4px;
    --shadow: 0 1px 2px rgba(32,38,31,.06);
    --serif: Georgia, "Times New Roman", "Source Serif 4", serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "IBM Plex Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 14px/1.5 var(--sans); padding-bottom: 40px; }
  a { color: var(--verdigris); text-decoration: none; }
  a:hover { text-decoration: underline; color: var(--verdigris-deep); }
  code, .mono { font-family: var(--mono); font-size: 12px; }
  code { background: var(--chipbg); padding: 1px 5px; border-radius: 3px; }
  .prose { font-family: var(--serif); }
  :focus-visible { outline: 2px solid var(--verdigris); outline-offset: 1px;
                   border-radius: 2px; }

  header { display: flex; align-items: center; gap: 14px; padding: 10px 20px;
           background: var(--panel); border-bottom: 1px solid var(--line);
           position: sticky; top: 0; z-index: 5; flex-wrap: wrap; row-gap: 4px; }
  header h1 { font-size: 15px; font-weight: 800; letter-spacing: .04em;
              margin: 0; }
  header h1 a { color: var(--ink); }
  header nav { display: inline-flex; align-items: center; flex-wrap: wrap; }
  header nav a { margin-right: 12px; font-size: 13px; }
  header .spacer { flex: 1; }
  #who { width: 120px; padding: 4px 8px; border: 1px solid var(--line);
         border-radius: var(--radius); background: var(--paper);
         color: var(--ink); font: 13px var(--sans); }
  /* engine kinds tuck behind a quiet ⋯ at the far right of the nav */
  .nav-more-wrap { position: relative; }
  .nav-more { border: none; background: none; color: var(--muted);
              font-size: 15px; line-height: 1; padding: 2px 7px;
              border-radius: 3px; }
  .nav-more:hover { color: var(--ink); background: var(--chipbg); border: none; }
  .nav-menu { position: absolute; top: calc(100% + 4px); left: 0;
              z-index: 30; background: var(--panel);
              border: 1px solid var(--line); border-radius: var(--radius);
              box-shadow: var(--shadow); padding: 6px 0; min-width: 170px;
              display: none; }
  .nav-menu a { display: block; padding: 5px 14px; margin: 0;
                font-size: 13px; color: var(--ink); white-space: nowrap; }
  .nav-menu a:hover { background: var(--chipbg); text-decoration: none; }
  .nav-menu .law-mark { color: var(--law); }
  /* the law stamp: which revision of the law produced this screen */
  #lawstamp a { font-family: var(--mono); font-size: 11px; color: var(--law);
                background: var(--law-wash); border: 1px solid var(--law-wash);
                border-radius: 3px; padding: 2px 8px; white-space: nowrap; }
  #lawstamp a:hover { border-color: var(--law); text-decoration: none; }
  /* the grant scope chip: this session reads through the named grant */
  #grantchip { display: none; font-family: var(--mono); font-size: 11px;
               background: var(--warn-wash); color: var(--warn);
               border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  #grantchip button { border: none; background: none; color: var(--warn);
                      padding: 0 0 0 6px; font-weight: 700; cursor: pointer; }
  #followchip { background: var(--verdigris-wash); color: var(--verdigris-deep);
                border-radius: 999px; padding: 3px 12px; font-size: 12px;
                font-weight: 600; display: none; white-space: nowrap; }
  #followchip button { border: none; background: none;
                       color: var(--verdigris-deep); padding: 0 0 0 6px;
                       font-weight: 700; cursor: pointer; }

  select, input, textarea, button {
    font: 13.5px/1.4 var(--sans); color: inherit; border: 1px solid var(--line);
    border-radius: var(--radius); padding: 6px 9px; background: var(--panel); }
  textarea.mono { font-family: var(--mono); font-size: 12px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--verdigris); color: #fff;
                   border-color: var(--verdigris); }
  button.primary:hover, button.primary:active {
    background: var(--verdigris-deep); border-color: var(--verdigris-deep); }
  button.danger  { background: var(--panel); color: var(--refusal);
                   border-color: var(--refusal); }
  button.danger:hover { background: var(--refusal); color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  /* effort as a subtle chip riding the button, not a text suffix */
  .effort-chip { font: 600 9.5px var(--sans); border-radius: 3px;
                 padding: 1px 5px; margin-left: 6px; vertical-align: 1px;
                 background: var(--chipbg); color: var(--muted); }
  button.primary .effort-chip, button.danger:hover .effort-chip {
    background: rgba(255,255,255,.25); color: #fff; }

  main { max-width: 1200px; margin: 18px auto; padding: 0 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line);
           border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px;
           overflow-x: auto; box-shadow: var(--shadow); }
  .crumbs { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
  .crumbs .id { font-family: var(--mono); font-size: 11.5px; }
  h2 { margin: 4px 0 2px; font-size: 19px; font-weight: 800;
       letter-spacing: -.01em; }
  h3.sect { margin: 18px 0 6px; font-size: 12px; font-weight: 700;
            color: var(--muted); text-transform: uppercase;
            letter-spacing: .06em; }
  /* the summary is the server's own sentence — it IS the orientation */
  .summary { font-family: var(--serif); font-size: 17.5px; line-height: 1.4;
             color: var(--ink); margin: 6px 0 14px; }
  .muted { color: var(--muted); }
  .metaline { color: var(--muted); font-size: 12px; }
  .metaline .mono { font-size: 11px; }

  /* machine truth wears the mono: states, ids, versions, counts */
  .chip { display: inline-block; font-family: var(--mono); font-size: 11px;
          background: var(--chipbg); color: var(--ink);
          border-radius: 3px; padding: 2px 8px; border: 1px solid transparent; }
  .chip.warning { background: var(--warn-wash); color: var(--warn); }
  .chip.ok      { background: var(--verdigris-wash); color: var(--verdigris-deep); }
  .chip.danger  { background: var(--refusal-wash); color: var(--refusal); }
  .statechip { display: inline-block; font-family: var(--mono); font-size: 11px;
               background: var(--chipbg); color: var(--ink);
               border-radius: 3px; padding: 2px 8px; }
  .version { font-family: var(--mono); font-size: 11px; color: var(--muted);
             margin-left: 8px; }
  /* clickable facet chips (the collection's x-facets, lit when active) */
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0;
           align-items: center; }
  .chips .chip { cursor: pointer; }
  .chips .chip.static { cursor: default; }
  .chips .chip.on { background: var(--verdigris); color: #fff;
                    border-color: var(--verdigris); }

  table.kv { border-collapse: collapse; width: 100%; }
  table.kv td { padding: 6px 10px 6px 0; vertical-align: top;
                border-bottom: 1px solid var(--line); }
  table.kv td.k { color: var(--muted); width: 32%; font-size: 12px;
                  font-family: var(--mono); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px;
             align-items: center; }

  /* the can't-yet section: the reason is server prose, so it's serif;
     a clock-gated hope gets a live countdown */
  .cantyet .item { padding: 7px 0; font-size: 13px;
                   border-bottom: 1px solid var(--line); }
  .cantyet .item:last-child { border-bottom: none; }
  .cantyet .item b { font-weight: 700; }
  .cantyet .why { font-family: var(--serif); font-size: 14px;
                  color: var(--ink); margin: 2px 0; }
  .countdown { font-family: var(--mono); font-size: 12px;
               color: var(--verdigris-deep); }
  .unavail { margin-top: 10px; }
  .notnow li { margin: 3px 0; color: var(--muted); font-size: 13.5px; }
  .notnow b { color: var(--ink); font-weight: 600; }

  /* remedies: the wire names the way out as "kind.action" chips */
  .remedies { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
  a.chip.remedy, button.chip.remedy {
    background: var(--verdigris-wash); color: var(--verdigris-deep);
    border: 1px solid var(--verdigris-wash); }
  a.chip.remedy:hover, button.chip.remedy:hover {
    border-color: var(--verdigris); text-decoration: none; }
  button.suggested { border-color: var(--verdigris);
                     box-shadow: 0 0 0 2px var(--verdigris-wash); }
  .suggest-chip { font: 600 9.5px var(--sans); border-radius: 3px;
                  padding: 1px 5px; margin-left: 6px; vertical-align: 1px;
                  background: var(--verdigris-wash);
                  color: var(--verdigris-deep); }
  button.primary .suggest-chip { background: rgba(255,255,255,.25);
                                 color: #fff; }
  @keyframes remedy-pulse {
    50% { box-shadow: 0 0 0 6px var(--verdigris-wash); } }
  button.pulse { outline: 2px solid var(--verdigris); outline-offset: 1px;
                 animation: remedy-pulse .7s ease-in-out 2; }
  /* a link badge: a count the wire sent riding the link */
  .badge { font-family: var(--mono); font-size: 10px; color: var(--muted);
           background: var(--chipbg); border-radius: 999px; padding: 1px 6px;
           margin-left: 6px; vertical-align: 1px; font-weight: 400; }
  a.link-chip { font-family: var(--mono); font-size: 11px;
                color: var(--ink); background: var(--chipbg);
                border: 1px solid var(--line); border-radius: 3px;
                padding: 2px 8px; white-space: nowrap; }
  a.link-chip:hover { border-color: var(--muted); text-decoration: none; }
  a.surface-link { font-family: var(--mono); font-size: 11px;
                   color: var(--law); background: var(--law-wash);
                   border: 1px solid var(--law-wash); border-radius: 3px;
                   padding: 2px 8px; white-space: nowrap; }
  a.surface-link:hover { border-color: var(--law); text-decoration: none; }
  .surface-mark { color: var(--law); font-family: var(--mono); font-size: 12px; }
  /* attention flags on surfaces */
  .flag { display: inline-block; padding: 2px 10px; border-radius: 3px;
          font: 600 12px var(--sans); }
  .flag.up { background: var(--warn-wash); color: var(--warn);
             border: 1px solid var(--warn); }
  .flag.down { background: var(--chipbg); color: var(--muted); }

  /* embedded collections: server-spliced rows on the detail page */
  .embed { border-top: 1px solid var(--line); margin-top: 14px;
           padding-top: 10px; }
  .embed-head { display: flex; align-items: baseline; gap: 8px;
                flex-wrap: wrap; margin-bottom: 6px; }
  .embed-head b { font-size: 13px; }
  .embed-head .open { font-size: 12px; margin-left: auto; white-space: nowrap; }

  table.items { border-collapse: collapse; width: 100%; }
  table.items th { text-align: left; font-size: 11px; color: var(--muted);
                   font-weight: 600; padding: 6px 10px 6px 0;
                   border-bottom: 2px solid var(--line); white-space: nowrap; }
  table.items td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line);
                   vertical-align: middle; }
  table.items td.rowactions { text-align: right; white-space: nowrap; }
  table.items tr:hover td { background: var(--paper); }
  .partactions { white-space: nowrap; }
  .partactions button { padding: 3px 10px; font-size: 12px; margin: 1px 2px; }

  .filterbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: end;
               margin-bottom: 12px; }
  .filterbar label { display: flex; flex-direction: column;
                     font-size: 11px; color: var(--muted); gap: 3px; }
  .facet-count { font-family: var(--mono); font-size: 10.5px;
                 color: var(--muted); }

  /* ── the home dashboard ─────────────────────────────────────────── */
  .dash-grid { display: grid; gap: 12px; margin-bottom: 16px;
               grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .kind-card { background: var(--panel); border: 1px solid var(--line);
               border-radius: var(--radius); padding: 14px 16px;
               min-height: 108px; display: flex; flex-direction: column;
               gap: 8px; }
  .kind-card .kc-head { display: flex; align-items: baseline; gap: 8px;
                        justify-content: space-between; flex-wrap: wrap; }
  .kind-card h3 { margin: 0; font-size: 14px; font-weight: 800;
                  letter-spacing: -.01em; }
  .kind-card h3 a { color: var(--ink); }
  .kc-total { font-family: var(--mono); font-size: 27px; line-height: 1.1; }
  .kc-none { font-family: var(--serif); color: var(--muted); font-size: 14.5px; }
  .kc-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .kc-chips a.chip:hover { background: var(--verdigris-wash);
                           color: var(--verdigris-deep); text-decoration: none; }
  .kc-foot { margin-top: auto; }
  .attention { background: var(--panel); border: 1px solid var(--line);
               border-left: 3px solid var(--warn);
               border-radius: var(--radius); padding: 8px 14px;
               margin-bottom: 14px; }
  .attention .item { font-family: var(--serif); font-size: 14.5px;
                     padding: 3px 0; }
  #apphost { font-family: var(--mono); font-size: 11px; }
  @media (max-width: 600px) { #apphost { display: none; } }

  /* ── the ledger: the activity drawer ─────────────────────────────── */
  #ledger { position: fixed; top: 0; right: 0; bottom: 0; width: 380px;
            max-width: 92vw; z-index: 15; background: var(--paper);
            border-left: 1px solid var(--line); box-shadow: var(--shadow);
            display: flex; flex-direction: column; padding: 12px 16px;
            transform: translateX(100%); visibility: hidden;
            transition: transform .18s ease-out, visibility 0s linear .18s; }
  #ledger.open { transform: none; visibility: visible;
                 transition: transform .18s ease-out; }
  #ledger:focus { outline: none; }
  .ledger-head { display: flex; align-items: baseline; gap: 8px;
                 border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .ledger-scope { font-family: var(--mono); font-size: 10.5px;
                  color: var(--muted); }
  .ledger-close { border: none; background: none; color: var(--muted);
                  font-size: 14px; line-height: 1; padding: 3px 7px;
                  margin-left: auto; border-radius: 3px; }
  .ledger-close:hover { color: var(--ink); background: var(--chipbg);
                        border: none; }
  @media (max-width: 700px) {
    #ledger { top: auto; left: 0; width: auto; max-width: none;
              height: 60vh; border-left: none;
              border-top: 1px solid var(--line);
              transform: translateY(100%); }
  }
  #ledgerpip { display: none; font-family: var(--mono); font-size: 10px;
               font-weight: 500; background: var(--verdigris); color: #fff;
               border-radius: 999px; padding: 1px 6px; margin-left: 6px;
               vertical-align: 1px; }
  #ledgerpip.law { background: var(--law); }
  .feed { flex: 1; min-height: 0; margin-top: 6px; overflow-y: auto;
          overscroll-behavior: contain; }
  .feed .ev { padding: 7px 0; border-bottom: 1px solid var(--line);
              font-size: 13px; }
  .ev-time { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .actor-chip { font-weight: 600; cursor: pointer; font-size: 12.5px; }
  .actor-chip:hover { text-decoration: underline; }
  .actor-mark { font-size: 10px; }
  .actor-mark.human { color: var(--ink); }
  .actor-mark.agent { color: var(--verdigris); }
  .actor-mark.system { color: var(--muted); }
  .anchor { color: var(--law); font-size: 10px; cursor: help; margin-left: 5px; }
  .ev-body { margin-top: 1px; }
  .feed .ev.deriv { color: var(--muted); font-family: var(--mono);
                    font-size: 11.5px; }
  .feed .ev.deriv a { color: var(--muted); }
  .feed .ev.followed { background: var(--verdigris-wash);
                       border-left: 3px solid var(--verdigris);
                       padding-left: 6px; }
  .feed .ev.law-line { border-top: 2px solid var(--law);
                       border-bottom: 1px solid var(--line);
                       padding: 8px 0; animation: law-in .24s ease-out; }
  @keyframes law-in { from { opacity: 0; transform: translateY(-3px); } }
  .law-stamp { color: var(--law); font-weight: 700; font-size: 12.5px;
               white-space: nowrap; }
  .law-detail, .law-link { font-family: var(--mono); font-size: 11px;
               color: var(--law); }
  .law-link:hover { color: var(--law); }
  .law-chip { font-family: var(--mono); font-size: 10px; }

  /* ── the per-resource history panel ──────────────────────────────── */
  .history { border-top: 1px solid var(--line); margin-top: 14px;
             padding-top: 8px; }
  .history > summary { cursor: pointer; font-size: 13px; }
  .history .ev { padding: 7px 0; border-bottom: 1px solid var(--line);
                 font-size: 13px; }
  .history .ev:last-child { border-bottom: none; }

  /* ── the deploy history: the definitions collection as a screen ─── */
  .rev-row { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .rev-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .rev-token { font-family: var(--mono); font-size: 12.5px; font-weight: 500;
               color: var(--law); white-space: nowrap; }
  .rev-summary { font-family: var(--serif); font-size: 14px; margin: 4px 0; }
  .diff-chip { font: 600 10px var(--sans); border-radius: 3px;
               padding: 1px 6px; background: var(--law-wash);
               color: var(--law); cursor: help; }
  .hash { font-size: 10.5px; color: var(--muted); cursor: help; }

  /* a guard-refused action keeps its seat in the bar, dimmed */
  button.blocked { opacity: .55; cursor: not-allowed; }
  .blockedwhy { margin: 2px 0 4px; }
  .blockedwhy .item { font-size: 13px; padding: 3px 0; }
  .blockedwhy .item b { font-weight: 700; }
  .blockedwhy .why { font-family: var(--serif); font-size: 14px;
                     color: var(--ink); }

  #toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
           background: var(--ink); color: #fff; padding: 10px 18px;
           border-radius: var(--radius); display: none; z-index: 20;
           box-shadow: var(--shadow); max-width: 94vw;
           animation: toast-in .18s ease-out; }
  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } }
  #toast button { background: none; border: none; color: #9fd0b5;
                  margin-left: 10px; font-weight: 600; }
  #ticker { position: fixed; bottom: 0; left: 0; right: 0; z-index: 14;
            background: var(--panel); border-top: 1px solid var(--line);
            font-size: 12px; color: var(--muted); padding: 4px 18px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ticker b { color: var(--ink); font-weight: 600; }
  #ticker .mono { font-size: 11px; }

  /* refusals and problems speak in the server's voice: serif */
  .problem { background: var(--refusal-wash); border: 1px solid var(--line);
             border-left: 3px solid var(--refusal); color: var(--ink);
             border-radius: var(--radius); padding: 10px 14px;
             margin: 10px 0; font-family: var(--serif); font-size: 14px; }
  .problem b { color: var(--refusal); }
  .problem ul { margin: 6px 0 0; padding-left: 18px; font-size: 13.5px; }
  .validok { color: var(--verdigris-deep); font-size: 13.5px; margin: 8px 0; }
  .warnbox { border: 1px solid var(--line); border-left: 3px solid var(--warn);
             background: var(--warn-wash);
             border-radius: var(--radius); padding: 8px 12px; margin: 10px 0; }
  .warnbox ul { margin: 6px 0 0; padding-left: 18px;
                font-family: var(--serif); font-size: 13.5px; }
  .consequence { font-family: var(--serif); font-size: 14.5px;
                 line-height: 1.45; margin: 8px 0; padding: 8px 12px;
                 border: 1px solid var(--line); border-left: 3px solid var(--warn);
                 border-radius: var(--radius); }
  .blast { border: 1px solid var(--line); border-radius: var(--radius);
           padding: 8px 12px; margin: 0 0 12px; }
  .blast b { font-size: 12px; }

  dialog { border: 1px solid var(--line); border-radius: var(--radius);
           padding: 0; width: min(480px, 94vw); max-height: 92dvh;
           overflow-y: auto; box-shadow: var(--shadow);
           background: var(--panel); color: var(--ink); }
  dialog::backdrop { background: rgba(32,38,31,.28); }
  .dlghead { padding: 16px 18px 4px; }
  .dlghead h3 { margin: 0 0 4px; font-weight: 800; font-size: 16px; }
  .dlghead .metaline { margin: 0; }
  .dlgbody { padding: 4px 18px 8px; }
  .dlgfoot { padding: 12px 18px 16px; display: flex; gap: 8px;
             justify-content: flex-end; align-items: center; }
  .dlgfoot .hint { margin-right: auto; color: var(--muted); font-size: 12px; }
  .field { margin: 10px 0; }
  .field label { display: block; margin: 0 0 3px; font-size: 12px;
                 color: var(--muted); }
  .field label b { color: var(--ink); font-weight: 600; }
  .field input[type=text], .field input[type=date], .field input[type=number],
  .field select, .field textarea { width: 100%; }
  .field textarea { min-height: 110px; font-family: var(--mono);
                    font-size: 12.5px; }
  .field .err { color: var(--refusal); font-family: var(--serif);
                font-size: 12.5px; margin-top: 2px; }
  .field .err.srv::before { content: "server: "; color: var(--muted);
                            font-family: var(--sans); font-size: 11px; }
  .field .const { padding: 7px 9px; border: 1px dashed var(--line);
                  border-radius: var(--radius); background: var(--chipbg);
                  color: var(--muted); font-family: var(--mono);
                  font-size: 12px; }
  .req { color: var(--refusal); }
  .draftnote { color: var(--muted); font-size: 12px; margin: 6px 0; }
  .draftnote .bad { color: var(--warn); font-family: var(--serif); }

  /* batch verdicts / bulk reports: outcomes are machine truth */
  .verdict-totals { font-family: var(--mono); font-size: 11.5px;
                    margin: 8px 0 4px; color: var(--muted); }
  table.verdicts { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  table.verdicts th { text-align: left; font-size: 10.5px; color: var(--muted);
                      padding: 4px 8px 4px 0;
                      border-bottom: 1px solid var(--line); }
  table.verdicts td { padding: 4px 8px 4px 0;
                      border-bottom: 1px solid var(--line); vertical-align: top; }
  table.verdicts td.reason { font-family: var(--serif); font-size: 13px; }
  .verdict-ok { color: var(--verdigris-deep); font-weight: 600; }
  .verdict-refused { color: var(--refusal); font-weight: 600; }
  .verdict-failed { color: var(--refusal); font-weight: 700; }

  .pager { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
  .pager .muted { font-family: var(--mono); font-size: 11px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  @media (max-width: 900px) { main { margin: 12px auto; padding: 0 10px; } }
  @media (max-width: 600px) {
    header { padding: 8px 10px; gap: 10px; }
    .panel { padding: 12px; }
    h2 { font-size: 17px; }
    .summary { font-size: 16px; }
    table.kv td.k { width: 40%; }
    select, input, textarea, button { font-size: 16px; padding: 8px 12px; }
    dialog { width: 94vw; }
    .actions button { flex: 1 1 auto; }
  }
  @media (pointer: coarse) { button { padding: 9px 14px; } }
</style>
</head>
<body>
<header>
  <h1><a href="#">Waymark</a></h1>
  <span id="apphost" class="muted"></span>
  <nav id="kinds"></nav>
  <span id="lawstamp"></span>
  <span id="grantchip"></span>
  <span id="followchip"></span>
  <div class="spacer"></div>
  <input id="who" placeholder="principal"
         title="dev principal (x-waymark-principal)">
  <button id="ledgertoggle" style="font-size:12px;padding:4px 10px"
          aria-expanded="false" aria-controls="ledger"
          title="the live ledger — every transition as it lands">
    ◷ Activity<span id="ledgerpip"></span></button>
</header>
<main>
  <section id="view"></section>
</main>
<aside id="ledger" role="complementary" aria-label="Activity" tabindex="-1">
  <div class="ledger-head">
    <b>Activity</b>
    <span class="ledger-scope"
          title="the whole workspace's stream, every kind">everything</span>
    <button class="ledger-close" id="ledgerclose" type="button"
            aria-label="close activity">✕</button>
  </div>
  <div class="feed" id="feed"></div>
</aside>
<div id="toast"></div>
<div id="ticker"></div>

<script>
"use strict";
/* The generic human client (spec Part IV), waymark9's ui.html ported to
   wire 10: route = self · screen = envelope · buttons = actions ·
   disabled-with-tooltip = unavailable · forms = input schema · filter
   bar = the collection query schema · live updates + activity feed =
   the events stream. It consumes only the envelope — it invents no
   affordances.

   Wire-10 deltas this port absorbs (docs/waymark10-design.md, closing
   table): "waymark": "10"; dev identity = x-waymark-principal /
   x-waymark-roles / x-waymark-actor-type; grants scope by
   X-Waymark-Grant (a selector, not a credential); guard names on the
   wire are kebab; drafts 404 until saved and answer {values,
   base_version, prefill, revs, authors}; live collab speaks
   waymark-relay/2 (set/edit/ack/stale/update/presence/regate/sync);
   the SSE surface frames `event: transition` (with ids) and
   `event: derivation`; collection items are envelope-minus-data;
   embeds arrive server-spliced as links.<rel>.embedded.

   Named gaps, so nobody hunts for silent stubs:
   - presence/follow-navigation chrome: wire 10 serves no /-/presence
     route — following below steers on the firehose's transitions only.
   - provenance cells (x-source/x-authority/x-derived): the v10
     published schema does not emit them; the costumes stay retired.
   - the batch textarea (9's design §7): v10 serves the batch route but
     advertises no entry.batch — the page invents no affordance.
   - x-display.relation bounds and if/then conditional arms: not
     emitted by the v10 schema publisher.
   - recomputing honesty banners: v10 meta carries no `recomputing`.
   - the agent-token brief: v10 grants mint no opaque bearer token; the
     grant screen instead scopes THIS session via X-Waymark-Grant. */

const $ = (s, el=document) => el.querySelector(s);
const uuid = () => {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = new Uint8Array(16);
  (crypto.getRandomValues ? crypto.getRandomValues(b)
    : b.forEach((_, i) => b[i] = Math.floor(Math.random() * 256)));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map(x => x.toString(16).padStart(2, "0"));
  return `${h.slice(0,4).join("")}-${h.slice(4,6).join("")}-${h.slice(6,8).join("")}`
       + `-${h.slice(8,10).join("")}-${h.slice(10,16).join("")}`;
};
const pretty = s => String(s).replace(/_/g, " ");
const title = s => { const t = pretty(s); return t.charAt(0).toUpperCase() + t.slice(1); };
const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === "onclick") n.addEventListener("click", v);
    else if (v !== undefined && v !== null) n.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null)
    n.append(kid.nodeType ? kid : document.createTextNode(kid));
  return n;
};

/* ── identity: the dev principal + the session's grant scope ───────── */
const $who = $("#who");
$who.value = localStorage.getItem("wm10.principal") || "";
$who.addEventListener("change", () => {
  localStorage.setItem("wm10.principal", $who.value.trim());
  render();
});
function principalId() { return $who.value.trim(); }
function principalHeaders() {
  const h = {};
  const who = principalId();
  if (who) h["x-waymark-principal"] = who;
  /* the v10 grant scope: a grant id is a scope SELECTOR the audience
     principal presents — not a credential (waymark9 minted opaque
     bearer tokens instead; wire 10 does not) */
  const grant = localStorage.getItem("wm10.grant");
  if (grant) h["X-Waymark-Grant"] = grant;
  return h;
}
function grantChip() {
  const chip = $("#grantchip");
  const grant = localStorage.getItem("wm10.grant");
  chip.textContent = "";
  chip.style.display = grant ? "inline-block" : "none";
  if (grant) chip.append(`grant ${grant.slice(0, 8)}`,
    el("button", {title: "leave the grant scope", onclick: () => {
      localStorage.removeItem("wm10.grant"); grantChip(); render();
    }}, "✕"));
}
grantChip();

async function api(href, opts={}) {
  const res = await fetch(href, {method: opts.method || "GET",
    headers: {...principalHeaders(),
              ...(opts.body !== undefined ? {"Content-Type": "application/json"} : {}),
              ...(opts.headers || {})},
    body: opts.body});
  const text = await res.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch (_e) { body = {unparsed: text}; }
  return {res, status: res.status, ok: res.status < 400, body,
          etag: res.headers.get("ETag")};
}

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 4000);
}

/* live countdown timers die with the screen that owns them */
const liveTimers = [];
function clearLiveTimers() {
  while (liveTimers.length) clearInterval(liveTimers.pop());
}

/* ── discovery: well-known drives everything ───────────────────────── */
let wellKnownCache = null;   // caches the PROMISE: concurrent callers share
function wellKnown() {
  if (!wellKnownCache)
    wellKnownCache = api("/api/.well-known/waymark").then(
      r => { if (!r.ok) throw new Error("no discovery"); return r.body; },
      err => { wellKnownCache = null; throw err; });
  return wellKnownCache;
}
/* v10's well-known lists kinds flat (no engine/secondary tiers on the
   wire — a recorded difference from 9's discovery); the engine's own
   kinds fold behind the ⋯ by this client-side set. */
const ENGINE_KINDS = new Set(["definition", "member", "role", "grant",
                              "attachment", "subscription", "job"]);
function collectionHref(idx, kind) {
  return (((idx || {}).resources || {})[kind] || {}).href || null;
}

/* published data schemas: x-display hints per kind */
const dataHintsCache = {};
async function kindSchema(kind) {
  if (!(kind in dataHintsCache)) {
    try {
      const {ok, body} = await api(`/api/schemas/${kind}`);
      dataHintsCache[kind] = ok ? body : {};
    } catch { dataHintsCache[kind] = {}; }
  }
  return dataHintsCache[kind];
}
function xdisplay(schema, field) {
  const prop = ((schema || {}).properties || {})[field] || {};
  return prop["x-display"] || schemaProp(prop)["x-display"] || {};
}
function xref(prop) {
  if (!prop || typeof prop !== "object") return null;
  const sub = schemaProp(prop);
  return prop["x-ref"] || sub["x-ref"] ||
    (prop.format === "waymark-ref" || sub.format === "waymark-ref" ? {} : null);
}

/* ── routing: the URL hash IS the resource href ────────────────────── */
function go(href) { location.hash = href; }
window.addEventListener("hashchange", render);

let renderSeq = 0;
async function render() {
  const seq = ++renderSeq;               // fetch first, swap after — a
  const href = decodeURIComponent(location.hash.slice(1)) || null;
  const view = $("#view");               // superseded render never blanks
  renderNav(href ? href.split("?")[0].split("/").slice(0, 3).join("/") : null);
  if (!href) { lawStamp(null); return renderHome(view, seq); }
  if (/^\/api\/surfaces\//.test(href)) {
    const {ok, body} = await api(href);
    if (seq !== renderSeq) return;
    clearLiveTimers(); view.textContent = ""; lawStamp(null);
    if (!ok) return view.append(problemBox(body));
    return renderSurface(view, body);
  }
  const {ok, body} = await api(href);
  let hints = {};
  if (ok && body && body.kind)
    hints = await kindSchema(String(body.kind).replace(/_collection$/, ""));
  if (seq !== renderSeq) return;
  clearLiveTimers();
  view.textContent = "";
  lawStamp(ok ? body : null);
  if (!ok) return view.append(problemBox(body));
  if (body.kind === "definition_collection") renderDeployHistory(view, body);
  else if (body.kind && body.kind.endsWith("_collection"))
    renderCollection(view, body, hints);
  else renderResource(view, body, hints);
}

/* ── the law stamp: the envelope's own meta.law_revision, read straight
   off the wire — the deploy history is one click away ──────────────── */
function lawStamp(doc) {
  const box = $("#lawstamp");
  box.textContent = "";
  const rev = doc?.meta?.law_revision;
  if (rev == null || !doc.kind) return;
  const kind = String(doc.kind).replace(/_collection$/, "");
  wellKnown().then(w => {
    const col = collectionHref(w, "definition");
    if (!col || !document.contains(box)) return;
    box.append(el("a",
      {href: `#${col}?target_kind=${encodeURIComponent(kind)}`,
       title: `the law in force for ${pretty(kind)} — revision ${rev}. `
            + `Click for the deploy history.`},
      `⚖ rev ${rev}`));
  }).catch(() => {});
}

/* ── the nav: built from discovery on EVERY load — a deep link
   hard-refreshed must not arrive without its navigation. Domain kinds
   sit inline; the engine's own kinds tuck behind a quiet ⋯ menu. ───── */
async function renderNav(current) {
  let w;
  try { w = await wellKnown(); } catch { return; }
  const nav = $("#kinds"); nav.textContent = "";
  const entries = Object.entries(w.resources || {});
  for (const [kind, {href}] of entries)
    if (!ENGINE_KINDS.has(kind))
      nav.append(el("a", {href: "#" + href,
        style: current === href ? "font-weight:700" : ""}, title(kind) + "s"));
  const tucked = entries.filter(([kind]) => ENGINE_KINDS.has(kind));
  if (tucked.length) nav.append(overflowMenu(tucked));
}

function overflowMenu(engineEntries) {
  const wrap = el("span", {class:"nav-more-wrap"});
  const menu = el("div", {class:"nav-menu", role:"menu"});
  const btn = el("button", {class:"nav-more", type:"button",
    "aria-haspopup":"true", "aria-expanded":"false",
    title: "engine kinds — the machinery's own resources"}, "⋯");
  const close = () => { menu.style.display = "none";
                        btn.setAttribute("aria-expanded", "false"); };
  const open = () => { menu.style.display = "block";
                       btn.setAttribute("aria-expanded", "true");
                       (menu.querySelector("a") || btn).focus(); };
  btn.addEventListener("click", () =>
    menu.style.display === "block" ? close() : open());
  wrap.addEventListener("keydown", ev => {
    if (ev.key === "Escape" && menu.style.display === "block") {
      ev.stopPropagation(); close(); btn.focus(); }
  });
  document.addEventListener("pointerdown", ev => {
    if (!wrap.contains(ev.target)) close(); });
  for (const [kind, {href}] of engineEntries)
    menu.append(el("a", {href: "#" + href, role:"menuitem", onclick: close},
      ...(kind === "definition" ? [el("span", {class:"law-mark"}, "⚖ ")] : []),
      title(kind) + "s"));
  wrap.append(btn, menu);
  return wrap;
}

/* Build a filtered link by merging params into the advertised href —
   the server owns its URL shapes; this client only ever adds a query. */
function mergeParams(href, params) {
  const [base, q] = href.split("?");
  const qs = new URLSearchParams(q || "");
  for (const [k, v] of Object.entries(params)) qs.set(k, v);
  const s = qs.toString();
  return s ? `${base}?${s}` : base;
}

/* ── home: the dashboard — one rows=none envelope per domain kind (a
   single COUNT, no per-row probes) whose x-facets carry the per-state
   counts; the engine kinds and declared surfaces below. ────────────── */
async function renderHome(view, seq) {
  let w;
  try { w = await wellKnown(); } catch {
    view.textContent = "";
    return view.append(el("div", {class:"problem"},
      "Cannot reach /api/.well-known/waymark"));
  }
  if (seq !== renderSeq) return;
  clearLiveTimers();
  view.textContent = "";
  const entries = Object.entries(w.resources || {});
  const domain = entries.filter(([kind]) => !ENGINE_KINDS.has(kind));

  const strip = el("div");             // fills only if something is nonzero
  const grid = el("div", {class:"dash-grid"});
  view.append(strip, grid);
  const attention = [];

  const settling = domain.map(([kind, {href}]) => {
    const card = el("div", {class:"kind-card"});
    grid.append(card);
    return fillDashCard(card, kind, href);
  });
  /* the engine vitals: running/queued jobs surface as attention (a
     kind the engine did not enroll simply contributes nothing) */
  const jobHref = collectionHref(w, "job");
  if (jobHref)
    settling.push(api(mergeParams(jobHref, {rows: "none"})).then(({ok, body}) => {
      if (!ok) return;
      const facets = body.actions?.query?.input?.properties
        ?.state?.["x-facets"] || {};
      const live = ["running", "queued"].filter(s => facets[s] > 0);
      const n = live.reduce((sum, s) => sum + facets[s], 0);
      if (n) attention.push(el("div", {class:"item"},
        el("a", {href: "#" + mergeParams(jobHref, {state: live.join(",")})},
          el("span", {class:"mono"}, String(n)),
          n === 1 ? " job is running or queued." : " jobs are running or queued.")));
    }).catch(() => {}));

  await Promise.allSettled(settling);
  if (seq !== renderSeq) return;
  if (attention.length) strip.append(el("div", {class:"attention"}, attention));
  else strip.remove();

  const engine = entries.filter(([kind]) => ENGINE_KINDS.has(kind));
  if (engine.length) {
    view.append(el("h3", {class:"sect"}, "Engine kinds"),
      el("div", {class:"chips"}, engine.map(([kind, {href}]) =>
        el("a", {href: "#" + href, class: "link-chip"}, title(kind) + "s"))));
  }
  const surfaces = Object.entries(w.surfaces || {});
  if (surfaces.length) {
    view.append(el("h3", {class:"sect"}, "Declared surfaces"),
      el("div", {class:"chips"}, surfaces.map(([name, {href}]) =>
        el("span", {class:"surface-link", title: href + " — open from an anchor row"},
          "⧉ " + name))));
  }
}

/* One domain kind's card: humanized name, the count in mono, state-facet
   chips as filtered links, the advertised create affordance. */
async function fillDashCard(card, kind, href) {
  let env;
  try {
    const {ok, body} = await api(mergeParams(href, {rows: "none"}));
    if (!ok) { card.remove(); return null; }   // degrade silently
    env = body;
  } catch { card.remove(); return null; }
  card.textContent = "";
  card.append(el("div", {class:"kc-head"},
    el("h3", {}, el("a", {href: "#" + href}, title(kind) + "s"))));
  const total = env.data?.total ?? 0;
  if (!total)
    card.append(el("div", {class:"kc-none"}, "none yet"));
  else {
    card.append(el("div", {class:"kc-total", title: `${total} total`},
      String(total)));
    const facets = env.actions?.query?.input?.properties
      ?.state?.["x-facets"] || {};
    const chips = Object.entries(facets).filter(([, n]) => n > 0);
    if (chips.length)
      card.append(el("div", {class:"kc-chips"}, chips.map(([s, n]) =>
        el("a", {class: "chip", href: "#" + mergeParams(href, {state: s}),
                 title: `${pretty(s)} ${pretty(kind)}s`}, `${pretty(s)} ${n}`))));
  }
  const create = env.actions?.create;
  if (create) {
    const btn = actionButton({name: "create", entry: create, doc: env,
      label: "New", small: true, onDone: b => { if (b?.self) go(b.self); }});
    btn.classList.add("primary");
    card.append(el("div", {class:"kc-foot"}, btn));
  }
  return env;
}

/* ── collection screen ─────────────────────────────────────────────── */
function parseHrefQuery(href) {
  const [path, q] = href.split("?");
  return {path, params: new URLSearchParams(q || "")};
}

/* Active scalar filters whose names exactly match create-input
   properties become prefills — the user was already looking at that
   slice, so the form starts there (still editable). */
function filterPrefill(selfHref, entry) {
  const props = entry.input?.properties || {};
  const out = {};
  for (const [k, v] of new URLSearchParams(selfHref.split("?")[1] || "")) {
    if (["page", "sort", "rows"].includes(k) || k.startsWith("page[")) continue;
    if (/_(gte|lte)$/.test(k)) continue;
    if (!v || v.includes(",")) continue;
    if (k in props) out[k] = v;
  }
  return out;
}

function filterBar(query, selfHref) {
  const {path, params} = parseHrefQuery(selfHref);
  const bar = el("div", {class:"filterbar"});
  const props = query.input?.properties || {};
  const apply = (name, value) => {
    const p = new URLSearchParams(params);
    if (value) p.set(name, value); else p.delete(name);
    p.delete("page[number]");
    go(path + (p.toString() ? "?" + p : ""));
  };
  for (const [name, prop] of Object.entries(props)) {
    if (name.startsWith("page[")) continue;
    let input;
    if (prop.enum) {
      input = el("select", {name});
      input.append(el("option", {value: ""},
        name === "sort" ? "sort: default" : "—"));
      for (const v of prop.enum) {
        const count = prop["x-facets"]?.[v];
        input.append(el("option", {value: v},
          (name === "sort" ? "sort: " : "") + pretty(v)
          + (count !== undefined ? ` (${count})` : "")));
      }
      input.value = params.get(name) || "";
      input.addEventListener("change", () => apply(name, input.value));
    } else {
      input = el("input", {name, value: params.get(name) || "",
        type: prop.type === "integer" || prop.type === "number" ? "number" : "text",
        step: "any", placeholder: prop.format || prop.type || ""});
      input.addEventListener("change", () => apply(name, input.value));
    }
    bar.append(el("label", {title: name},
      xdisplay(query.input, name).label || title(name), input));
  }
  return bar;
}

/* facet chips: x-facets counts per faceted field, current filters lit —
   a chip click toggles membership in the comma list (x-in). */
function facetChips(query, selfHref) {
  const {path, params} = parseHrefQuery(selfHref);
  const rows = [];
  for (const [field, prop] of Object.entries(query.input?.properties || {})) {
    if (!prop["x-facets"]) continue;
    const active = (params.get(field) || "").split(",").filter(Boolean);
    const chips = Object.entries(prop["x-facets"]).map(([value, count]) => {
      const on = active.includes(value);
      return el("span", {class: "chip" + (on ? " on" : ""),
        onclick: () => {
          const next = on ? active.filter(v => v !== value) : [...active, value];
          const p = new URLSearchParams(params);
          if (next.length) p.set(field, next.join(",")); else p.delete(field);
          p.delete("page[number]");
          go(path + (p.toString() ? "?" + p : ""));
        }}, `${value} · ${count}`);
    });
    if (chips.length)
      rows.push(el("div", {class:"chips"},
        el("span", {class:"chip static"}, el("b", {}, field)), chips));
  }
  return rows;
}

function pagerOf(doc) {
  const page = doc.data?.page || {};
  const pager = el("div", {class:"pager"});
  if (doc.links?.prev) pager.append(el("a", {href:"#"+doc.links.prev.href}, "← prev"));
  pager.append(el("span", {class:"muted"},
    `page ${page.number || 1} · ${doc.data?.total ?? 0} total`));
  if (doc.links?.next) pager.append(el("a", {href:"#"+doc.links.next.href}, "next →"));
  return pager;
}

/* Collection items as a table. v10 items are envelope-minus-data
   summaries (declared columns are a recorded absence on this wire), so
   the columns are the honest ones: state, the server's own sentence,
   updated — plus each row's HONEST action buttons. */
function itemTable(items, opts) {
  opts = opts || {};
  if (!items.length) return el("p", {class:"muted"}, "No rows.");
  const anyActions = !!opts.rowAction ||
    items.some(i => i.actions && Object.keys(i.actions).length);
  const head = el("tr", {},
    opts.selectable ? el("th", {}, "") : null,
    el("th", {}, "State"), el("th", {}, "Summary"), el("th", {}, "Updated"),
    anyActions ? el("th", {}, "") : null);
  const tbody = el("tbody", {});
  for (const item of items) {
    const row = el("tr", {},
      opts.selectable ? el("td", {},
        el("input", {type: "checkbox", "data-bulk-check": "",
          onclick: e => e.stopPropagation()})) : null,
      el("td", {}, el("span", {class:"statechip"}, item.state)),
      el("td", {}, el("a", {href:"#"+item.self, title: item.self,
        style:"display:inline-block;max-width:420px;overflow:hidden;" +
              "text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom"},
        item.summary)),
      el("td", {class:"metaline mono"},
        ((item.meta || {}).updated_at || "").slice(0, 16).replace("T", " ")));
    if (opts.selectable) {
      const box = row.querySelector("[data-bulk-check]");
      const id = item.self.split("/").pop();
      box.addEventListener("change", () =>
        box.checked ? opts.selected.add(id) : opts.selected.delete(id));
    }
    if (anyActions) {

      const extra = opts.rowAction ? opts.rowAction(item) : null;
      if (extra) cell.append(extra);

function renderCollection(view, doc, hints) {
  const kind = doc.kind.replace("_collection", "");
  const panel = el("div", {class:"panel"});
  const colName = title(kind) + "s";
  panel.append(el("div", {class:"crumbs"},
    el("a", {href:"#"}, "Workspace"), " / ", colName));
  panel.append(el("h2", {}, colName));
  /* the server's own sentence, verbatim — it carries the honest filter

  const query = doc.actions?.query;

        onDone: b => { if (b?.self) go(b.self); else render(); }}));

                    onDone: () => render()});
    }}, (entry.display?.label || title(name)) + " (selected)"));
  panel.append(bar);

  const items = doc.data?.items || [];
  panel.append(itemTable(items, {
    selectable: bulkActions.length > 0, selected,
    ...(kind === "attachment" ? {rowAction: it => downloadButton(it, true)} : {})}));
  panel.append(pagerOf(doc));
  view.append(panel);

/* ── the deploy history: the definitions collection, rendered as what
   it is — the record of what the law has been, when. Violet is spent
   here and nowhere else. (v10 collection items are envelope-minus-data,
   so each row speaks through its stored summary; the full fingerprint

function renderDeployHistory(view, doc) {

/* ── the read surface, up front: link chips with badges as scent ───── */
function linksStrip(doc) {
  const rels = Object.entries(doc.links || {})
    .filter(([, l]) => l && l.href);
  if (!rels.length) return null;
  const row = el("div", {class:"chips", "data-links": ""});
  for (const [rel, l] of rels)
    row.append(el("a", {class:"chip link-chip", href:"#"+l.href,
                        title: l.summary || rel},
      title(rel), l.badge !== undefined && l.badge !== null
        ? el("b", {class:"badge", title:"count, per the server"},
            String(l.badge)) : null));
  return row;
}

/* declared surfaces: probe this row as an anchor; a 200 earns a chip */
async function surfaceChips(doc) {
  let w;
  try { w = await wellKnown(); } catch { return null; }
  const surfaces = Object.entries(w.surfaces || {});
  if (!surfaces.length) return null;
  const id = doc.self.split("/").pop();
  const chips = [];
  for (const [name, {href}] of surfaces) {
    const target = href.replace("{anchor-id}", id);
    const {ok} = await api(target);
    if (ok) chips.push(el("a", {href: "#" + target, class: "chip surface-link"},
      "⧉ " + name + " ↗"));
  }
  return chips.length ? el("div", {class:"chips"}, chips) : null;
}

/* ── refusals, ranked by what the reader can do with them ──────────────
   A countdown or a singular guard reason is decision fuel — it stays at
   the action bar (a dimmed button plus its honest reason). State gates
   and repeated identical reasons compress into a closed footer. */
function splitRefusals(doc) {
  const timed = [], gated = [], byReason = new Map();
  for (const [name, entry] of Object.entries(doc.unavailable || {})) {
    const hope = entry.becomes_available;
    if (hope?.at) timed.push([name, entry]);
    else if (hope?.in_states) gated.push([name, entry]);
    else {
      const k = entry.reason || "";
      if (!byReason.has(k)) byReason.set(k, []);
      byReason.get(k).push([name, entry]);
    }
  }
  const blocked = [...timed], grouped = [];
  for (const g of byReason.values())
    if (g.length === 1) blocked.push(g[0]); else grouped.push(g);
  return {blocked, grouped, gated};
}

/* A live countdown from becomes_available.at — the literal moment
   stays printed (machine truth), the tick is the courtesy. */
function countdownEl(at) {
  const span = el("span", {class:"countdown", style:"margin-left:6px",
                           title: new Date(at).toLocaleString()});
  const tick = () => {
    const ms = new Date(at) - Date.now();
    if (ms <= 0 || Number.isNaN(ms)) { span.textContent = ""; return true; }
    span.textContent = `· opens in ${dur(ms)}`;
    return false;
  };
  if (!tick()) {
    const t = setInterval(() => { if (tick()) clearInterval(t); }, 1000);
    liveTimers.push(t);
  }
  return span;
}
function dur(ms) {
  const s = Math.floor(ms / 1000), m = Math.floor(s / 60),
        h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d) return `${d}d ${h % 24}h`;
  if (h) return `${h}h ${m % 60}m`;
  if (m) return `${m}m ${s % 60}s`;
  return `${s}s`;
}
function becomesText(ba) {
  if (!ba) return "";
  if (ba.at) return "available at " + ba.at;
  if (ba.in_states) return "available in state(s) " + ba.in_states.join(", ");
  if (ba.requires) return "requires " + ba.requires;
  return "";
}

function blockedNotes(blocked, doc) {
  if (!blocked.length) return null;
  const box = el("ul", {class:"blockedwhy notnow"});
  for (const [name, entry] of blocked) {
    const li = el("li", {class:"item"},
      el("b", {}, label(name, entry)), " — ",
      el("span", {class:"why"}, entry.reason || ""),
      entry.becomes_available
        ? el("span", {class:"metaline"}, ` (${becomesText(entry.becomes_available)})`)
        : null);
    if (entry.becomes_available?.at)
      li.append(countdownEl(entry.becomes_available.at));
    const chips = remedyChips(entry.remedies, doc);
    if (chips) li.append(chips);
    box.append(li);
  }
  return box;
}

function notNowFooter(grouped, gated, doc) {
  const n = grouped.reduce((s, g) => s + g.length, 0) + gated.length;
  if (!n) return null;
  const box = el("div", {class:"cantyet"});
  for (const g of grouped)          // one reason, many actions: say it once
    box.append(el("div", {class:"item"},
      el("b", {}, g.map(([nm, e]) => label(nm, e)).join(", ")),
      el("div", {class:"why"}, g[0][1].reason || ""),
      remedyChips(g[0][1].remedies, doc)));
  const byStates = new Map();       // state gates: one line per destination
  for (const [nm, e] of gated) {
    const k = e.becomes_available.in_states.join(", ");
    if (!byStates.has(k)) byStates.set(k, []);
    byStates.get(k).push(label(nm, e));
  }
  for (const [states, names] of byStates)
    box.append(el("div", {class:"item"},
      el("b", {}, names.join(", ")),
      el("span", {class:"muted"}, ` — available in state(s) ${states}`)));
  return el("details", {class:"unavail"},
    el("summary", {class:"muted"}, `not now (${n})`), box);
}

/* ── remedies: the wire names the way out as "kind.action" tokens ── */
function remedyChips(remedies, doc, onAct) {
  if (!remedies || !remedies.length) return null;
  const docKind = (doc.kind || "").replace(/_collection$/, "");
  const box = el("span", {class:"remedies"});
  for (const token of remedies) {
    const dot = String(token).indexOf(".");
    const kind = dot > 0 ? token.slice(0, dot) : "";
    const action = dot > 0 ? String(token).slice(dot + 1) : String(token);
    if (kind === docKind && doc.actions?.[action]) {
      box.append(el("button", {type:"button", class:"chip remedy",
        title: `${token} — this action is on this page`,
        onclick: () => { onAct && onAct(); pulseAction(action); }},
        "→ " + label(action, doc.actions[action])));
    } else if (action === "create") {
      const chip = el("span", {class:"chip",
        title: `${token} — a remedy elsewhere`}, String(token));
      box.append(chip);
      wellKnown().then(w => {
        const col = collectionHref(w, kind);
        if (col) chip.replaceWith(el("a", {class:"chip remedy",
          href: "#"+col, onclick: () => { onAct && onAct(); },
          title: `${token} — opens the ${pretty(kind)}s page`},
          `+ new ${pretty(kind)}`));
      }).catch(() => {});
    } else {
      box.append(el("span", {class:"chip",
        title: `${token} — a remedy this page can't reach directly`},
        String(token)));
    }
  }
  return box;
}
function pulseAction(name) {
  const btn = $(`#view button[data-action="${CSS.escape(name)}"]`);
  if (!btn) return;
  btn.scrollIntoView({behavior:"smooth", block:"center"});
  btn.focus({preventScroll: true});
  btn.classList.add("pulse");
  setTimeout(() => btn.classList.remove("pulse"), 1500);
}

/* ── values: honest rendering of the data document ─────────────────── */
function valueCell(v, xd) {
  if (v === null || v === undefined) return el("span", {class:"muted"}, "—");
  if (typeof v === "boolean") return v ? "✓" : el("span", {class:"muted"}, "—");
  if (Array.isArray(v)) {
    if (!v.length) return el("span", {class:"muted"}, "—");
    if (v.every(x => x && typeof x === "object" && !Array.isArray(x)))
      return nestedTable(v);
    return el("span", {}, v.map(x =>
      el("span", {class:"chip", style:"margin-right:4px"}, String(x))));
  }
  if (typeof v === "object") return kvTable(v);
  if ((xd || {}).widget === "prose" || (typeof v === "string" && v.includes("\n")))
    return el("div", {class:"prose", style:"white-space:pre-wrap;max-width:640px;" +
      "max-height:320px;overflow-y:auto"}, String(v));
  return el("span", {}, String(v));
}
function nestedTable(rows) {
  const cols = [...new Set(rows.flatMap(r => Object.keys(r)))]
    .filter(c => rows.some(r => r[c] !== null && r[c] !== undefined));
  return el("div", {style:"overflow-x:auto"}, el("table", {class:"items"},
    el("thead", {}, el("tr", {}, cols.map(c => el("th", {title: c}, title(c))))),
    el("tbody", {}, rows.map(r => el("tr", {},
      cols.map(c => el("td", {}, valueCell(r[c]))))))));
}
function kvTable(obj, schema) {
  const t = el("table", {class:"kv"});
  for (const [k, v] of Object.entries(obj)) {
    const xd = xdisplay(schema, k);
    const ref = xref(((schema || {}).properties || {})[k]);
    t.append(el("tr", {},
      el("td", {class:"k", title: xd.label || title(k)}, k),
      el("td", {}, ref && v ? resourceRef(ref.kind, v) : valueCell(v, xd))));
  }
  return t;
}

/* A cross-resource reference: a link to the referenced resource,
   labeled lazily by its own summary. Raw ids are machine plumbing —
   humans get the thing, not the token. (wire 10 has no lookup route
   class; the summary ride is a plain depth=summary read.) */
function resourceRef(kind, id, text) {
  const a = el("a", {href: "#", class:"mono", title: String(id)},
    text || `${pretty(kind || "")} · ${String(id).slice(0, 8)}`);
  wellKnown().then(w => {
    const col = kind && collectionHref(w, kind);
    if (!col) return;
    a.href = "#" + col + "/" + id;
    if (!text) api(`${col}/${id}?depth=summary`).then(({ok, body}) => {
      if (ok && body.summary) { a.textContent = body.summary; a.className = ""; }
    }).catch(() => {});
  }).catch(() => {});
  return a;
}

/* ── the parts namespace: placed actions re-rendered per data item —
   the item rows render HERE (with their honest buttons and their
   per-item refusal narrations), not in the data table ──────────────── */
function partsSections(doc) {
  return Object.entries(doc.parts || {}).map(([scope, group]) => {
    const items = group.items || [];
    const cols = [...new Set(items.flatMap(it => Object.keys(it.item || {})))]
      .filter(c => items.some(it => (it.item || {})[c] !== null &&
                                    (it.item || {})[c] !== undefined));
    return el("div", {},
      el("h3", {class:"sect"}, title(scope)),
      el("div", {class:"panel", "data-part": scope, style:"padding:10px 14px"},
        el("div", {style:"overflow-x:auto"}, el("table", {class:"items"},
          el("thead", {}, el("tr", {},
            cols.map(c => el("th", {title: c}, title(c))), el("th", {}, ""))),
          el("tbody", {}, items.map(it =>
            el("tr", {"data-part-key": String(it.key)},
              cols.map(c => el("td", {}, valueCell((it.item || {})[c]))),
              el("td", {class:"partactions"},
                Object.entries(it.actions || {}).map(([name, entry]) =>
                  actionButton({name, entry, doc, small: true,
                                onDone: () => render()})),
                Object.entries(it.unavailable || {}).map(([name, entry]) =>
                  el("button", {disabled: "", class:"blocked",
                                title: entry.reason || ""},
                     title(name)))))))))));
  });
}

/* embed=true links arrive with server-spliced envelope-minus-data items
   under links.<rel>.embedded — the rows are already in the envelope */
function embeddedSections(doc) {
  return Object.entries(doc.links || {})
    .filter(([, link]) => (link.embedded || []).length)
    .map(([rel, link]) => el("div", {class:"embed"},
      el("div", {class:"embed-head"},
        el("b", {}, link.summary || title(rel)),
        link.badge !== undefined && link.badge !== null
          ? el("span", {class:"badge", title:"count, per the server"},
              String(link.badge)) : null,
        el("a", {class:"open", href:"#"+link.href}, "open ↗")),
      itemTable(link.embedded, {})));
}

/* ── resource screen ───────────────────────────────────────────────── */
function label(name, entry) { return entry.display?.label || title(name); }

async function renderResource(view, doc, hints) {
  hints = hints || {};
  const panel = el("div", {class:"panel"});
  const kind = doc.kind;
  const colHref = doc.self.split("/").slice(0, 3).join("/");
  panel.append(el("div", {class:"crumbs"},
    el("a", {href:"#"}, "Workspace"), " / ",
    el("a", {href:"#"+colHref}, title(kind) + "s"), " / ",
    el("span", {class:"id", title: doc.self},
      doc.self.split("/").pop().slice(0, 8))));
  panel.append(el("h2", {class:"prose"}, doc.summary || title(kind)));
  const meta = doc.meta || {};
  panel.append(el("div", {},
    el("span", {class:"statechip", title: kind}, doc.state),
    el("span", {class:"version"},
      `v${meta.version}` +
      (meta.law_revision != null ? ` · law r${meta.law_revision}` : "") +
      (meta.updated_at ? ` · ${String(meta.updated_at).slice(0, 19).replace("T", " ")}` : "")),
    el("span", {class:"version", title: doc.self}, doc.self)));

  /* the read surface up front: declared links (badges riding) and the
     surfaces this row anchors — scent before the scroll */
  const chips = linksStrip(doc);
  if (chips) panel.append(chips);
  const surfBox = el("div", {});
  panel.append(surfBox);
  surfaceChips(doc).then(c => { if (c) surfBox.append(c); }).catch(() => {});

  /* buttons = actions, ordered by display.order. Parts are a
     REFINEMENT, not a replacement (the v10 envelope doctrine): a
     placed action renders here with its full schema AND re-renders
     per item below with the scope key const-bound. */
  /* suggested actions (co-presence): remedies on this doc's refusals
     may name a same-kind action that IS here — the way out gains a
     ring; nothing is demoted */
  const suggested = new Set();
  for (const entry of Object.values(doc.unavailable || {}))
    for (const t of entry.remedies || []) {
      const dot = String(t).indexOf(".");
      if (dot > 0 && t.slice(0, dot) === kind && (doc.actions || {})[t.slice(dot + 1)])
        suggested.add(t.slice(dot + 1));
    }
  const bar = el("div", {class:"actions"});
  const entries = Object.entries(doc.actions || {})
    .sort(([a, ea], [b, eb]) =>
      ((ea.display || {}).order ?? 99) - ((eb.display || {}).order ?? 99) ||
      a.localeCompare(b));
  for (const [name, entry] of entries) {
    const btn = actionButton({name, entry, doc, onDone: out => {
      if (out && out.self && out.self !== doc.self) go(out.self);
      else render();
    }});
    if (suggested.has(name)) {
      btn.classList.add("suggested");
      btn.append(el("span", {class:"suggest-chip",
        title: "a refusal on this page names this action as the remedy"},
        "suggested"));
    }
    bar.append(btn);
  }
  /* refused actions keep their seats in the bar, dimmed; their honest
     reasons render just below, at the point of intent */
  const {blocked, grouped, gated} = splitRefusals(doc);
  for (const [name, entry] of blocked)
    bar.append(el("button", {class:"blocked", disabled:"",
      title: entry.reason || ""}, label(name, entry)));
  for (const [name, entry] of gated)
    bar.append(el("button", {class:"blocked", disabled:"",
      title: entry.reason || ""}, label(name, entry)));
  /* the grant scope (wire 10): a grant row is a scope SELECTOR its
     audience presents via X-Waymark-Grant — this session can put it on */
  if (kind === "grant") {
    const gid = doc.self.split("/").pop();
    const on = localStorage.getItem("wm10.grant") === gid;
    bar.append(el("button", {
      title: on ? "stop reading through this grant"
                : "send X-Waymark-Grant with this grant's id on every request "
                  + "— the principal must be the grant's audience",
      onclick: () => {
        if (on) localStorage.removeItem("wm10.grant");
        else localStorage.setItem("wm10.grant", gid);
        grantChip(); render();
      }}, on ? "✓ scoped to this grant" : "🔭 act under this grant"));
  }
  /* an uploaded attachment: offer its bytes back (the bytes route is
     the engine's static /api/attachments/{id}/bytes) */
  if (kind === "attachment" && doc.state === "uploaded") {
    const id = doc.self.split("/").pop();
    if (isViewable(doc.data?.media_type))
      bar.append(el("button", {title:"open in a new tab",
        onclick: () => viewAttachment(id)}, "View"));
    bar.append(el("button", {class:"primary", title:"save the file",
      onclick: () => downloadAttachment(id, doc.data?.name)}, "↓ Download"));
  }
  panel.append(bar);
  const notes = blockedNotes(blocked, doc);
  if (notes) panel.append(notes);

  /* the data document: fields a parts group re-renders (with buttons)
     leave the kv table */
  const partPaths = new Set(Object.keys(doc.parts || {}));
  const plainData = Object.fromEntries(
    Object.entries(doc.data || {}).filter(([k]) => !partPaths.has(k)));
  view.append(panel);
  view.append(...partsSections(doc));
  const dataPanel = el("div", {class:"panel"},
    el("details", {open:""},
      el("summary", {class:"muted"}, "Data"),
      kvTable(plainData, hints)));
  for (const sec of embeddedSections(doc)) dataPanel.append(sec);
  /* the resource's own history: its transition log, replayed from the
     events stream (Last-Event-ID 0), collapsed by default */
  dataPanel.append(historySection(`${doc.self}/-/events`));
  const footer = notNowFooter(grouped, gated, doc);
  if (footer) dataPanel.append(footer);
  view.append(dataPanel);
  watchScope({self: doc.self});
}

/* ── the surface screen: the composed decision view (wire 10 shape:
   {name, anchor: the full envelope, members, showcase, attention}) ── */
function renderSurface(view, doc) {
  const anchor = doc.anchor || {};
  const panel = el("div", {class:"panel"});
  panel.append(el("div", {class:"crumbs"},
    el("a", {href:"#"}, "Workspace"),
    anchor.self ? [" / ", el("a", {href:"#"+anchor.self, title: anchor.self},
                             title(anchor.kind || "anchor"))] : null,
    " / ", el("span", {class:"surface-mark", title: doc.self},
      "⧉ " + pretty(doc.name || "surface"))));
  panel.append(el("h2", {}, title(doc.name || "surface")));
  if (anchor.summary)
    panel.append(el("div", {class:"summary"}, anchor.summary));
  const flags = Object.entries(doc.attention || {});
  if (flags.length)
    panel.append(el("div", {class:"chips"}, flags.map(([f, up]) =>
      el("span", {class: "flag " + (up ? "up" : "down"),
                  title: up ? "attention: the declared value holds"
                            : "quiet"}, f + (up ? " ⚑" : " ·")))));
  /* showcased actions first and prominent; the anchor's other actions
     follow — order is the declaration's, not this client's */
  const showcase = new Set(doc.showcase || []);
  const bar = el("div", {class:"actions"});
  for (const name of doc.showcase || []) {
    const entry = (anchor.actions || {})[name];
    if (!entry) continue;
    const btn = actionButton({name, entry, doc: anchor, onDone: () => render()});
    btn.classList.add("primary", "suggested");
    btn.append(el("span", {class:"suggest-chip",
      title: "showcased by this surface's definition"}, "showcased"));
    bar.append(btn);
  }

  if (input && dryRunnable(entry.href)) {
    form.addEventListener("focusout", () => {
      clearTimeout(dryTimer);
      dryTimer = setTimeout(async () => {
        const payload = body();
        if (!payload) return;
        const sep = entry.href.includes("?") ? "&" : "?";
        const res = await api(entry.href + sep + "dry_run=1",
          {method: "POST", body: payload, headers: actHeaders()});
        clearServerErrors();
        if (!res.ok && res.status === 422) showFieldErrors(res.body);
      }, 120);
    });
  }

  function body() {
    const values = input ? collectValues(form, input) : {};
    if (bulkIds) values.ids = bulkIds;
    return Object.keys(values).length ? JSON.stringify(values) : null;
  }
  function actHeaders() {
    const h = {};
    if (safety.fence && (doc.meta || {}).etag) h["If-Match"] = doc.meta.etag;
    if (idemKey) h["Idempotency-Key"] = idemKey;
    if (acknowledged.length) h["Waymark-Acknowledge"] = acknowledged.join(",");
    return h;
  }
  function clearServerErrors() {
    for (const node of dlg.querySelectorAll("[data-srverr]"))
      node.textContent = "";
  }
  function showFieldErrors(problem) {
    for (const [field, msgs] of Object.entries((problem || {}).errors || {})) {
      const slot = dlg.querySelector('[data-srverr="' + field + '"]');
      const text = Array.isArray(msgs) ? msgs.join("; ") : String(msgs);
      if (slot) slot.textContent = text;
      else errBox.append(el("div", {class: "problem"}, field + ": " + text));
    }
  }
  function showErrors(problem) {
    errBox.replaceChildren();
    clearServerErrors();
    showFieldErrors(problem);
    if (!Object.keys((problem || {}).errors || {}).length)
      errBox.append(problemBox(problem || {}));
  }
  async function check() {           /* dry-run pre-validation (rule 5) */
    const sep = entry.href.includes("?") ? "&" : "?";
    const res = await api(entry.href + sep + "dry_run=1",
      {method: "POST", body: body(), headers: actHeaders()});
    errBox.replaceChildren();
    if (res.ok) {
      const warns = (res.body || {}).warnings || [];
      errBox.append(el("div", {class: "validok"},
        "✓ schema and guards accept this input" +
        (warns.length ? " (with warnings)" : "")));
      for (const w of warns)
        errBox.append(el("div", {class: "warnbox"},
          el("span", {class:"prose"}, w.reason || w.name),
          remedyChips(w.remedies, doc, () => closeDlg())));
    } else showErrors(res.body);
  }
  async function submit() {
    disarmDraft();                   /* the invoke consumes the draft */
    const res = await api(entry.href,
      {method: "POST", body: body(), headers: actHeaders()});
    if (res.ok) {
      closeDlg();
      if ((res.body || {}).kind === "bulk_report") reportDialog(res.body);
      else maybeUndoToast(name, doc, res.body || {});
      onDone && onDone(res.body);
      return;
    }
    disarmed = false;
    const problem = res.body || {};
    /* the acknowledge protocol (guard names ride kebab on wire 10):
       warnings are a dialog, not a dead end — the problem body names
       its own header and names, so nothing is hardcoded */
    if (res.status === 409 && problem.acknowledge && problem.acknowledge.names) {
      errBox.replaceChildren(el("div", {class: "warnbox"},
        el("b", {}, "The server warns:"),
        el("ul", {}, (problem.warnings || []).map(w =>
          el("li", {}, (w.name ? w.name + ": " : "") + (w.reason || ""),
             remedyChips(w.remedies, doc, () => closeDlg())))),
        el("div", {class: "actions"},
          el("button", {class: "primary", onclick: () => {
            acknowledged = problem.acknowledge.names;
            submit();            /* same key: the retry is the same attempt */
          }}, "Acknowledge and retry"))));
      return;
    }
    if (res.status === 412) {
      errBox.replaceChildren(el("div", {class: "problem"},
        (problem.detail || "The resource changed since you read it."), " ",
        el("button", {onclick: async () => {
          const fresh = await api(doc.self);
          if (fresh.ok) { doc = fresh.body; errBox.replaceChildren(
            el("div", {class: "validok"}, "re-read — try again")); }
        }}, "Re-read")));
      return;
    }
    showErrors(problem);
  }

  document.body.append(dlg);
  dlg.addEventListener("close", () => dlg.remove());
  dlg.showModal();
}
