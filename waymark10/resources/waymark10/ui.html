/* ── undo: an inverse action present in the post-action document ───── */
async function invokeBare(entry, doc) {
  const h = {};
  if (entry.safety?.fence && doc.meta?.etag) h["If-Match"] = doc.meta.etag;
  if (entry.safety && entry.safety.idempotent === false)
    h["Idempotency-Key"] = uuid();
  return api(entry.href, {method: entry.method || "POST",
                          body: JSON.stringify({}), headers: h});
}
function maybeUndoToast(name, before, after) {
  const t = $("#toast");
  t.textContent = "";
  t.append(`${pretty(name)} ✓`);
  const backTo = before.state;
  const inverse = Object.entries(after.actions || {})
    .find(([, a]) => a.effect?.to === backTo);
  if (inverse && backTo && after.state !== backTo) {
    const [invName, invEntry] = inverse;
    t.append(el("button", {"data-undo": invName, onclick: async () => {
      await invokeBare(invEntry, after);
      t.style.display = "none";
      render();
    }}, `undo (${label(invName, invEntry)})`));
  }
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 6000);
}

function problemBox(p) {
  p = p || {};
  const box = el("div", {class:"problem"},
    el("b", {}, p.title || "Error"), " — ",
    el("span", {class:"detail"}, p.detail || ""));
  if (p.errors) box.append(el("ul", {},
    Object.entries(p.errors).map(([f, msgs]) =>
      el("li", {}, `${f}: ${Array.isArray(msgs) ? msgs.join("; ") : msgs}`))));
  if (p.resource && p.resource.self)
    box.append(el("div", {style:"margin-top:4px"},
      el("a", {href:"#"+p.resource.self}, "view current state")));
  return box;
}

/* ── attachments: the bytes ride the engine's static route
   /api/attachments/{id}/bytes (wire 10 advertises no template — a
   recorded adaptation from 9's discovery-advertised route) ─────────── */
function bytesHref(id) { return `/api/attachments/${encodeURIComponent(id)}/bytes`; }
function isViewable(mime) {
  return /^(image\/|text\/)/.test(mime || "") || mime === "application/pdf";
}
async function fetchAttachmentBlob(id) {
  try {
    const res = await fetch(bytesHref(id), {headers: principalHeaders()});
    if (!res.ok) { toast(`couldn't fetch the file — ${res.status}`); return null; }
    return await res.blob();
  } catch { toast("couldn't reach the file"); return null; }
}
async function downloadAttachment(id, name) {
  const blob = await fetchAttachmentBlob(id);
  if (!blob) return;
  const obj = URL.createObjectURL(blob);
  const a = el("a", {href: obj, download: name || "file"});
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(obj), 10000);
}
async function viewAttachment(id) {
  const blob = await fetchAttachmentBlob(id);
  if (!blob) return;
  const obj = URL.createObjectURL(blob);
  window.open(obj, "_blank");
  setTimeout(() => URL.revokeObjectURL(obj), 60000);
}
function downloadButton(item, small) {
  if (!item || item.state !== "uploaded") return null;
  const id = String(item.self).split("/").pop();
  const btn = el("button", {
    style: small ? "font-size:12px;padding:3px 8px" : "",
    title:"download this file"}, "↓ Download");
  btn.addEventListener("click", () => downloadAttachment(id, null));
  return btn;
}
function humanSize(n) {
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
  return `${(n / 1024 / 1024).toFixed(1)} MB`;
}
function uploadButton({entry, doc, prefill, onDone, small}) {
  const btn = el("button", {class:"primary", "data-action":"create",
    style: small ? "font-size:12px;padding:3px 8px" : ""}, "Upload file");
  btn.addEventListener("click", () =>
    uploadDialog({entry, doc, prefill, onDone}));
  return btn;
}
/* the two-phase reserve→PUT-bytes flow: the create action's own href
   reserves the row; the bytes go to the static route. name and the
   media type come off the chosen File. */
async function uploadDialog({entry, doc, prefill, onDone}) {
  prefill = prefill || {};
  const props = entry.input?.properties || {};
  const mediaField = "media_type" in props ? "media_type"
                   : "mime" in props ? "mime" : null;
  const file = el("input", {type:"file", id:"f_file"});
  const preview = el("div", {class:"muted mono", style:"margin:6px 0"},
    "no file chosen");
  const errBox = el("div", {});
  const upBtn = el("button", {class:"primary", disabled:"true"}, "Upload");
  let chosen = null, reservedId = null, reservedBody = null;
  file.addEventListener("change", () => {
    chosen = file.files && file.files[0];
    if (chosen) {
      preview.textContent = `${chosen.name} · `
        + `${chosen.type || "application/octet-stream"} · `
        + `${humanSize(chosen.size)}`;
      upBtn.removeAttribute("disabled");
    } else {
      preview.textContent = "no file chosen";
      upBtn.setAttribute("disabled", "true");
    }
  });
  const extraForm = el("div", {});
  for (const [k, rawProp] of Object.entries(props)) {
    if (k === "name" || k === mediaField || k === "size" || k === "sha256") continue;
    const prop = schemaProp(rawProp);
    if (prop.const !== undefined) continue;
    extraForm.append(el("div", {class:"field"},
      el("label", {}, el("b", {}, k)),
      fieldWidget(k, rawProp, prefill[k])));
  }
  const dlg = el("dialog", {},
    el("div", {class:"dlghead"}, el("h3", {}, "Upload a file"),
      el("p", {class:"metaline"}, "reserved → uploaded · the bytes are written once")),
    el("div", {class:"dlgbody"},
      el("div", {class:"field"}, el("label", {}, el("b", {}, "File")),
        file, preview),
      extraForm, errBox),
    el("div", {class:"dlgfoot"},
      el("button", {onclick: () => { dlg.close(); dlg.remove();
                                     if (reservedId) render(); }}, "Cancel"),
      upBtn));
  upBtn.addEventListener("click", async () => {
    if (!chosen) return;
    errBox.textContent = "";
    upBtn.setAttribute("disabled", "true");
    if (!reservedId) {
      const create = {name: chosen.name};
      if (mediaField) create[mediaField] = chosen.type || "application/octet-stream";
      for (const [k, rawProp] of Object.entries(props)) {
        const prop = schemaProp(rawProp);
        if (prop.const !== undefined) create[k] = prop.const;
      }
      for (const node of extraForm.querySelectorAll("[name]"))
        if (node.value) create[node.getAttribute("name")] = node.value;
      const res = await api(entry.href, {method: entry.method || "POST",
        body: JSON.stringify(Object.assign({}, prefill, create))});
      if (!res.ok) {
        errBox.append(problemBox(res.body));
        upBtn.removeAttribute("disabled");
        return;
      }
      reservedBody = res.body;
      reservedId = String(res.body.self).split("/").pop();
    }
    try {
      const res = await fetch(bytesHref(reservedId), {method:"PUT",
        headers: {...principalHeaders(),
          "Content-Type": chosen.type || "application/octet-stream"},
        body: chosen});
      if (!res.ok) {
        const b = await res.json().catch(() => null);
        errBox.append(problemBox(b || {title:"Upload failed",
          detail:`the bytes route returned ${res.status} — the file is `
            + "reserved; try uploading again"}));
        upBtn.removeAttribute("disabled");  /* retry re-PUTs the same reserve */
        return;
      }
    } catch {
      errBox.append(problemBox({title:"Upload failed",
        detail:"could not reach the bytes route — the file is reserved; try again"}));
      upBtn.removeAttribute("disabled");
      return;
    }
    dlg.close(); dlg.remove();
    toast(`${chosen.name} uploaded ✓`);
    onDone && onDone(reservedBody);
  });
  document.body.append(dlg);
  dlg.showModal();
}

/* ── events: fetch-based SSE (principal headers ride along), parsing
   the wire's named frames — `event: transition` with ids,
   `event: derivation` without ─────────────────────────────────────── */
function parseFrame(frame) {
  let event = "message", id = null, data = null;
  for (const line of frame.split("\n")) {
    if (line.startsWith("event:")) event = line.slice(6).trim();
    else if (line.startsWith("id:")) id = line.slice(3).trim();
    else if (line.startsWith("data:")) data = line.slice(5).trim();
  }
  if (!data) return null;
  try { return {event, id, data: JSON.parse(data)}; } catch { return null; }
}
async function sse(href, onFrame) {
  while (true) {
    try {
      const res = await fetch(href, {headers: principalHeaders()});
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        buf += decoder.decode(value, {stream: true});
        let idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          const f = parseFrame(buf.slice(0, idx));
          buf = buf.slice(idx + 2);
          if (f) onFrame(f);
        }
      }
    } catch (_e) { /* server restarting */ }
    await new Promise(r => setTimeout(r, 2000));
  }
}
/* a one-shot replay: read frames until the burst goes quiet, then stop */
function fetchReplay(href, {idle = 500} = {}) {
  return new Promise(async resolve => {
    const ctl = new AbortController();
    const frames = [];
    let timer = null, settled = false;
    const settle = () => {
      if (settled) return; settled = true;
      clearTimeout(timer); ctl.abort(); resolve(frames);
    };
    const bump = () => { clearTimeout(timer); timer = setTimeout(settle, idle); };
    bump();
    try {
      const sep = href.includes("?") ? "&" : "?";
      const res = await fetch(href + sep + "last_event_id=0",
        {signal: ctl.signal, headers: principalHeaders()});
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        buf += decoder.decode(value, {stream: true});
        let idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          const f = parseFrame(buf.slice(0, idx));
          buf = buf.slice(idx + 2);
          if (f) { frames.push(f); bump(); }
        }
      }
    } catch (_e) { /* aborted on idle, or the server hiccupped */ }
    settle();
  });
}

/* ── follow a principal (supervision): their transitions steer this
   screen. The firehose names the actor on every event; following is a
   client-side filter plus navigation. (9's presence stream — where
   your screen went where they merely LOOKED — has no wire-10 route;
   only committed transitions steer here. Recorded gap.) ────────────── */
let followId = localStorage.getItem("wm10.follow.id") || null;
let followName = localStorage.getItem("wm10.follow.name") || null;
function follow(actor) {
  followId = actor.id;
  followName = actor.display || actor.id;
  localStorage.setItem("wm10.follow.id", followId);
  localStorage.setItem("wm10.follow.name", followName);
  followChip();
}
function unfollow() {
  followId = followName = null;
  localStorage.removeItem("wm10.follow.id");
  localStorage.removeItem("wm10.follow.name");
  followChip();
}
function followChip() {
  const chip = $("#followchip");
  chip.style.display = followId ? "inline-block" : "none";
  chip.textContent = "";
  if (followId)
    chip.append(`following ${followName}`,
      el("button", {title: "stop following", onclick: unfollow}, "✕"));
}
const bootParams = new URLSearchParams(location.search);
if (bootParams.get("follow")) {
  follow({id: bootParams.get("follow"),
          display: bootParams.get("follow_name") || bootParams.get("follow")});
  history.replaceState(null, "", location.pathname + location.hash);
}
followChip();

/* ── the ledger rows: time in mono, the actor marked by type, machine
   facts quiet, and the law loud — exactly once, when it changes ────── */
const ACTOR_MARKS = {human: "●", agent: "◆", system: "○"};
function evTime(at) {
  return el("span", {class:"ev-time"},
    at ? new Date(at).toLocaleTimeString([], {hour12: false}) : "");
}
function actorChip(actor) {
  actor = actor || {};
  return el("span", {class:"actor-chip",
      title: `follow ${actor.display || actor.id || "?"}'s actions`,
      onclick: () => { follow(actor); toast(`following ${actor.display || actor.id}`); }},
    el("span", {class:"actor-mark " + (actor.type || "human")},
      ACTOR_MARKS[actor.type] || "●"),

}
function lawStampChip(ev) {
  return ev.law_revision != null
    ? el("span", {class:"anchor law-chip",
        title: `written under law revision ${ev.law_revision}`},
        "⚖ r" + ev.law_revision)

}
function ledgerRow(ev, isFollowed) {
  return el("div", {class: "ev" + (isFollowed ? " followed" : "")},
    el("div", {class:"ev-head"},
      evTime(ev.at), " ", actorChip(ev.actor), lawStampChip(ev)),
    el("div", {class:"ev-body"},
      `${pretty(ev.action || "")} · `,
      el("a", {href:"#"+ev.self, title: `${ev.from ?? "·"} → ${ev.to}`},
        `${pretty(ev.kind || "")}: ${ev.from ? pretty(ev.from) : "·"} → ${pretty(ev.to || "")}`)));
}
function derivRow(ev) {
  /* a derivation-class event: maintenance changed a fact no transition
     announces — quiet, mono. self is null when the whole kind restamped. */
  const what = Array.isArray(ev.changed) ? ev.changed.join(", ")
    : typeof ev.changed === "object" && ev.changed ? Object.keys(ev.changed).join(", ")
    : String(ev.changed ?? "");
  return el("div", {class:"ev deriv"},
    evTime(ev.at), " ",
    ev.self ? el("a", {href:"#"+ev.self}, `ƒ ${ev.class || "derivation"} · ${what}`)
            : el("span", {}, `ƒ ${ev.class || "derivation"} · ${pretty(ev.kind || "")} · ${what}`));
}
/* The law line — the signature: a full-width violet rule when the
   definition kind itself transitions. Degrades to the stored summary;
   enriched from the definition row itself. */
function lawLineRow(ev) {
  const detail = el("span", {class:"law-detail"},
    ev.summary || (ev.self || "").split("/").pop().slice(0, 8));
  const row = el("div", {class:"ev law-line"},
    el("div", {},
      el("span", {class:"law-stamp"},
        "⚖ ", ev.action === "create" ? "law recorded" : "law revised"),
      " · ", el("a", {href:"#"+ev.self, class:"law-link"}, detail)),
    evTime(ev.at));
  api(ev.self).then(({ok, body}) => {
    if (!ok || !body.data) return;
    const d = body.data;
    const bits = [`${pretty(d.target_kind || "")} · rev ${d.revision}`];
    if (d.diff_class && d.diff_class !== "initial") bits.push(d.diff_class);
    if (d.change_summary) bits.push(d.change_summary);
    detail.textContent = bits.join(" · ");
  }).catch(() => {});
  return row;
}

/* ── the per-resource history panel: this row's transition log,
   replayed from its events stream (wire 10 frames carry no recorded
   inputs and no version — the replay's own order is the order) ────── */
let historyOpen = false;
function historySection(streamHref) {
  const count = el("span", {class:"muted mono", style:"font-size:11px"});
  const body = el("div", {class:"history-body"});
  const sec = el("details", historyOpen ? {class:"history", open:""}
                                        : {class:"history"},
    el("summary", {class:"muted"}, "History ", count), body);
  let loaded = false;
  const load = () => {
    if (loaded) return;
    loaded = true;
    body.append(el("span", {class:"muted"}, "…"));
    fetchReplay(streamHref).then(frames => {
      if (!document.contains(body)) return;   // superseded by a re-render
      const trans = frames.filter(f => f.event === "transition").map(f => f.data);
      trans.reverse();                        // replay is id order: newest first
      body.textContent = "";
      count.textContent = trans.length ? `(${trans.length})` : "";
      if (!trans.length)
        return body.append(el("span", {class:"muted"}, "no transitions yet"));
      for (const ev of trans)
        body.append(el("div", {class:"ev"},
          el("div", {class:"ev-head"},
            evTime(ev.at), " ", actorChip(ev.actor), lawStampChip(ev)),
          el("div", {class:"ev-body"},
            `${pretty(ev.action || "")} · `,
            `${ev.from ? pretty(ev.from) : "·"} → ${pretty(ev.to || "")}`)));
    }).catch(() => {
      if (!document.contains(body)) return;
      body.textContent = "";
      body.append(el("div", {class:"muted"}, "couldn't load history"));
    });
  };
  sec.addEventListener("toggle", () => {
    historyOpen = sec.open;
    if (sec.open) load();
  });
  if (historyOpen) load();
  return sec;
}

/* ── the activity drawer: the ledger's one global home. Closed ≠ torn
   down — arrivals count into the pip (violet the moment the law
   moves); opening clears it. ───────────────────────────────────────── */
const ledgerEl = $("#ledger");
const ledgerToggle = $("#ledgertoggle");
const ledgerPip = $("#ledgerpip");
let ledgerUnread = 0, ledgerUnreadLaw = false;
function paintPip() {
  if (!ledgerUnread) { ledgerPip.style.display = "none"; return; }
  ledgerPip.textContent = ledgerUnread > 99 ? "99+" : String(ledgerUnread);
  ledgerPip.className = ledgerUnreadLaw ? "law" : "";
  ledgerPip.style.display = "inline-block";
}
const ledgerIsOpen = () => ledgerEl.classList.contains("open");
function setLedger(open, opts) {
  const moveFocus = !opts || opts.focus !== false;
  ledgerEl.classList.toggle("open", open);
  ledgerToggle.setAttribute("aria-expanded", String(open));
  localStorage.setItem("wm10.ledger.open", open ? "1" : "0");
  if (open) {
    ledgerUnread = 0; ledgerUnreadLaw = false; paintPip();
    if (moveFocus) ledgerEl.focus();
  } else if (moveFocus) ledgerToggle.focus();
}
ledgerToggle.addEventListener("click", () => setLedger(!ledgerIsOpen()));
$("#ledgerclose").addEventListener("click", () => setLedger(false));
ledgerEl.addEventListener("keydown", ev => {
  if (ev.key === "Escape") { ev.stopPropagation(); setLedger(false); }
});
if (localStorage.getItem("wm10.ledger.open") === "1")
  setLedger(true, {focus: false});

/* what the current screen is watching: a transition (or derivation)
   touching it refetches, debounced — a burst becomes one read */
let SCOPE = {};
let refetchTimer = null;
function watchScope(scope) { SCOPE = scope || {}; }
function scopeHit(t) {
  return (SCOPE.self && (t.self === SCOPE.self ||
                         (t.self || "").startsWith(SCOPE.self + "/"))) ||
         (SCOPE.kind && t.kind === SCOPE.kind);
}
function tickerLine(t) {
  $("#ticker").replaceChildren(
    el("span", {}, (t.at || "").slice(11, 19) + " · ",
      el("b", {}, ((t.actor || {}).id || "?")), " ", t.action || "", " · ",
      t.kind || "", " ", (t.from || "·") + " → " + (t.to || "·"), " · ",
      el("a", {href: "#" + t.self, class: "mono"}, t.self || "")));
}

const seen = new Set();  // dedupe — at-least-once delivery
sse("/api/-/events", ({event, id, data: ev}) => {
  const feed = $("#feed");
  if (event === "derivation") {
    const key = `d:${ev.kind}#${ev.self}#${ev.at}`;
    if (seen.has(key)) return;
    seen.add(key);
    feed.prepend(derivRow(ev));
    if (scopeHit(ev)) {
      clearTimeout(refetchTimer);
      refetchTimer = setTimeout(render, 350);
    }
    return;
  }
  if (event !== "transition") return;
  const key = id ? `t:${id}` : `t:${ev.self}#${ev.at}`;
  if (seen.has(key)) return;
  seen.add(key);
  tickerLine(ev);
  const isFollowed = !!(followId && ev.actor && ev.actor.id === followId);
  let lawLine = false;
  if (ev.kind === "definition") {
    lawLine = true;                    // the law moved: the one loud line
    feed.prepend(lawLineRow(ev));
  } else feed.prepend(ledgerRow(ev, isFollowed));
  if (!ledgerIsOpen()) {
    ledgerUnread += 1;
    if (lawLine) ledgerUnreadLaw = true;
    paintPip();
  }
  const here = decodeURIComponent(location.hash.slice(1)).split("?")[0];
  /* following: go where they went — unless a dialog is open (never yank
     a human out of a form they're typing in) */
  if (isFollowed && ev.self && ev.self !== here && !$("dialog[open]")) {
    location.hash = "#" + ev.self;
    return;
  }
  if (scopeHit(ev) ||
      (here && ev.self && here === ev.self.replace(/\/[^/]+$/, ""))) {
    clearTimeout(refetchTimer);
    refetchTimer = setTimeout(render, 350);
  }
});

$("#apphost").textContent = location.host;  // the honest app identity
render();
</script>
</body>
</html>
