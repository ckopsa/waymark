# Clojure CLI plus the dependency caches, in one place because five
# jobs need it identically.
#
# THE CACHE IS THE POINT. A cold `clojure -M:test` resolves the whole
# dependency tree from Maven Central and Clojars before a single
# assertion runs, and that resolve costs more than the tests do. Keyed
# on the deps.edn files, so it survives every commit that does not
# change a dependency — which is nearly all of them.
#
# The Maven repository is Maven's; the gitlibs store is tools.deps'
# store for :git/url coordinates. Neither is populated by the other, so
# both are named. .cpcache is deliberately NOT cached: it is
# per-checkout classpath memoisation, cheap to rebuild and a real
# source of stale confusion when restored across commits.
#
# EVERY JOB EXTRACTS INTO ITS OWN DIRECTORY, NOT INTO $HOME. Both
# caches restore under ${RUNNER_TEMP}, which one runner owns and the
# runner empties between jobs. On the self-hosted runners every runner
# on the node shares one home directory, and nine shards start within
# seconds of each other — so nine cache restores were unpacking into
# one ~/.m2 at once, and a shard whose JVM opened a jar another
# restore was still writing read a truncated file. 2026-09-17: four
# shards died before a single test body ran, each on a different jar
# ("zip END header not found" on the Clojure jar, "Could not locate
# ring/util/mime_type__init.class", "Could not locate
# clojure/spec/alpha__init.class", "Could not find or load main class
# clojure.main"). Every one passed on rerun, and no GitHub-hosted job
# has ever failed this way. It is the same race the JDK step below
# records, one directory over.
#
# THE KEY DID NOT MOVE. Only the extraction target did, so a job still
# downloads exactly what it downloaded before; what it no longer does
# is share the unpacked tree with eight siblings.
#
# THE PATHS TRAVEL IN VARIABLES, NOT IN EVERY COMMAND. The first step
# writes three names to GITHUB_ENV for the rest of the job:
# CLJ_M2_REPO (the Maven repository), GITLIBS (tools.deps reads this
# one by itself, so nothing has to pass it), and CLJ_SDEPS, the EDN
# map that carries the repository to tools.deps. Every clojure call in
# tests.yml spells it the same way:
#
#     clojure -Sdeps "$CLJ_SDEPS" -M:test
#
# -Sdeps comes BEFORE -M; the CLI reads it as an extra deps.edn merged
# over the project's, and nothing after -M is the CLI's to read. A
# developer's machine sets none of these variables, so `make test10`
# and `make check-queue` keep using ~/.m2 with no flag at all.
#
# No third-party action: this is a pinned installer script and two
# cache entries, which is less to trust and less to break than a
# marketplace dependency in the path of every test run.

name: setup-clojure
description: Install a pinned Clojure CLI and restore the Maven and gitlibs caches

inputs:
  cli-version:
    description: Clojure CLI version to install (must be an exact release)
    required: true

runs:
  using: composite
  steps:
    # Before the cache, because the cache unpacks into these two
    # directories and every later step needs their names.
    - name: Per-job dependency stores
      shell: bash
      run: |
        set -euo pipefail
        repo="${RUNNER_TEMP}/clojure-deps/m2/repository"
        gitlibs="${RUNNER_TEMP}/clojure-deps/gitlibs"
        mkdir -p "$repo" "$gitlibs"
        {
          echo "CLJ_M2_REPO=${repo}"
          echo "GITLIBS=${gitlibs}"
          echo "CLJ_SDEPS={:mvn/local-repo \"${repo}\"}"
        } >> "$GITHUB_ENV"
        echo "maven repository: ${repo}"
        echo "gitlibs store:    ${gitlibs}"

    - name: Cache Clojure dependencies
      uses: actions/cache@v4
      with:
        # Written by the step above. runner.temp belongs to one runner
        # and is emptied between jobs, so no two shards on a shared
        # host unpack into the same tree.
        path: |
          ${{ runner.temp }}/clojure-deps/m2/repository
          ${{ runner.temp }}/clojure-deps/gitlibs
        # Every deps.edn in the tree: waymark10 is a :local/root of both
        # others, so a change to any of them can move the resolved set.
        key: cljdeps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/deps.edn') }}
        # A partial hit still saves most of the download; tools.deps
        # fetches only what the new deps.edn adds.
        restore-keys: |
          cljdeps-${{ runner.os }}-${{ runner.arch }}-

    # The JDK, pinned to the same major the production image runs
    # (Dockerfile.workqueue10: temurin-21). GitHub's hosted image happens
    # to carry a JDK; the self-hosted runner image carries none, and the
    # Clojure CLI is a launcher that dies without one. setup-java is a
    # first-party GitHub action like actions/cache above, not a
    # marketplace dependency. On the self-hosted runner the tool cache is
    # a host volume, so this is a download exactly once per version.
    # Only when the runner does not already carry one. The self-hosted
    # image ships OpenJDK 21; on it, setup-java would download Temurin
    # into a tool cache SHARED by every runner on the node, and nine
    # shards starting together extracted into the same directory at
    # once — two of them then ran on a half-written JDK ("Unable to
    # load TZDB time-zone rules", "Could not link verifier"). A
    # GitHub-hosted image carries 17 and still gets 21 from here.
    # THE JDK IS PINNED, NOT FOUND. This step used to skip itself when
    # the runner already had a JDK 21 on PATH, which on the self-hosted
    # runners meant Ubuntu's openjdk-21 package — whatever build apt
    # last installed. 2026-09-06: five JVM crashes in an hour on those
    # runners, all on 21.0.12+8-1-24.04-Ubuntu, every one a different
    # frame inside the C2 compiler (Symbol::decrement_refcount,
    # DataLayout::data_in, Compile::remove_speculative_types,
    # PhaseChaitin::interfere_with_live, PhaseIterGVN::
    # add_users_to_worklist), while the same commits ran green on the
    # same host hours earlier. A toolchain the host owns is a toolchain
    # nobody pinned. Temurin from setup-java's tool cache is the same
    # binary on a self-hosted runner and a GitHub-hosted one — the
    # promise the Clojure CLI step below already makes.
    - name: Install JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"
        check-latest: false

    - name: Which JDK
      shell: bash
      run: java -version 2>&1 | head -2

    - name: Install Clojure CLI
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        set -euo pipefail
        if command -v clojure >/dev/null 2>&1; then
          echo "clojure already present: $(clojure --version 2>&1 | head -1)"
          exit 0
        fi
        # Pinned by version, not /latest/: a self-hosted runner and a
        # GitHub-hosted one must not end up on different toolchains.
        url="https://github.com/clojure/brew-install/releases/download/${CLI_VERSION}/linux-install.sh"
        curl -fsSL -o /tmp/linux-install.sh "$url"
        sudo bash /tmp/linux-install.sh
        clojure --version

