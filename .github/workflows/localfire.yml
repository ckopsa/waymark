# Builds the localfire image (Dockerfile.localfire) and, on main, names
# it to the cluster. Built the way image.yml builds workqueue10: GHCR
# with the built-in GITHUB_TOKEN, an arm64 runner so qemu never enters
# it, and the bare short sha as the tag.
#
# The deploy here only WRITES the tag to nomad/jobs/localfire/deploy.
# It dispatches nothing and restarts nothing: the localfire job reads
# the variable the next time it is (re)started.

name: localfire

on:
  push:
    branches: [main]
    paths:
      - 'localfire/**'
      - 'seat/**'
      - 'Dockerfile.localfire'
      - '.github/workflows/localfire.yml'
  pull_request:
    paths:
      - 'localfire/**'
      - 'seat/**'
      - 'Dockerfile.localfire'
      - '.github/workflows/localfire.yml'
  workflow_dispatch:

concurrency:
  group: localfire-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Tag
        id: tag
        # `git rev-parse --short HEAD`, as image.yml and the Makefile.
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Build into the local daemon first, so the checks below run the
      # exact image before anything is published.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.localfire
          platforms: linux/arm64
          load: true
          tags: localfire:ci
          cache-from: type=gha,scope=localfire
          cache-to: type=gha,mode=max,scope=localfire
          provenance: false

      - name: Check the image
        run: |
          docker run --rm --entrypoint claude localfire:ci --version
          docker run --rm --entrypoint test localfire:ci -f /srv/waymark-seat/.claude/settings.json

      # Skipped on pull_request: a PR proves the image builds, it does
      # not publish one.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/localfire
          tags: |
            type=raw,value=${{ steps.tag.outputs.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      # Every layer is in the gha cache from the build above.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.localfire
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=localfire
          provenance: false

  # Names the new tag to the cluster. Nothing is dispatched or restarted.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: hashicorp/setup-nomad@v1.0.0
      - name: Write the tag to nomad/jobs/localfire/deploy
        env:
          NOMAD_ADDR: ${{ secrets.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: nomad var put -force nomad/jobs/localfire/deploy IMAGE_TAG='${{ needs.build.outputs.tag }}'
