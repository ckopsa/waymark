# Builds the workqueue10 image, publishes it to GHCR, and points the
# nomad job at it (waymark-27y).
#
# WHY GHCR AND NOT docker.kopsa.info, the Makefile's default: a hosted
# runner cannot reach the home cluster's registry, and a public repo is
# the wrong place to keep cluster credentials. GHCR is free for public
# repos and authenticates with the built-in GITHUB_TOKEN — nothing to
# rotate, no secret to leak in a world-readable log. QUEUE_IMAGE was
# always an override, so `make image-queue` keeps pushing to the home
# registry from a laptop exactly as before.
#
# WHY arm64 NATIVELY: the cluster's only node is ARM64, which locally
# means cross-building under qemu binfmt — the one-time-per-boot install
# the Makefile warns about. Public repos get free arm64 runners, so the
# runner IS the target architecture and qemu never enters it. One
# platform, because the cluster has exactly one.
#
# THE TAG IS THE BARE SHORT SHA, computed by the same command the
# Makefile's IMAGE_TAG runs, so the image CI pushes and the var CI
# writes cannot drift from what a laptop would have produced.

name: image

on:
  push:
    branches: [main]
    # Only the three modules the Dockerfile COPYs can change the image.
    # A docs or .beads commit rebuilding and REDEPLOYING it would be
    # noise with a restart attached.
    paths:
      - 'waymark10/**'
      - 'calendar10/**'
      - 'workqueue10/**'
      - 'Dockerfile.workqueue10'
      - '.github/workflows/image.yml'
  pull_request:
    paths:
      - 'waymark10/**'
      - 'calendar10/**'
      - 'workqueue10/**'
      - 'Dockerfile.workqueue10'
      - '.github/workflows/image.yml'
  workflow_dispatch:

# A second push to the same branch makes the first build's image
# unwanted before it finishes. Deploys are not cancelled mid-flight:
# the nomad step is the last one, and by then the build it would race
# has already been superseded.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Tag
        id: tag
        # Deliberately `git rev-parse --short HEAD` and not github.sha:
        # the Makefile computes IMAGE_TAG this way, and the two must
        # agree or a hand-run `make deploy-queue` and a CI deploy would
        # name different images. CI checkouts are never dirty, so the
        # Makefile's `-dirty` suffix has no counterpart by construction.
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Skipped on pull_request: a fork's PR has no write token, and a
      # PR's job here is to prove the image still builds, not to publish
      # one. Login would be the step that fails, so it does not run.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/workqueue10
          tags: |
            type=raw,value=${{ steps.tag.outputs.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.workqueue10
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The dependency layer (`clojure -P -M:dev`) downloads the
          # world; the Dockerfile already isolates it behind the three
          # deps.edn copies so a source-only change reuses it. mode=max
          # keeps the intermediate layers, which is the whole point —
          # without it that layer is the only thing NOT cached.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # A single-platform image wants a plain manifest, not the
          # index buildx otherwise wraps it in to carry attestations.
          provenance: false

      # ---- the deploy half ----
      #
      # Writing the var is the whole deploy: the nomad job template
      # reads nomad/jobs/workqueue10/deploy and restarts the server task
      # on the new tag. Same path and same `-force` as the Makefile's
      # deploy-queue target, so a laptop deploy and a CI deploy are the
      # same act by two hands.
      #
      # GUARDED TO MAIN, not merely to non-PR: workflow_dispatch can be
      # aimed at any branch, and a manual build of a side branch must
      # not roll the house.
      #
      # NO MIGRATION HAPPENS HERE, and none can. Production leaves
      # WAYMARK10_AUTO_MIGRATE unset (main.clj's :auto-migrate reads it),
      # so an alloc whose schema moved REFUSES TO BOOT and names its
      # plan rather than migrating itself.
      #
      # Note that `make migrate-queue-prod` REFUSES APPLY on purpose
      # (waymark-yqs): reading prod's plan and running it deserve
      # different friction, so the statements print and a person runs
      # them through `nomad alloc exec -task postgres <alloc> psql`.
      # Dockerfile.workqueue10's "the deploy gate runs `clojure
      # -M:migrate` (APPLY=1)" predates that rule and is wrong for prod.
      #
      # THE CONSEQUENCE OF AUTOMATING THIS STEP: a laptop deploy put a
      # person between the merge and the roll, and that person migrated
      # first. Nothing does now. Merging a schema change to main rolls a
      # container that will not boot until someone applies the plan BY
      # HAND, from the LAN, because that is the only place prod Postgres
      # is published. Migrate before merging such a change.

      - name: Setup Nomad CLI
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: hashicorp/setup-nomad@v1.0.0

      - name: Point the job at the new image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          NOMAD_ADDR: ${{ secrets.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: |
          set -euo pipefail
          nomad var put -force \
            nomad/jobs/workqueue10/deploy \
            image_tag='${{ steps.tag.outputs.sha }}' >/dev/null
          echo "deploying ghcr.io/${{ github.repository_owner }}/workqueue10:${{ steps.tag.outputs.sha }}"
