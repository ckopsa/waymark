# Builds the workqueue10 image, migrates the schema, then rolls the job.
#
# WHY GHCR AND NOT docker.kopsa.info, the Makefile's default: a hosted
# runner cannot reach the home cluster's registry, and a public repo is
# the wrong place to keep cluster credentials. GHCR is free for public
# repos and authenticates with the built-in GITHUB_TOKEN — nothing to
# rotate, no secret to leak in a world-readable log. QUEUE_IMAGE was
# always an override, so `make image-queue` keeps pushing to the home
# registry from a laptop exactly as before.
#
# WHY EACH ARCHITECTURE NATIVELY: the cluster has an ARM64 node
# (orangepi5plus) and an amd64 one (big-colt), and a clone or a render
# must be placeable on either. Cross-building means a JVM under qemu
# binfmt — the one-time-per-boot install the Makefile warns about.
# Public repos get free runners of both architectures, so each `arch`
# leg's runner IS its target and qemu never enters it. Each leg pushes
# a plain manifest under `<short sha>-<arch>`; `build` joins the two
# into ONE index under the bare `<short sha>`, the tag everything reads.
#
# THE TAG IS THE BARE SHORT SHA, computed by the same command the
# Makefile's IMAGE_TAG runs, so the image CI pushes and the var CI
# writes cannot drift from what a laptop would have produced.
#
# ── THE MIGRATION, AND WHY IT IS SHAPED LIKE THIS ──────────────────────
#
# Production leaves WAYMARK10_AUTO_MIGRATE unset, so a server whose
# schema moved refuses to boot and names its plan. That posture stays.
# Automating the roll without automating the migration would mean a
# schema change rolls a container that cannot start — and prod Postgres
# is published on the LAN only, so nobody could fix it from away.
#
# CI cannot reach Postgres. CI CAN reach Nomad. So the migration does not
# travel to CI: CI asks the cluster to run it, beside the database, from
# the SAME image about to be deployed (terraform/nomad-jobs/
# workqueue10-migrate.hcl in ckopsa/home-infrastructure).
#
# waymark-yqs says reading the plan and running it deserve different
# friction. That still holds here. The read is free and automatic. An
# apply that only ADDS runs unattended; an apply that drops or rewrites
# costs a human tap in the `production-migrate` environment. The dry
# run names the plan's class (migrate.clj's plan-class) and the deploy
# routes on it:
#
#   empty       → deploy, nobody woken
#   additive    → `apply-additive` re-plans, applies, deploys — no tap
#                 (create-table, add-column, add-index only; a plan that
#                 stopped being additive falls back to `apply`)
#   reviewed    → hold at `apply` until a reviewer approves (a drop, a
#                 recreate, or any step kind not named additive)
#   destructive → held at `apply` too, where migrate refuses the state
#                 renames; a person runs those from the LAN
#
# !! The `apply` job's gate IS the `production-migrate` environment. An
# !! environment with no required reviewer approves instantly and the
# !! migration runs unattended. Configure it before trusting this.

name: image

on:
  push:
    branches: [main]
    # Only the four modules the Dockerfile COPYs can change the image.
    # A docs commit rebuilding and REDEPLOYING it would be
    # noise with a restart attached.
    paths:
      - 'waymark10/**'
      - 'calendar10/**'
      - 'factory10/**'
      - 'factorykit/**'
      - 'workqueue10/**'
      - 'Dockerfile.workqueue10'
      - '.github/workflows/image.yml'
      - '.github/scripts/dispatch-migrate.sh'
      - 'orgs/**'
  pull_request:
    paths:
      - 'waymark10/**'
      - 'calendar10/**'
      - 'factory10/**'
      - 'factorykit/**'
      - 'workqueue10/**'
      - 'Dockerfile.workqueue10'
      - '.github/workflows/image.yml'
      - '.github/scripts/dispatch-migrate.sh'
      - 'orgs/**'
  workflow_dispatch:

# A second push to the same branch makes the first build's image
# unwanted before it finishes. Note this can also cancel a run waiting
# at the approval gate — deliberate: the newer commit's plan is the one
# worth approving.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One leg per architecture, each on a runner of that architecture.
  # No fail-fast: when one leg is red, the other's log still says
  # whether the break is the image or the architecture.
  arch:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.sha }}

    steps:
      # On a pull_request the default checkout is the merge commit, whose
      # sha names nothing a clone can ask for. The PR's head is the commit
      # the director names, so the image is built and tagged at it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Tag
        id: tag
        # Deliberately `git rev-parse --short HEAD` and not github.sha:
        # the Makefile computes IMAGE_TAG this way, and the two must
        # agree or a hand-run `make deploy-queue` and a CI deploy would
        # name different images. CI checkouts are never dirty, so the
        # Makefile's `-dirty` suffix has no counterpart by construction.
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # The builder's own image comes from Google's mirror of Docker Hub:
      # an anonymous pull of docker.io/moby/buildkit is rate-limited by
      # runner IP, and a 429 there reddens the build before it starts.
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      # Skipped on a fork's pull_request: it has no write token, and its
      # job here is to prove the image still builds, not to publish one.
      # Login would be the step that fails, so it does not run. A PR from
      # a branch of this repository (bench/*, an org's PR) publishes, so
      # an org can be cloned and filmed before it merges.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/workqueue10
          # The leg's own tag. The bare short sha and `latest` belong
          # to the index, which `build` writes.
          tags: |
            type=raw,value=${{ steps.tag.outputs.sha }}-${{ matrix.arch }}

      # The base image comes from Google's mirror of Docker Hub, for the
      # builder's reason: the Dockerfile's default, public.ecr.aws, also
      # limits anonymous pulls by runner IP, and its 429 reddened these
      # legs before any build step ran. The house registry is out of a
      # hosted runner's reach, and an ECR login would need an AWS secret
      # in a public repo. The mirror caches what is asked of it and may
      # not hold this tag yet, so the step asks first and falls back to
      # the Dockerfile's default with a warning, never to a red leg.
      # It asks by PULLING the leg's own platform, not by inspecting the
      # index: on 2026-10-27 the mirror answered the index but no longer
      # served one arm64 layer ("could not fetch content descriptor ...
      # not found"), an inspect passed, and every arm64 leg went red at
      # FROM until the fallback was taken on a failed pull.
      - name: Base image
        id: base
        env:
          TAG: clojure:temurin-21-tools-deps-bookworm-slim
          ARCH: ${{ matrix.arch }}
        run: |
          base="mirror.gcr.io/library/$TAG"
          if ! docker pull -q --platform "linux/$ARCH" "$base" >/dev/null; then
            echo "::warning::$base could not be pulled whole for linux/$ARCH; the base image comes from public.ecr.aws"
            base="public.ecr.aws/docker/library/$TAG"
          fi
          echo "image=$base" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.workqueue10
          build-args: |
            BASE=${{ steps.base.outputs.image }}
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The dependency layer (`clojure -P -M:dev`) downloads the
          # world; the Dockerfile already isolates it behind the three
          # deps.edn copies so a source-only change reuses it. mode=max
          # keeps the intermediate layers, which is the whole point —
          # without it that layer is the only thing NOT cached.
          # One scope per architecture: with a shared scope each leg
          # would overwrite the other's layers and neither would hit.
          cache-from: type=gha,scope=workqueue10-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=workqueue10-${{ matrix.arch }}
          # A single-platform image wants a plain manifest, not the
          # index buildx otherwise wraps it in to carry attestations.
          # The only index is the one `build` writes, naming both.
          provenance: false
          # Also into this runner's docker, for the offline boot below.
          load: true

      # The image must BOOT behind the cage wall, not only build: a clone's
      # engine has a database and no internet. Before this check a PR-head
      # image exited 1 at ~47 s with no output in every clone. The engine
      # runs on an --internal network beside a fresh Postgres with the
      # clone env for 90 s; it fails when the engine exits or never
      # listens on 8014, and prints the engine's log either way.
      - name: Offline boot (90 s, no internet)
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          docker network create --internal cage
          docker run -d --name db --network cage \
            -e POSTGRES_USER=waymark -e POSTGRES_PASSWORD=waymark \
            -e POSTGRES_DB=workqueue10 mirror.gcr.io/library/postgres:16
          for i in $(seq 1 60); do
            docker exec db pg_isready -U waymark -d workqueue10 >/dev/null 2>&1 && break
            sleep 1
          done
          docker run -d --name engine --network cage --memory 1g \
            -e WORKQUEUE10_DSN='jdbc:postgresql://db:5432/workqueue10?user=waymark&password=waymark' \
            -e WAYMARK10_AUTO_MIGRATE=1 -e WAYMARK10_CLONE=1 \
            "$IMAGE"
          up=""
          for i in $(seq 1 90); do
            if [ "$(docker inspect -f '{{.State.Running}}' engine)" != true ]; then
              docker logs engine
              echo "::error::the engine exited $(docker inspect -f '{{.State.ExitCode}}' engine) after ${i} s offline (log above)"
              exit 1
            fi
            if docker exec engine bash -c 'exec 3<>/dev/tcp/127.0.0.1/8014' 2>/dev/null; then
              up=$i; break
            fi
            sleep 1
          done
          docker logs engine
          if [ -z "$up" ]; then
            echo "::error::the engine did not listen on 8014 within 90 s offline (log above)"
            exit 1
          fi
          echo "the engine listened on 8014 after ${up} s offline"

  # Joins the two legs into one index under the bare short sha — the tag
  # the migration, the roll and the clone door read — so a node of either
  # architecture pulls its own image by the same name. It keeps the name
  # `build` because every job below needs it and reads its tag.
  build:
    needs: arch
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ needs.arch.outputs.tag }}

    steps:
      # The mirror, for the legs' reason.
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      # Skipped on a fork's pull_request for the legs' reason: nothing was
      # pushed, so there is nothing to join. The job still answers
      # success. A same-repo PR joins its legs under the bare short sha of
      # its head, as main does; `latest` stays main's alone, and no job
      # below runs on a pull_request, so it never migrates or rolls.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the architectures into one index
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/workqueue10
          TAG: ${{ needs.arch.outputs.tag }}
          LATEST: ${{ github.ref_name == github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          tags=(-t "$IMAGE:$TAG")
          if [ "$LATEST" = "true" ]; then tags+=(-t "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE:$TAG-arm64" "$IMAGE:$TAG-amd64"
          # The index must name both, or a node of the missing
          # architecture fails its pull at placement, long after this.
          docker buildx imagetools inspect "$IMAGE:$TAG" | tee index.txt
          grep -q 'linux/arm64' index.txt
          grep -q 'linux/amd64' index.txt

  # Ask the cluster what this image's schema needs. Read-only: the job is
  # dispatched without apply=1, so migrate! prints and exits.
  plan:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    outputs:
      empty: ${{ steps.plan.outputs.plan_empty }}
      class: ${{ steps.plan.outputs.plan_class }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-nomad@v1.0.0
      - name: Dispatch the migration in dry-run
        id: plan
        env:
          NOMAD_ADDR: ${{ secrets.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: .github/scripts/dispatch-migrate.sh '${{ needs.build.outputs.tag }}'

  # An additive plan applies with NO environment: nobody is woken to
  # approve an ADD. The script re-plans first and refuses when the plan
  # is no longer additive (another merge migrated in between); that
  # failure hands the run to the gated `apply` below.
  apply-additive:
    needs: [build, plan]
    if: needs.plan.outputs.class == 'additive'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-nomad@v1.0.0
      - name: Apply the additive schema plan
        env:
          NOMAD_ADDR: ${{ secrets.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: .github/scripts/dispatch-migrate.sh '${{ needs.build.outputs.tag }}' apply additive

  # Runs for a plan that is neither empty nor additive (reviewed,
  # destructive, or no class line at all), and for an additive plan the
  # ungated apply refused. The environment is the gate: give
  # `production-migrate` a required reviewer, or this approves itself
  # and the point is lost.
  apply:
    needs: [build, plan, apply-additive]
    if: >-
      always()
      && needs.build.result == 'success'
      && needs.plan.result == 'success'
      && ((needs.plan.outputs.empty == 'false' && needs.plan.outputs.class != 'additive')
          || needs.apply-additive.result == 'failure')
    runs-on: ubuntu-24.04-arm
    environment: production-migrate
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-nomad@v1.0.0
      - name: Apply the schema plan
        env:
          NOMAD_ADDR: ${{ secrets.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: .github/scripts/dispatch-migrate.sh '${{ needs.build.outputs.tag }}' apply

  # The deploy is a ROLL, not a restart. workqueue10-roll (the infra
  # repo's job) registers a new version of workqueue10 on this tag, and
  # that walks the job's canary: the new allocation starts beside the
  # old one, passes /healthz, and only then takes over. A tag that never
  # turns healthy is auto-reverted and this job goes red while the old
  # image keeps serving. The roll job writes nomad/jobs/workqueue10/deploy
  # itself, after the promotion; nothing here writes it any more, and a
  # bare `nomad var put` deploys NOTHING since 2026-09-18.
  #
  # `always()` plus explicit results, because the apply jobs are SKIPPED
  # on the common path (empty plan) and a plain `needs:` would skip this
  # too. Exactly one apply succeeded, or the plan was empty and both
  # were skipped:
  #   empty    → both skipped → deploy
  #   additive → apply-additive succeeded, apply skipped → deploy
  #   reviewed → apply-additive skipped (or refused), apply succeeded → deploy
  deploy:
    needs: [build, plan, apply-additive, apply]
    if: >-
      always()
      && needs.build.result == 'success'
      && needs.plan.result == 'success'
      && ((needs.plan.outputs.empty == 'true'
           && needs.apply-additive.result == 'skipped'
           && needs.apply.result == 'skipped')
          || (needs.apply-additive.result == 'success' && needs.apply.result == 'skipped')
          || needs.apply.result == 'success')
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-nomad@v1.0.0
      - name: Roll the job onto the new image
        env:
          NOMAD_ADDR: ${{ secrets.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: .github/scripts/dispatch-roll.sh '${{ needs.build.outputs.tag }}'
