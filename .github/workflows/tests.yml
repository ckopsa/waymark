            echo "WAYMARK10_D_DSN=jdbc:postgresql://${host}:${SERVICE_PORT}/waymark10_d_test?user=ckopsa"
            echo "WAYMARK10_INTENTS_DSN=jdbc:postgresql://${host}:${SERVICE_PORT}/waymark10_intents_test?user=ckopsa"
