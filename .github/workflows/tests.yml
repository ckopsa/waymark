  # ── THE WORKFLOWS THEMSELVES ────────────────────────────────────────
  #
  # bench__check reads no .github/ file and no suite parses a workflow,
  # so a misspelt `needs.` output or a malformed `if:` reached main
  # unread. actionlint reads every workflow in the tree whenever a diff
  # touches .github/workflows/, and whenever `changes` had no diff to
  # narrow. The version is pinned for the same reason the Clojure CLI's
  # is. Its shellcheck and pyflakes passes are on, so the run: blocks
  # are linted as scripts too; pyflakes reads only `shell: python`
  # steps, and a python3 heredoc inside bash is not one.
  #
  # The standalone scripts the workflows and the seat's hook execute are
  # outside actionlint's reach, so a second step shellchecks them at
  # shellcheck's default severity, style findings included; the diff
  # that touches one sets `workflows` too.
  actionlint:
    needs: [changes]
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        env:
          ACTIONLINT_VERSION: '1.7.7'
        run: |
          set -euo pipefail
          bash <(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          ./actionlint -color
      - name: shellcheck the scripts
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          shellcheck --version
          shellcheck .github/scripts/*.sh scripts/*.sh waymark10/scripts/*.sh .claude/hooks/sitting-close.sh

  # ── THE ONE CHECK BRANCH PROTECTION NAMES ───────────────────────────
  #
  # Auto-merge waits on REQUIRED checks, and required checks are matched
  # by NAME — but the shard jobs' names are dynamic (test10 (shard N)),
  # so requiring them directly would break every time the shard count
  # moves. This job is the stable name: it needs every suite plus
  # `changes`, and is the ONLY check to mark required on main.
  #
  # It is computed HERE, in the same run as the suites, rather than by a
  # second workflow answering for the diffs this one skipped. That
  # mirror (tests-gate-skip.yml, deleted 2026-08-28) used the
  # complementary `paths-ignore:` list, and GitHub starts a
  # `paths-ignore` workflow whenever ANY changed file falls outside the
  # ignore list — so a MIXED diff started both, and the mirror's
  # two-second green satisfied the required check while the real suites
  # were still running. PR #29 merged that way. One workflow, one
  # verdict, and a skipped suite on a code diff is a FAILURE here, not a
  # pass.
  #
  # ubuntu-latest always, never the cluster expression, even on a
  # runner=cluster dispatch: the gate does no work, and the one check a
  # merge waits on must not queue behind the cluster's load. Every job
  # it needs is GitHub-hosted too on a push and on a pull request.
  # ── THE ACCESS UI DRIVE ──────────────────────────────────────────────
  #
  # waymark10.access-dev boots the access and seat kinds and seeds one
  # held seat-restate; ui-drive.mjs's `access` mode opens its row page
  # in headless chromium and asserts the held call's owner, caller,
  # door author and door row render as names. On a GitHub-hosted VM,
  # for its chrome and its loopback: the drive reaches the engine and
  # the CDP port on localhost. batch-a's drive still runs by hand.
  ui-access:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.waymark10 == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: ckopsa
          POSTGRES_DB: waymark10_ui_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ckopsa -d waymark10_ui_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-clojure
        with:
          cli-version: ${{ env.CLOJURE_CLI_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Boot the access engine
        working-directory: waymark10
        env:
          WAYMARK10_TEST_DSN: jdbc:postgresql://localhost:5432/waymark10_ui_test?user=ckopsa
        run: |
          # CLJ_SDEPS (setup-clojure's local repository) with the test
          # path beside it: -Sdeps is read once, so one map carries both.
          #
          # -Sthreads 1: the CLI builds the classpath before the engine's
          # JVM starts, and tools.deps expands the dependency tree on a
          # thread pool over one Maven session. This job died there once
          # (run 36792755139: "HashMap$Node cannot be cast to
          # HashMap$TreeNode", a java.util.HashMap written from two
          # threads) and passed on rerun of the same tree. Nothing under
          # waymark10/ holds a java.util.HashMap, so the expansion is
          # serialised: one thread, no shared map to tear.
          sdeps="${CLJ_SDEPS%\}} :aliases {:fx {:extra-paths [\"test\"]}}}"
          nohup clojure -Sthreads 1 -Sdeps "$sdeps" -M:fx -e \
            "(do ((requiring-resolve 'waymark10.access-dev/start!) 8124) nil) @(promise)" \
            > "$RUNNER_TEMP/access-dev.log" 2>&1 &
          for _ in $(seq 1 120); do
            if curl -fsS http://localhost:8124/api/-/ui > /dev/null 2>&1; then
              cat "$RUNNER_TEMP/access-dev.log"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/access-dev.log"
          echo "the access engine never answered on 8124"
          exit 1
      - name: Start headless chromium
        run: |
          # Three attempts, each with its own profile directory and 30 s
          # to open the debug port. This step failed once before any test
          # ran (run 36918162044) on a change that touched no UI, and its
          # log was not read, so the cause is not known: a failed attempt
          # now says whether the browser exited or hung, and prints its
          # log, and one failed start does not red the gate.
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/chrome-$attempt.log"
            nohup google-chrome --headless=new --remote-debugging-port=9223 \
              --no-sandbox --user-data-dir="$RUNNER_TEMP/chrome-$attempt" about:blank \
              > "$log" 2>&1 &
            pid=$!
            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:9223/json/version > /dev/null 2>&1; then
                echo "chromium answered on 9223 at attempt $attempt"
                exit 0
              fi
              if ! kill -0 "$pid" 2> /dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$pid" 2> /dev/null; then
              echo "attempt $attempt: chromium ran 30 s and never answered on 9223; it is killed"
              kill "$pid" 2> /dev/null || true
              wait "$pid" 2> /dev/null || true
            else
              status=0
              wait "$pid" || status=$?
              echo "attempt $attempt: chromium exited with status $status before it answered on 9223"
            fi
            cat "$log"
            sleep 2
          done
          echo "chromium never answered on 9223 in 3 attempts"
          exit 1
      - name: Drive the access UI
        env:
          SHOTS: ${{ runner.temp }}/ui-access-shots
        run: node waymark10/scripts/ui-drive.mjs access
      # the quest flow again at 390x844 with touch, live and as a film,
      # against the same engine
      - name: Drive the quest flow on a phone
        env:
          SHOTS: ${{ runner.temp }}/ui-access-shots
        run: node waymark10/scripts/ui-drive.mjs quest-phone
      # the drives' screenshots ("Accept as quest": the offer, the tracker;
      # phone-quest-*: the same on a phone)
      - name: Upload the drive's screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-access-shots
          path: ${{ runner.temp }}/ui-access-shots
          if-no-files-found: ignore
          retention-days: 7
      - name: Engine log
        if: failure()
        run: cat "$RUNNER_TEMP/access-dev.log" || true

  # ── THE GUIDED-FOLLOW UI DRIVE ──────────────────────────────────────────────
  #
  # ui-drive.mjs's `guided` mode opens two browser contexts, one per
  # person: one shares its screen, the other follows it in guided mode
  # and sees the dialog, the fields, the collection query and the
  # focused row, then the guards. ui-test pins the page's strings; this
  # runs them, against the batch-a engine: the recipe door's shared
  # draft needs Postgres.
  ui-guided:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.waymark10 == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: ckopsa
          POSTGRES_DB: waymark10_ui_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ckopsa -d waymark10_ui_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-clojure
        with:
          cli-version: ${{ env.CLOJURE_CLI_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Boot the batch-a engine
        working-directory: waymark10
        env:
          WAYMARK10_TEST_DSN: jdbc:postgresql://localhost:5432/waymark10_ui_test?user=ckopsa
        run: |
          # -Sthreads 1, as in ui-access: one thread builds the classpath.
          sdeps="${CLJ_SDEPS%\}} :aliases {:fx {:extra-paths [\"test\"]}}}"
          nohup clojure -Sthreads 1 -Sdeps "$sdeps" -M:fx -e \
            "(do ((requiring-resolve 'waymark10.batch-a-dev/start!) 8123) nil) @(promise)" \
            > "$RUNNER_TEMP/guided-dev.log" 2>&1 &
          for _ in $(seq 1 120); do
            if curl -fsS http://localhost:8123/api/-/ui > /dev/null 2>&1; then
              cat "$RUNNER_TEMP/guided-dev.log"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/guided-dev.log"
          echo "the batch-a engine never answered on 8123"
          exit 1
      - name: Start headless chromium
        run: |
          # Three attempts with a named failure, as in ui-access.
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/chrome-$attempt.log"
            nohup google-chrome --headless=new --remote-debugging-port=9223 \
              --no-sandbox --user-data-dir="$RUNNER_TEMP/chrome-$attempt" about:blank \
              > "$log" 2>&1 &
            pid=$!
            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:9223/json/version > /dev/null 2>&1; then
                echo "chromium answered on 9223 at attempt $attempt"
                exit 0
              fi
              if ! kill -0 "$pid" 2> /dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$pid" 2> /dev/null; then
              echo "attempt $attempt: chromium ran 30 s and never answered on 9223; it is killed"
              kill "$pid" 2> /dev/null || true
              wait "$pid" 2> /dev/null || true
            else
              status=0
              wait "$pid" || status=$?
              echo "attempt $attempt: chromium exited with status $status before it answered on 9223"
            fi
            cat "$log"
            sleep 2
          done
          echo "chromium never answered on 9223 in 3 attempts"
          exit 1
      - name: Drive guided follow
        run: node waymark10/scripts/ui-drive.mjs guided
      - name: Engine log
        if: failure()
        run: cat "$RUNNER_TEMP/guided-dev.log" || true

  gate:
    needs: [changes, actionlint, discover, quick, test-factory, test10, test-queue, ui-access, ui-guided]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Decide
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          QUICK: ${{ needs.quick.result }}
          TEST_FACTORY: ${{ needs.test-factory.result }}
          TEST10: ${{ needs.test10.result }}
          TEST_QUEUE: ${{ needs.test-queue.result }}
          UI_ACCESS: ${{ needs.ui-access.result }}
          UI_GUIDED: ${{ needs.ui-guided.result }}
          DISCOVER: ${{ needs.discover.result }}
          ONLY: ${{ inputs.only }}
          ORDER: ${{ inputs.order }}
          REFUSED: ${{ needs.changes.outputs.refused }}
          EVENT: ${{ github.event_name }}
          RUN_WAYMARK10: ${{ needs.changes.outputs.waymark10 }}
          RUN_WORKQUEUE10: ${{ needs.changes.outputs.workqueue10 }}
          RUN_CALENDAR10: ${{ needs.changes.outputs.calendar10 }}
          RUN_FACTORY10: ${{ needs.changes.outputs.factory10 }}
          RUN_LOCALFIRE: ${{ needs.changes.outputs.localfire }}
          WORKFLOWS: ${{ needs.changes.outputs.workflows }}
          ACTIONLINT: ${{ needs.actionlint.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES code=${CODE:-} quick=$QUICK test-factory=$TEST_FACTORY test10=$TEST10 test-queue=$TEST_QUEUE"
          if [ "$CHANGES" != "success" ]; then
            echo "gate: FAIL — the changes job did not succeed ($CHANGES), so whether this diff touches code is unknown."
            if [ -n "${REFUSED:-}" ]; then
              echo "gate: changes refused — $REFUSED"
            fi
            exit 1
          fi
          # Before the code check: a diff touching only a workflow such as
          # image.yml is no code path, and still must lint.
          if [ "${WORKFLOWS:-}" = "true" ] && [ "$ACTIONLINT" != "success" ]; then
            echo "gate: FAIL — a workflow changed and actionlint did not succeed ($ACTIONLINT)."
            exit 1
          fi
          if [ "${CODE:-}" != "true" ]; then
            echo "gate: PASS — no code paths in this diff; the suites have nothing to say."
            exit 0
          fi
          # A skipped matrix job is only a narrowed one if `discover` ran:
          # a failed discover skips both matrices too.
          if [ "$DISCOVER" != "success" ]; then
            echo "gate: FAIL — code changed and discover did not succeed ($DISCOVER)."
            exit 1
          fi
          # A narrowed dispatch skips every suite that does not hold its
          # namespace, on purpose; `changes` has already failed the run if
          # none does. A pull request skips every job the path table in
          # `changes` left out, on purpose too — but only a job it left
          # out: a selected job that was skipped is still a failure. On a
          # push every flag is true, so a skip there always fails.
          quick_sel=false
          for f in "${RUN_WORKQUEUE10:-}" "${RUN_CALENDAR10:-}" "${RUN_LOCALFIRE:-}"; do
            if [ "$f" = true ]; then quick_sel=true; fi
          done
          for job in "quick $QUICK $quick_sel" \
                     "test-factory $TEST_FACTORY ${RUN_FACTORY10:-}" \
                     "test10 $TEST10 ${RUN_WAYMARK10:-}" \
                     "test-queue $TEST_QUEUE ${RUN_WORKQUEUE10:-}" \
                     "ui-access $UI_ACCESS ${RUN_WAYMARK10:-}" \
                     "ui-guided $UI_GUIDED ${RUN_WAYMARK10:-}"; do
            read -r name r selected <<< "$job"
            if [ -n "${ONLY:-}${ORDER:-}" ] && [ "$r" = "skipped" ]; then
              continue
            fi
            if [ "$EVENT" = pull_request ] && [ "${selected:-}" != true ] && [ "$r" = "skipped" ]; then
              echo "gate: $name skipped on purpose — this diff's paths do not reach it."
              continue
            fi
            if [ "$r" != "success" ]; then
              echo "gate: FAIL — code changed and a suite did not succeed (quick=$QUICK test-factory=$TEST_FACTORY test10=$TEST10 test-queue=$TEST_QUEUE ui-access=$UI_ACCESS ui-guided=$UI_GUIDED)."
              exit 1
            fi
          done
          echo "gate: PASS — code changed and every selected suite succeeded."

  # ── ONE TABLE INSTEAD OF ELEVEN LOGS ────────────────────────────────
  #
  # Each shard uploads its own timings, which is right for the shard
  # and useless for the reader: refreshing the split meant opening
  # eleven logs. This job collects them into a single sorted table and
  # prints it, so a refresh is one log and one copy-paste into
  # .github/namespace-seconds.tsv.
  #
  # It downloads artifacts from INSIDE Actions, where blob storage is
  # reachable — which it is not from an agent sandbox behind an egress
  # proxy, the reason the per-shard log printing exists as well.
  timings:
    needs: [test10, test-queue]
    if: ${{ inputs.profile && always() }}
    runs-on: ${{ inputs.runner == 'cluster' && vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: timings-*
          path: timings
      - name: Combined namespace timings
        run: |
          set -euo pipefail
          out=namespace-seconds.tsv
          {
            echo "# seconds<TAB>namespace — kaocha per-namespace totals."
            echo "# Regenerate: dispatch tests.yml with profile=true and"
            echo "# copy this job's table. Read by discover's weighted split."
          } > "$out"
          # One shard per directory; each holds a shard-output.txt.
          find timings -name shard-output.txt -print0 \
            | xargs -0 -I{} ./.github/scripts/namespace-timings.sh {} \
            | awk -F'\t' 'NF==3 { if ($1+0 > m[$3]) m[$3] = $1+0 }
                           END { for (k in m) printf "%.3f\t%s\n", m[k], k }' \
            | sort -rn >> "$out"
          echo "=== combined namespace timings ==="
          cat "$out"
          echo "=== $(grep -vc '^#' "$out") namespaces, $(grep -v '^#' "$out" | awk '{s+=$1} END {printf "%.1f", s}')s total ==="
      - uses: actions/upload-artifact@v4
        with:
          name: namespace-seconds
          path: namespace-seconds.tsv
          retention-days: 7
