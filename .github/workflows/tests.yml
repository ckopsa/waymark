          # HashMap$TreeNode" under "Error building classpath"), which
          # exits 1 and so is not a crash jvm-retry.sh retries.
          bash scripts/jvm-retry.sh "test-queue shard ${{ matrix.shard.id }}" workqueue10 shard-output.txt \
            clojure -Sthreads 1 -Sdeps "$CLJ_SDEPS" -M:test "${args[@]}"
      # Also after a retry that passed, as in test10.
      # Only after a checkout that succeeded, as in `quick`.
      - name: JVM crash report
        if: >-
          steps.checkout.outcome == 'success' &&
          (failure() || steps.run-shard.outputs.retried == 'true')
        uses: ./.github/actions/jvm-crash-report
        with:
          name: test-queue-${{ matrix.shard.id }}

      # The timings, at the END of the log, where a `tail` finds them.
      # The artifact keeps the full output; this keeps the part anyone
      # actually reads, and reaches a caller who cannot fetch artifacts
      # from blob storage. always(), so a failing shard still reports.
      - name: Namespace timings
        if: inputs.profile && always()
        run: |
          set -euo pipefail
          echo "=== namespace timings (seconds, tests, ns) — shard ${{ matrix.shard.id }} ==="
          ./.github/scripts/namespace-timings.sh shard-output.txt

      # Only when asked. v4 requires a unique artifact name per job.
      - name: Upload timings
        if: inputs.profile && always()
        uses: actions/upload-artifact@v4
        with:
          name: timings-test-queue-${{ matrix.shard.id }}
          path: shard-output.txt
          retention-days: 3

      # As in test10: the runner does not remove this container.
      - name: Remove postgres
        if: always() && env.POSTGRES_CONTAINER != ''
        run: docker rm -f -v "$POSTGRES_CONTAINER"

  # ── THE WORKFLOWS THEMSELVES ────────────────────────────────────────
  #
  # bench__check reads no .github/ file and no suite parses a workflow,
  # so a misspelt `needs.` output or a malformed `if:` reached main
  # unread. actionlint reads every workflow in the tree whenever a diff
  # touches .github/workflows/, and whenever `changes` had no diff to
  # narrow. The version is pinned for the same reason the Clojure CLI's
  # is. Its shellcheck and pyflakes passes are on, so the run: blocks
  # are linted as scripts too; pyflakes reads only `shell: python`
  # steps, and a python3 heredoc inside bash is not one.
  #
  # The standalone scripts the workflows and the seat's hook execute are
  # outside actionlint's reach, so a second step shellchecks them at
  # shellcheck's default severity, style findings included; the diff
  # that touches one sets `workflows` too.
  #
  # Not on a dispatch narrowed by `only`: that run asks about one
  # namespace, a dispatch has no diff so `workflows` is always true on
  # it, and the push and the pull request still lint.
  actionlint:
    needs: [changes]
    if: >-
      needs.changes.outputs.workflows == 'true' && !startsWith(inputs.lane, 'orgs/') &&
      (github.event_name != 'workflow_dispatch' || inputs.only == '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        env:
          ACTIONLINT_VERSION: '1.7.7'
        run: |
          set -euo pipefail
          bash <(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          ./actionlint -color
          # the workflow selfhost/repo-kit hands a self-hoster, which no
          # run of this repository's own reads
          ./actionlint -color selfhost/repo-kit/.github/workflows/tests.yml
      - name: shellcheck the scripts
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          shellcheck --version
          shellcheck .github/scripts/*.sh scripts/*.sh waymark10/scripts/*.sh .claude/hooks/sitting-close.sh

  # ── THE DOCS LANE'S LINK CHECK ──────────────────────────────────────
  #
  # The docs lane (ticket 3307bf9a) runs the lint and this, and nothing
  # else, so a docs train that breaks a relative link or names a file
  # that is gone turns `gate` red. Offline: it follows the links into
  # this tree only, so a site that is down for a minute fails no train.
  links:
    needs: [changes]
    if: inputs.lane == 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude-path node_modules './**/*.md'
          fail: true

  # ── THE ONE CHECK BRANCH PROTECTION NAMES ───────────────────────────
  #
  # Auto-merge waits on REQUIRED checks, and required checks are matched
  # by NAME — but the shard jobs' names are dynamic (test10 (shard N)),
  # so requiring them directly would break every time the shard count
  # moves. This job is the stable name: it needs every suite plus
  # `changes`, and is the ONLY check to mark required on main.
  #
  # It is computed HERE, in the same run as the suites, rather than by a
  # second workflow answering for the diffs this one skipped. That
  # mirror (tests-gate-skip.yml, deleted 2026-08-28) used the
  # complementary `paths-ignore:` list, and GitHub starts a
  # `paths-ignore` workflow whenever ANY changed file falls outside the
  # ignore list — so a MIXED diff started both, and the mirror's
  # two-second green satisfied the required check while the real suites
  # were still running. PR #29 merged that way. One workflow, one
  # verdict, and a skipped suite on a code diff is a FAILURE here, not a
  # pass.
  #
  # ubuntu-latest always, never the cluster expression, even on a
  # runner=cluster dispatch: the gate does no work, and the one check a
  # merge waits on must not queue behind the cluster's load. Every job
  # it needs is GitHub-hosted too on a push and on a pull request.
  # ── THE ACCESS UI DRIVE ──────────────────────────────────────────────
  #
  # waymark10.access-dev boots the access and seat kinds and seeds one
  # held seat-restate; ui-drive.mjs's `access` mode opens its row page
  # in headless chromium and asserts the held call's owner, caller,
  # door author and door row render as names. On a GitHub-hosted VM,
  # for its chrome and its loopback: the drive reaches the engine and
  # the CDP port on localhost. batch-a's drive still runs by hand.
  #
  # Not on a dispatch narrowed by `only`: a drive is no test namespace,
  # so no `only` can name it, and it is about ten minutes of a run that
  # asked about one namespace.
  ui-access:
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && needs.changes.outputs.waymark10 == 'true' &&
      needs.changes.outputs.ui == 'true' &&
      (inputs.lane || 'engine') == 'engine' &&
      (github.event_name != 'workflow_dispatch' || inputs.only == '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # test10's "Start postgres", word for word: a step and not a
      # `services:` container, so a throttled pull is retried and falls
      # back. The host port is fixed here, on a VM of the job's own, and
      # the VM goes with the job, so no step removes the container.
      - name: Start postgres
        id: postgres
        env:
          POSTGRES_DB: waymark10_ui_test
          PUBLISH: '5432:5432'
        run: |
          set -euo pipefail
          images=(
            public.ecr.aws/docker/library/postgres:16
            mirror.gcr.io/library/postgres:16
            docker.io/library/postgres:16
          )
          image=""
          for wait in 0 5 15 30 60; do
            if [ "$wait" != "0" ]; then
              echo "no registry gave the image; waiting ${wait}s"
              sleep "$wait"
            fi
            for candidate in "${images[@]}"; do
              if docker pull -q "$candidate"; then
                image="$candidate"
                break 2
              fi
              echo "::warning::pull of ${candidate} failed"
            done
          done
          # A stale postgres:16 from an earlier job runs the suite as well.
          if [ -z "$image" ]; then
            for candidate in "${images[@]}"; do
              if docker image inspect "$candidate" >/dev/null 2>&1; then
                image="$candidate"
                echo "::warning::no registry gave the image; using the host's copy of ${image}"
                break
              fi
            done
          fi
          if [ -z "$image" ]; then
            echo "::error::no registry gave postgres:16 and the host holds no copy"
            exit 1
          fi
          cid="$(docker run -d --label waymark-ci=postgres \
            -e POSTGRES_USER=ckopsa -e POSTGRES_DB="$POSTGRES_DB" \
            -e POSTGRES_HOST_AUTH_METHOD=trust -p "$PUBLISH" "$image")"
          # Before the wait, so a container that never gets ready is
          # still removed by "Remove postgres".
          echo "POSTGRES_CONTAINER=${cid}" >> "$GITHUB_ENV"
          # -h 127.0.0.1: the image's first start runs a server on the
          # unix socket only, to make the database, and restarts it.
          # Over TCP only the real server answers.
          for i in $(seq 1 120); do
            if docker exec "$cid" pg_isready -q -h 127.0.0.1 -U ckopsa -d "$POSTGRES_DB"; then
              echo "postgres ready after ${i} attempt(s), from ${image}"
              break
            fi
            if [ "$i" = "120" ]; then
              docker logs "$cid" || true
              echo "::error::postgres never became ready"
              exit 1
            fi
            sleep 0.5
          done
          # One line per address family (0.0.0.0:32790, [::]:32790):
          # the first line, after its last colon.
          port="$(docker port "$cid" 5432/tcp | head -n 1)"
          port="${port##*:}"
          if [ -z "$port" ]; then
            echo "::error::docker published no host port for postgres"
            exit 1
          fi
          echo "port=${port}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-clojure
        with:
          cli-version: ${{ env.CLOJURE_CLI_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Boot the access engine
        working-directory: waymark10
        env:
          WAYMARK10_TEST_DSN: jdbc:postgresql://localhost:5432/waymark10_ui_test?user=ckopsa
        run: |
          # CLJ_SDEPS (setup-clojure's local repository) with the test
          # path beside it: -Sdeps is read once, so one map carries both.
          #
          # -Sthreads 1: the CLI builds the classpath before the engine's
          # JVM starts, and tools.deps expands the dependency tree on a
          # thread pool over one Maven session. This job died there once
          # (run 36792755139: "HashMap$Node cannot be cast to
          # HashMap$TreeNode", a java.util.HashMap written from two
          # threads) and passed on rerun of the same tree. Nothing under
          # waymark10/ holds a java.util.HashMap, so the expansion is
          # serialised: one thread, no shared map to tear.
          sdeps="${CLJ_SDEPS%\}} :aliases {:fx {:extra-paths [\"test\"]}}}"
          nohup clojure -Sthreads 1 -Sdeps "$sdeps" -M:fx -e \
            "(do ((requiring-resolve 'waymark10.access-dev/start!) 8124) nil) @(promise)" \
            > "$RUNNER_TEMP/access-dev.log" 2>&1 &
          for _ in $(seq 1 120); do
            if curl -fsS http://localhost:8124/api/-/ui > /dev/null 2>&1; then
              cat "$RUNNER_TEMP/access-dev.log"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/access-dev.log"
          echo "the access engine never answered on 8124"
          exit 1
      - name: Start headless chromium
        run: |
          # Three attempts, each with its own profile directory and 30 s
          # to open the debug port. This step failed once before any test
          # ran (run 36918162044) on a change that touched no UI, and its
          # log was not read, so the cause is not known: a failed attempt
          # now says whether the browser exited or hung, and prints its
          # log, and one failed start does not red the gate. A start that
          # answers says how long the port took, so a slow one is measured.
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/chrome-$attempt.log"
            nohup google-chrome --headless=new --remote-debugging-port=9223 \
              --no-sandbox --user-data-dir="$RUNNER_TEMP/chrome-$attempt" about:blank \
              > "$log" 2>&1 &
            pid=$!
            launched=$SECONDS
            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:9223/json/version > /dev/null 2>&1; then
                echo "chromium answered on 9223 at attempt $attempt, $((SECONDS - launched)) s after its launch and $SECONDS s into the step"
                exit 0
              fi
              if ! kill -0 "$pid" 2> /dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$pid" 2> /dev/null; then
              echo "attempt $attempt: chromium ran 30 s and never answered on 9223; it is killed"
              kill "$pid" 2> /dev/null || true
              wait "$pid" 2> /dev/null || true
            else
              status=0
              wait "$pid" || status=$?
              echo "attempt $attempt: chromium exited with status $status before it answered on 9223"
            fi
            cat "$log"
            sleep 2
          done
          echo "chromium never answered on 9223 in 3 attempts"
          exit 1
      - name: Drive the access UI
        env:
          SHOTS: ${{ runner.temp }}/ui-access-shots
        run: node waymark10/scripts/ui-drive.mjs access
      # the drive's screenshots ("Accept as quest": the offer, the tracker)
      - name: Upload the drive's screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-access-shots
          path: ${{ runner.temp }}/ui-access-shots
          if-no-files-found: ignore
          retention-days: 7
      - name: Engine log
        if: failure()
        run: cat "$RUNNER_TEMP/access-dev.log" || true

  # ── THE PHONE QUEST DRIVE ────────────────────────────────────────────
  #
  # ui-drive.mjs's `quest-phone` mode: the quest flow at 390x844 with
  # touch, live and as a film, against the access engine. Its own job
  # beside ui-access, on a VM of its own, so the two drives run in
  # parallel and neither waits on the other. The setup steps are
  # ui-access's, copied.
  #
  # The walk is sharded by its parts (QUEST_PHONE_PARTS in ui-drive.mjs):
  # quest, the flow and its film; phone and desktop, the 'not yet'
  # button on each. Each part writes its own rows, so each shard starts
  # from the engine's seed. Together they are every step the one job
  # walked; `gate` reads the job's result, which fails when any shard does.
  #
  # Not on a dispatch narrowed by `only`, as ui-access.
  ui-quest-phone:
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && needs.changes.outputs.waymark10 == 'true' &&
      needs.changes.outputs.ui == 'true' &&
      (inputs.lane || 'engine') == 'engine' &&
      (github.event_name != 'workflow_dispatch' || inputs.only == '')
    runs-on: ubuntu-latest
    strategy:
      # As in test10: one shard failing must not hide the others.
      fail-fast: false
      matrix:
        part: [quest, phone, desktop]
    name: ui-quest-phone (${{ matrix.part }})
    steps:
      - uses: actions/checkout@v4
      # test10's "Start postgres", word for word, as in ui-access.
      - name: Start postgres
        id: postgres
        env:
          POSTGRES_DB: waymark10_ui_test
          PUBLISH: '5432:5432'
        run: |
          set -euo pipefail
          images=(
            public.ecr.aws/docker/library/postgres:16
