            docker.io/library/postgres:16
          )
          image=""
          for wait in 0 5 15 30 60; do
            if [ "$wait" != "0" ]; then
              echo "no registry gave the image; waiting ${wait}s"
              sleep "$wait"
            fi
            for candidate in "${images[@]}"; do
              if docker pull -q "$candidate"; then
                image="$candidate"
                break 2
              fi
              echo "::warning::pull of ${candidate} failed"
