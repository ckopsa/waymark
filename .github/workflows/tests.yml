        run: |
          # -Sthreads 1, as in ui-access: one thread builds the classpath.
          sdeps="${CLJ_SDEPS%\}} :aliases {:fx {:extra-paths [\"test\"]}}}"
          nohup clojure -Sthreads 1 -Sdeps "$sdeps" -M:fx -e \
            "(do ((requiring-resolve 'waymark10.batch-a-dev/start!) 8123) nil) @(promise)" \
            > "$RUNNER_TEMP/guided-dev.log" 2>&1 &
          for _ in $(seq 1 120); do
            if curl -fsS http://localhost:8123/api/-/ui > /dev/null 2>&1; then
              cat "$RUNNER_TEMP/guided-dev.log"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/guided-dev.log"
          echo "the batch-a engine never answered on 8123"
          exit 1
      - name: Start headless chromium
        run: |
          # Three attempts with a named failure and a measured start, as
          # in ui-access.
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/chrome-$attempt.log"
            nohup google-chrome --headless=new --remote-debugging-port=9223 \
              --no-sandbox --user-data-dir="$RUNNER_TEMP/chrome-$attempt" about:blank \
              > "$log" 2>&1 &
            pid=$!
            launched=$SECONDS
            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:9223/json/version > /dev/null 2>&1; then
                echo "chromium answered on 9223 at attempt $attempt, $((SECONDS - launched)) s after its launch and $SECONDS s into the step"
                exit 0
              fi
              if ! kill -0 "$pid" 2> /dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$pid" 2> /dev/null; then
              echo "attempt $attempt: chromium ran 30 s and never answered on 9223; it is killed"
              kill "$pid" 2> /dev/null || true
              wait "$pid" 2> /dev/null || true
            else
              status=0
              wait "$pid" || status=$?
              echo "attempt $attempt: chromium exited with status $status before it answered on 9223"
            fi
            cat "$log"
            sleep 2
          done
          echo "chromium never answered on 9223 in 3 attempts"
          exit 1
      - name: Drive guided follow
        run: node waymark10/scripts/ui-drive.mjs guided
      - name: Engine log
        if: failure()
        run: cat "$RUNNER_TEMP/guided-dev.log" || true

  # ── SELF-HOST ACCEPTANCE (ticket ea4a9447) ──────────────────────────
  #
  # SELFHOST.md followed on a clean runner: dispatch this workflow with
  # selfhost=true. Each step is named for the section it follows, so a
  # red step names the section that drifted. With the Actions secret
  # SELFHOST_FIXTURE_TOKEN set (scoped to ckopsa/selfhost-fixture alone,
  # ticket a01d303d) the walk runs to the end on that real repository:
  # code-seat submits, the bench pushes bench/<ticket>, the pull request
  # opens, and the mayor's sit names the change as waiting on the merge;
  # the PR and its branch are closed and deleted afterwards, always.
  # Without the secret the fixture lives in the job (a bare repo served
  # by `git daemon`), the walk ends at code-seat's sit, and the job says
  # the forge steps were skipped. selfhost/ci/walk.py stands in
  # for Claude: a stub of localfire's pull loop that grooms as
  # draft-judge and sits as code-seat. It also runs on a pull request
  # that touches SELFHOST.md, selfhost/** or the factory seed (ticket
  # c4507d5c), so a drift from the walk is red before it merges. Not in
  # `gate` until it has proven stable.
  selfhost:
    needs: changes
    if: >-
      !cancelled() && (
      (github.event_name == 'workflow_dispatch' && inputs.selfhost) ||
      (github.event_name == 'pull_request' && needs.changes.outputs.selfhost == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # one walk at a time owns the fixture's branches and pull requests
    concurrency:
      group: selfhost-fixture
      cancel-in-progress: false
    env:
      FIXTURE_TOKEN: ${{ secrets.SELFHOST_FIXTURE_TOKEN }}
      FIXTURE_REPO: ckopsa/selfhost-fixture
    steps:
      - uses: actions/checkout@v4

      # the runner context is not available in jobs.<id>.env, so the
      # walk's state file is set here for every later step, and the
      # fixture token loses the whitespace a paste may leave around it
      - name: Walk state
        run: |
          echo "WALK_STATE=$RUNNER_TEMP/walk-state.json" >> "$GITHUB_ENV"
          token="${FIXTURE_TOKEN#"${FIXTURE_TOKEN%%[![:space:]]*}"}"
          token="${token%"${token##*[![:space:]]}"}"
          if [ -n "$token" ]; then
            echo "::add-mask::$token"
          fi
          echo "FIXTURE_TOKEN=$token" >> "$GITHUB_ENV"

      - name: "1. Prerequisites"
        run: docker compose version

      # The official images come from Google's Docker Hub mirror, not
      # Docker Hub or public.ecr.aws: runners share those registries'
      # anonymous pull limits, and a pull refused there failed the walk
      # before any step ran. public.ecr.aws is the fallback for a tag
      # the mirror lacks. compose reads POSTGRES_IMAGE from the
      # environment; the house's images are ghcr.io's already.
      - name: Official images from a mirror
        run: |
          set -euo pipefail
          tag=postgres:17
          image=""
          for wait in 0 5 15 30; do
            if [ "$wait" != "0" ]; then
              echo "no registry gave $tag; waiting ${wait}s"
              sleep "$wait"
            fi
            for candidate in "mirror.gcr.io/library/$tag" "public.ecr.aws/docker/library/$tag"; do
              if docker pull -q "$candidate"; then
                image="$candidate"
                break 2
              fi
              echo "::warning::pull of ${candidate} failed"
            done
          done
          if [ -z "$image" ]; then
            echo "::error::no registry gave $tag"
            exit 1
          fi
          echo "POSTGRES_IMAGE=$image" >> "$GITHUB_ENV"

      # The engine is built from this checkout, not pulled as :latest:
      # a walk step that needs an engine change in the same pull request
      # would otherwise meet main's last published engine and fail until
      # that change shipped (ticket 67e07956). Built the way image.yml
      # builds it, reading that workflow's amd64 layer cache and loaded
      # into the runner's docker, never pushed.
      - uses: docker/setup-buildx-action@v3

      - name: Engine base image
        id: engine-base
        env:
          TAG: clojure:temurin-21-tools-deps-bookworm-slim
        run: |
          base="mirror.gcr.io/library/$TAG"
          if ! docker buildx imagetools inspect "$base" >/dev/null; then
            echo "::warning::$base did not answer; the base image comes from public.ecr.aws"
            base="public.ecr.aws/docker/library/$TAG"
          fi
          echo "image=$base" >> "$GITHUB_OUTPUT"

      - name: The engine, built from this checkout
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.workqueue10
          build-args: |
            BASE=${{ steps.engine-base.outputs.image }}
          platforms: linux/amd64
          load: true
          push: false
          tags: waymark-selfhost-engine:ci
          cache-from: type=gha,scope=workqueue10-amd64
          provenance: false

      - name: Point compose at the built engine
        run: echo "WAYMARK_IMAGE=waymark-selfhost-engine:ci" >> "$GITHUB_ENV"

      - name: "2. The engine, the database and the bench"
        run: |
          set -euo pipefail
          cp selfhost/.env.example selfhost/.env
          fresh() { openssl rand -base64 24 | tr '+/' '-_' | tr -d '='; }
          # the fixture's owner and repository; with no fixture token, no
          # forge and so no real token
          if [ -n "$FIXTURE_TOKEN" ]; then
            repo=$FIXTURE_REPO git_token=$FIXTURE_TOKEN
          else
            repo=fixture/widgets git_token=no-forge-in-ci
          fi
          sed -i \
            -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(fresh)|" \
            -e "s|^WAYMARK_PULL_TOKEN=.*|WAYMARK_PULL_TOKEN=$(fresh)|" \
            -e "s|^WAYMARK_DATA_KEY=.*|WAYMARK_DATA_KEY=$(openssl rand -base64 32)|" \
            -e "s|^WAYMARK_OWNER=.*|WAYMARK_OWNER=tim|" \
            -e "s|^WAYMARK_REPO=.*|WAYMARK_REPO=$repo|" \
            -e "s|^WAYMARK_MODEL=.*|WAYMARK_MODEL=claude-opus-5|" \
            -e "s|^BENCH_GIT_TOKEN=.*|BENCH_GIT_TOKEN=$git_token|" \
            -e "s|^BENCH_GITHUB_TOKEN=.*|BENCH_GITHUB_TOKEN=${FIXTURE_TOKEN}|" \
            -e "s|^WAYMARK_IMAGE=.*|WAYMARK_IMAGE=$WAYMARK_IMAGE|" \
            selfhost/.env
          docker compose -f selfhost/compose.yml up -d
          # on a cold runner the engine's first boot (migrate, seed) is slow;
          # when it never answers, show why before failing
          if ! timeout 480 bash -c 'until curl -fsS http://127.0.0.1:8014/api/.well-known/waymark >/dev/null; do sleep 5; done'; then
            docker compose -f selfhost/compose.yml ps
            docker compose -f selfhost/compose.yml logs --no-color --tail 200
            echo "::error title=SELFHOST.md drifted (2)::the engine did not answer in 8 minutes"
            exit 1
          fi
          running=$(docker compose -f selfhost/compose.yml ps --status running --services)
          for s in postgres engine bench; do
            grep -qx "$s" <<< "$running" || { echo "::error title=SELFHOST.md drifted (2)::$s is not running"; exit 1; }
          done

      - name: "3. Connect to the engine"
        run: python3 selfhost/ci/walk.py connect

      - name: "4. The pull link (a stub in localfire's chair)"
        run: python3 selfhost/ci/walk.py link

      - name: "5. The repo kit, on the fixture repository on GitHub"
        if: env.FIXTURE_TOKEN != ''
        env:
          FIXTURE_TOKEN_RAW: ${{ secrets.SELFHOST_FIXTURE_TOKEN }}
        run: |
          set -euo pipefail
          # what the job holds and what GitHub answers it, never the token
          case "$FIXTURE_TOKEN" in
            github_pat_*) kind=fine-grained ;;
            ghp_*) kind=classic ;;
            ghs_*|gho_*) kind=app/oauth ;;
            *) kind=unknown ;;
          esac
          if [ "$FIXTURE_TOKEN_RAW" != "$FIXTURE_TOKEN" ]; then padded=yes; else padded=no; fi
          api() {
            curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $FIXTURE_TOKEN" \
              "https://api.github.com/repos/${FIXTURE_REPO}$1" || true
          }
          repo_status=$(api "")
          readme_status=$(api /contents/README.md)
          echo "fixture token: kind $kind, length ${#FIXTURE_TOKEN}, whitespace or newline around the secret: $padded"
          echo "GET /repos/$FIXTURE_REPO: HTTP $repo_status"
          echo "GET /repos/$FIXTURE_REPO/contents/README.md: HTTP $readme_status"
          if [ "$repo_status" != "200" ]; then
            echo "::error title=SELFHOST.md drifted (5)::the token GitHub received cannot see $FIXTURE_REPO (HTTP $repo_status): re-save SELFHOST_FIXTURE_TOKEN as an Actions repository secret"
            exit 1
          fi
          if [ "$readme_status" != "200" ]; then
            echo "::error title=SELFHOST.md drifted (5)::the token GitHub received cannot read $FIXTURE_REPO/contents/README.md (HTTP $readme_status): give SELFHOST_FIXTURE_TOKEN contents access to $FIXTURE_REPO and re-save it as an Actions repository secret"
            exit 1
          fi
          # actions/checkout leaves http.https://github.com/.extraheader (the job's
          # GITHUB_TOKEN) in this workspace's git config, and it wins over the URL's
          # credentials: clear it, or GitHub sees a token that cannot read the fixture.
          head=$(git -c http.https://github.com/.extraheader= ls-remote "https://x-access-token:${FIXTURE_TOKEN}@github.com/${FIXTURE_REPO}.git" refs/heads/main | cut -f1)
          [ -n "$head" ] || { echo "::error title=SELFHOST.md drifted (5)::$FIXTURE_REPO has no main"; exit 1; }
          echo "FIXTURE_HEAD=$head" >> "$GITHUB_ENV"
          python3 selfhost/ci/walk.py enroll ""

      - name: "5. The repo kit, in a fixture repository served to the bench"
        if: env.FIXTURE_TOKEN == ''
        run: |
          set -euo pipefail
          git config --global user.name selfhost-walk
          git config --global user.email selfhost-walk@invalid
          git_root="$RUNNER_TEMP/git"
          mkdir -p "$git_root"
          git init -q --bare -b main "$git_root/widgets.git"
          work="$RUNNER_TEMP/widgets"
          git init -q -b main "$work"
          cp -r selfhost/repo-kit/. "$work/"
          mkdir -p "$work/scripts"
          printf '# widgets\n\nThe self-host walk fixture.\n' > "$work/README.md"
          printf '#!/usr/bin/env bash\n# the one test: the README is there\ntest -s README.md\n' > "$work/scripts/test"
          chmod +x "$work/scripts/test"
          (cd "$work" && ./scripts/test && git add -A && git commit -qm "The fixture, with the waymark repo kit" \
            && git push -q "$git_root/widgets.git" main)
          echo "FIXTURE_HEAD=$(git -C "$git_root/widgets.git" rev-parse main)" >> "$GITHUB_ENV"
          # served on the host to compose's network, at its gateway
          git daemon --detach --reuseaddr --export-all --listen=0.0.0.0 --port=9418 \
            --base-path="$git_root" --pid-file="$RUNNER_TEMP/git-daemon.pid" "$git_root"
          gateway=$(docker network inspect waymark-factory_default -f '{{(index .IPAM.Config 0).Gateway}}')
          docker compose -f selfhost/compose.yml exec -T bench git ls-remote "git://$gateway/widgets.git"
          python3 selfhost/ci/walk.py enroll "git://$gateway/widgets.git"

      - name: "7. The first ticket, to code-seat's sit"
        run: python3 selfhost/ci/walk.py ticket

      - name: "7. code-seat submits, and the pull request opens"
        if: env.FIXTURE_TOKEN != ''
        run: python3 selfhost/ci/walk.py submit

      - name: "7. The mayor says it is waiting on the merge"
        if: env.FIXTURE_TOKEN != ''
        run: python3 selfhost/ci/walk.py mayor

      - name: "7. The forge steps (skipped)"
        if: env.FIXTURE_TOKEN == ''
        run: >-
          echo "::notice title=selfhost forge steps skipped::SELFHOST_FIXTURE_TOKEN is not set, so
          the push, the pull request and the mayor's 'waiting on your merge' were skipped"

      - name: Logs
        if: failure()
        run: docker compose -f selfhost/compose.yml logs --no-color --timestamps

      # no open pull request and no bench/ branch is left on the fixture
      - name: Close the fixture's pull request and branch
        if: always() && env.FIXTURE_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.SELFHOST_FIXTURE_TOKEN }}
        run: |
          set -uo pipefail
          for n in $(gh pr list -R "$FIXTURE_REPO" --state open --json number,headRefName \
                       -q '.[] | select(.headRefName | startswith("bench/")) | .number'); do
            gh pr close -R "$FIXTURE_REPO" "$n" --comment "Closed by the self-host walk's clean-up." || true
          done
          for ref in $(gh api "repos/$FIXTURE_REPO/git/matching-refs/heads/bench/" -q '.[].ref'); do
            gh api -X DELETE "repos/$FIXTURE_REPO/git/$ref" || true
          done

      - name: Tear down
        if: always()
        run: |
          docker compose -f selfhost/compose.yml down -v || true
          if [ -f "$RUNNER_TEMP/git-daemon.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/git-daemon.pid")" || true
          fi

  gate:
    needs: [changes, actionlint, links, discover, quick, test-factory, test10, test-queue, ui-access, ui-quest-phone, ui-guided, org-law, org-findings]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Decide
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          QUICK: ${{ needs.quick.result }}
          TEST_FACTORY: ${{ needs.test-factory.result }}
          TEST10: ${{ needs.test10.result }}
          TEST_QUEUE: ${{ needs.test-queue.result }}
          UI_ACCESS: ${{ needs.ui-access.result }}
          UI_QUEST_PHONE: ${{ needs.ui-quest-phone.result }}
          UI_GUIDED: ${{ needs.ui-guided.result }}
          DISCOVER: ${{ needs.discover.result }}
          ONLY: ${{ inputs.only }}
          ORDER: ${{ inputs.order }}
          REFUSED: ${{ needs.changes.outputs.refused }}
          EVENT: ${{ github.event_name }}
          RUN_WAYMARK10: ${{ needs.changes.outputs.waymark10 }}
          FOCUS_WAYMARK10: ${{ needs.changes.outputs.waymark10_focus }}
          RUN_WORKQUEUE10: ${{ needs.changes.outputs.workqueue10 }}
          RUN_CALENDAR10: ${{ needs.changes.outputs.calendar10 }}
          RUN_FACTORY10: ${{ needs.changes.outputs.factory10 }}
          RUN_LOCALFIRE: ${{ needs.changes.outputs.localfire }}
          RUN_UI: ${{ needs.changes.outputs.ui }}
          WORKFLOWS: ${{ needs.changes.outputs.workflows }}
          ACTIONLINT: ${{ needs.actionlint.result }}
          LINKS: ${{ needs.links.result }}
          ORG_LAW: ${{ needs.org-law.result }}
          ORG_FINDINGS: ${{ needs.org-findings.result }}
          LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES code=${CODE:-} quick=$QUICK test-factory=$TEST_FACTORY test10=$TEST10 test-queue=$TEST_QUEUE"
          if [ "$CHANGES" != "success" ]; then
            echo "gate: FAIL — the changes job did not succeed ($CHANGES), so whether this diff touches code is unknown."
            if [ -n "${REFUSED:-}" ]; then
              echo "gate: changes refused — $REFUSED"
            fi
            exit 1
          fi
          # A train's lane names its jobs (ticket 3307bf9a): each of them
          # must succeed, and every other job is not required, skipped on
          # purpose. No lane, or engine, is everything, decided below.
          lane_jobs=()
          case "${LANE:-engine}" in
            engine) ;;
            docs)   lane_jobs=("actionlint=$ACTIONLINT" "links=$LINKS") ;;
            orgs/*) lane_jobs=("test-factory=$TEST_FACTORY" "org-law=$ORG_LAW" "org-findings=$ORG_FINDINGS") ;;
            *)      echo "gate: FAIL — '$LANE' is no lane."; exit 1 ;;
          esac
          if [ "${#lane_jobs[@]}" -gt 0 ]; then
            for j in "${lane_jobs[@]}"; do
              if [ "${j#*=}" != "success" ]; then
                echo "gate: FAIL — lane $LANE needs ${j%%=*} and it did not succeed (${j#*=})."
                exit 1
              fi
            done
            echo "gate: PASS — lane $LANE, and each of its jobs succeeded (${lane_jobs[*]})."
            exit 0
          fi
          # Before the code check: a diff touching only a workflow such as
          # image.yml is no code path, and still must lint. A dispatch
          # narrowed by `only` skips actionlint on purpose, and only a
          # dispatch carries `only`.
          if [ -n "${ONLY:-}" ] && [ "$ACTIONLINT" = "skipped" ]; then
            echo "gate: actionlint skipped on purpose — this dispatch is narrowed by only."
          elif [ "${WORKFLOWS:-}" = "true" ] && [ "$ACTIONLINT" != "success" ]; then
            echo "gate: FAIL — a workflow changed and actionlint did not succeed ($ACTIONLINT)."
            exit 1
          fi
          if [ "${CODE:-}" != "true" ]; then
            echo "gate: PASS — no code paths in this diff; the suites have nothing to say."
            exit 0
          fi
          # A skipped matrix job is only a narrowed one if `discover` ran:
          # a failed discover skips both matrices too.
          if [ "$DISCOVER" != "success" ]; then
            echo "gate: FAIL — code changed and discover did not succeed ($DISCOVER)."
            exit 1
          fi
          # A narrowed dispatch skips every suite that does not hold its
          # namespace, on purpose; `changes` has already failed the run if
          # none does. A pull request skips every job the path table in
          # `changes` left out, on purpose too — but only a job it left
          # out: a selected job that was skipped is still a failure. On a
          # push every flag is true, so a skip there always fails. The UI
          # walks are selected by ui= as well (ticket 3ca3e028), which an
          # engine train reads from its diff too: a walk its paths cannot
          # move is skipped on purpose there, and on a dispatch every other
          # flag is true, so nothing else may skip.
          quick_sel=false
          for f in "${RUN_WORKQUEUE10:-}" "${RUN_CALENDAR10:-}" "${RUN_LOCALFIRE:-}"; do
            if [ "$f" = true ]; then quick_sel=true; fi
          done
          ui_sel=false
          if [ "${RUN_WAYMARK10:-}" = true ] && [ "${RUN_UI:-}" = true ]; then ui_sel=true; fi
          # test10 is selected by its org boot focus too: an orgs/ or
          # factorykit/ pull request must run that namespace.
          test10_sel=${RUN_WAYMARK10:-}
          if [ -n "${FOCUS_WAYMARK10:-}" ]; then test10_sel=true; fi
          for job in "quick $QUICK $quick_sel" \
                     "test-factory $TEST_FACTORY ${RUN_FACTORY10:-}" \
                     "test10 $TEST10 $test10_sel" \
                     "test-queue $TEST_QUEUE ${RUN_WORKQUEUE10:-}" \
                     "ui-access $UI_ACCESS $ui_sel" \
                     "ui-quest-phone $UI_QUEST_PHONE $ui_sel" \
                     "ui-guided $UI_GUIDED $ui_sel"; do
            read -r name r selected <<< "$job"
            if [ -n "${ONLY:-}${ORDER:-}" ] && [ "$r" = "skipped" ]; then
              continue
            fi
            if [ "$EVENT" != push ] && [ "${selected:-}" != true ] && [ "$r" = "skipped" ]; then
              echo "gate: $name skipped on purpose — this diff's paths do not reach it."
              continue
            fi
            if [ "$r" != "success" ]; then
              echo "gate: FAIL — code changed and a suite did not succeed (quick=$QUICK test-factory=$TEST_FACTORY test10=$TEST10 test-queue=$TEST_QUEUE ui-access=$UI_ACCESS ui-quest-phone=$UI_QUEST_PHONE ui-guided=$UI_GUIDED)."
              exit 1
            fi
          done
          echo "gate: PASS — code changed and every selected suite succeeded."

  # ── ONE TABLE INSTEAD OF ELEVEN LOGS ────────────────────────────────
  #
  # Each shard uploads its own timings, which is right for the shard
  # and useless for the reader: refreshing the split meant opening
  # eleven logs. This job collects them into a single sorted table and
  # prints it, so a refresh is one log and one copy-paste into
  # .github/namespace-seconds.tsv.
  #
  # It downloads artifacts from INSIDE Actions, where blob storage is
  # reachable — which it is not from an agent sandbox behind an egress
  # proxy, the reason the per-shard log printing exists as well.
  timings:
    needs: [test10, test-queue]
    if: ${{ inputs.profile && always() }}
    runs-on: ${{ inputs.runner == 'cluster' && vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: timings-*
          path: timings
      - name: Combined namespace timings
        run: |
          set -euo pipefail
          out=namespace-seconds.tsv
          {
            echo "# seconds<TAB>namespace — kaocha per-namespace totals."
            echo "# Regenerate: dispatch tests.yml with profile=true and"
            echo "# copy this job's table. Read by discover's weighted split."
          } > "$out"
          # One shard per directory; each holds a shard-output.txt.
          find timings -name shard-output.txt -print0 \
            | xargs -0 -I{} ./.github/scripts/namespace-timings.sh {} \
            | awk -F'\t' 'NF==3 { if ($1+0 > m[$3]) m[$3] = $1+0 }
                           END { for (k in m) printf "%.3f\t%s\n", m[k], k }' \
            | sort -rn >> "$out"
          echo "=== combined namespace timings ==="
          cat "$out"
          echo "=== $(grep -vc '^#' "$out") namespaces, $(grep -v '^#' "$out" | awk '{s+=$1} END {printf "%.1f", s}')s total ==="
      - uses: actions/upload-artifact@v4
        with:
          name: namespace-seconds
          path: namespace-seconds.tsv
          retention-days: 7
