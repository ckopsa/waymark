              if docker image inspect "$candidate" >/dev/null 2>&1; then
                image="$candidate"
                echo "::warning::no registry gave the image; using the host's copy of ${image}"
                break
              fi
            done
          fi
          if [ -z "$image" ]; then
            echo "::error::no registry gave postgres:16 and the host holds no copy"
            exit 1
          fi
          cid="$(docker run -d --label waymark-ci=postgres \
            -e POSTGRES_USER=ckopsa -e POSTGRES_DB="$POSTGRES_DB" \
            -e POSTGRES_HOST_AUTH_METHOD=trust -p "$PUBLISH" "$image")"
          echo "POSTGRES_CONTAINER=${cid}" >> "$GITHUB_ENV"
          for i in $(seq 1 120); do
            if docker exec "$cid" pg_isready -q -h 127.0.0.1 -U ckopsa -d "$POSTGRES_DB"; then
              echo "postgres ready after ${i} attempt(s), from ${image}"
              break
            fi
            if [ "$i" = "120" ]; then
              docker logs "$cid" || true
              echo "::error::postgres never became ready"
              exit 1
            fi
            sleep 0.5
          done
          port="$(docker port "$cid" 5432/tcp | head -n 1)"
          port="${port##*:}"
          if [ -z "$port" ]; then
            echo "::error::docker published no host port for postgres"
            exit 1
          fi
          echo "port=${port}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-clojure
        with:
          cli-version: ${{ env.CLOJURE_CLI_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Boot the access engine
        working-directory: waymark10
        env:
          WAYMARK10_TEST_DSN: jdbc:postgresql://localhost:5432/waymark10_ui_test?user=ckopsa
        run: |
          # -Sthreads 1, as in ui-access: one thread builds the classpath.
          sdeps="${CLJ_SDEPS%\}} :aliases {:fx {:extra-paths [\"test\"]}}}"
          nohup clojure -Sthreads 1 -Sdeps "$sdeps" -M:fx -e \
            "(do ((requiring-resolve 'waymark10.access-dev/start!) 8124) nil) @(promise)" \
            > "$RUNNER_TEMP/access-dev.log" 2>&1 &
          for _ in $(seq 1 120); do
            if curl -fsS http://localhost:8124/api/-/ui > /dev/null 2>&1; then
              cat "$RUNNER_TEMP/access-dev.log"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/access-dev.log"
          echo "the access engine never answered on 8124"
          exit 1
      - name: Start headless chromium
        run: |
          # Three attempts, as in ui-access.
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/chrome-$attempt.log"
            nohup google-chrome --headless=new --remote-debugging-port=9223 \
              --no-sandbox --user-data-dir="$RUNNER_TEMP/chrome-$attempt" about:blank \
              > "$log" 2>&1 &
            pid=$!
            launched=$SECONDS
            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:9223/json/version > /dev/null 2>&1; then
                echo "chromium answered on 9223 at attempt $attempt, $((SECONDS - launched)) s after its launch and $SECONDS s into the step"
                exit 0
              fi
              if ! kill -0 "$pid" 2> /dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$pid" 2> /dev/null; then
              echo "attempt $attempt: chromium ran 30 s and never answered on 9223; it is killed"
              kill "$pid" 2> /dev/null || true
              wait "$pid" 2> /dev/null || true
            else
              status=0
              wait "$pid" || status=$?
              echo "attempt $attempt: chromium exited with status $status before it answered on 9223"
            fi
            cat "$log"
            sleep 2
          done
          echo "chromium never answered on 9223 in 3 attempts"
          exit 1
      # the quest flow at 390x844 with touch, live and as a film
      - name: Drive the quest flow on a phone
        env:
          SHOTS: ${{ runner.temp }}/ui-quest-phone-shots
          QUEST_PHONE_PARTS: ${{ matrix.part }}
        run: node waymark10/scripts/ui-drive.mjs quest-phone
      # the drive's screenshots (phone-quest-*), one artifact per shard
      - name: Upload the drive's screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-quest-phone-shots-${{ matrix.part }}
          path: ${{ runner.temp }}/ui-quest-phone-shots
          if-no-files-found: ignore
          retention-days: 7
      - name: Engine log
        if: failure()
        run: cat "$RUNNER_TEMP/access-dev.log" || true

  # ── THE GUIDED-FOLLOW UI DRIVE ──────────────────────────────────────────────
