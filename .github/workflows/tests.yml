# The suites, off the laptop and split across machines.
#
# WHY. 145 test files and ~44k lines of test code ran nowhere but a
# developer's machine — the counts pasted into commit messages are the
# evidence, and the wait for them was serialised with a person's
# attention on every push. Nothing here is new work; it is the existing
# `make test10` / `make test-queue` moved somewhere that can run four of
# them at once.
#
# ── WHY A DATABASE PER SHARD, NOT PER TEST ────────────────────────────
#
# waymark10.test.db/with-test-engine opens each namespace by DROPPING
# the tables its declarations name, plus waymark10_transitions,
# waymark10_idempotency and waymark10_drafts — which every namespace
# drops, because they are the engine's own. Two namespaces sharing a
# database therefore delete each other's tables mid-run, and the failure
# looks like a flake rather than a collision.
#
# So the unit of isolation is the SHARD, and each shard gets its own
# postgres service container. That is also why the shards are namespace
# groups rather than a `-p` style split: kaocha's --focus takes
# namespaces, and a namespace is the smallest thing safe to move.
#
# The service is published on 5433, not 5432, so the DSN here is
# character-for-character the one the Makefile builds. A test that
# passes locally and fails here should not be able to blame the DSN.
#
# ── THE SHARD COUNTS ARE A GUESS ──────────────────────────────────────
#
# They are unmeasured: the container this was written in cannot reach
# Maven Central, so the suites could not be timed. 4 and 2 are a
# starting point chosen from file counts (104 and 38 namespaces), not
# from a stopwatch. Read the per-shard times in the first green run and
# move them. That is the whole tuning procedure.
#
# ── MOVING THIS TO YOUR OWN HARDWARE ──────────────────────────────────
#
# runs-on reads the CI_RUNNER repository variable. Set it to a
# self-hosted label and every job moves to your cluster with no edit
# here. Before you do: a self-hosted runner on a PUBLIC repository will
# execute a stranger's pull request on your LAN. Turn on Settings →
# Actions → "Require approval for all external contributors" first, and
# consider leaving fork PRs on GitHub-hosted runners.

name: tests

# ── NO PATHS FILTER: THE DIFF IS JUDGED INSIDE THE WORKFLOW ──────────
#
# This workflow used to carry a `paths:` filter and a mirror workflow
# (tests-gate-skip.yml) with the complementary `paths-ignore:` list, so
# that a docs-only PR still got an answer for the required check named
# `gate`. That pairing has a hole: GitHub runs a `paths-ignore`
# workflow when ANY changed file falls outside the ignore list, so a
# MIXED diff — one .clj file and one script — triggered BOTH, and the
# mirror's two-second green satisfied the required check while the real
# suites were still running. PR #29 (2026-08-28) merged that way.
#
# So: no path filter anywhere. Every push and every PR starts this
# workflow, the `changes` job below computes whether the diff touches
# code, and `gate` — the one required check — is decided here, by the
# same run that would have run the suites. The push filter went with
# it: its purpose was cost, and a codeless push now costs one
# ten-second `changes` job instead of a whole workflow, which is worth
# more as a uniform signal than it saves.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          Where to run. 'default' follows the CI_RUNNER repository
          variable; 'github' pins this dispatch to GitHub-hosted
          runners. Pinning is what makes an A/B measurable — the
          self-hosted node carries other people's load, and a single
          pair of runs cannot average that out.
        type: choice
        options: [default, github]
        default: default
      profile:
        description: >-
          Collect per-namespace timings via kaocha's profiling plugin and
          upload them as artifacts. Off by default: the plugin flags are
          unverified here, so they stay out of the path every push takes.
        type: boolean
        default: false
      only:
        description: >-
          Narrow this dispatch to test namespaces, or to single tests as
          ns/test-name, several separated by spaces or commas; each
          suite that holds one runs, narrowed to its own. Empty runs
          everything, exactly as a push does.
          The bench's `test` tool dispatches with this so a seat can run
          the namespace it touched in a couple of minutes instead of
          waiting on the full PR run. A name that matches no suite fails
          the run: a typo must not come back green.
        type: string
        default: ''

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a shard cannot start failing because upstream moved.
  CLOJURE_CLI_VERSION: '1.12.5.1664'
  # Sized from measurement, not from file counts. Run 6 on GitHub-hosted
  # gave ~20s of per-job overhead (job time minus test time) and 220s /
  # 90s of total test work for the two suites. So
  #
  #   wall clock ~= 20 + work/shards
  #
  # and the free tier's 20-concurrent-job cap leaves ~18 for shards after
  # quick and discover. Balancing the two suites (220/N1 = 90/N2, N1+N2
  # = 18) puts the knee at 13 and 5:
  #
  # CORRECTED BY MEASUREMENT. That model was wrong: it treated all test
  # time as divisible. Fitting 8 namespaces -> ~35s against 26 -> ~55s
  # on GitHub-hosted gives
  #
  #   shard tests ~= 26s + 1.1s x namespaces
  #
  # so ~26s of every shard is FIXED — JVM boot plus loading and
  # compiling the codebase — and it REPLICATES with each shard instead
  # of dividing. Only ~114s of the 220s actually splits. The same floor
  # sits at ~156s on the self-hosted ARM node: same cause, ~6x the size.
  #
  #   4 + 2   ->  96s observed
  #   13 + 5  ->  81s observed, at 3x the machine-time
  #   balanced floor ~= 18s job + 26s load + a share of 114s
  #
  # 13+5 bought 16% for triple the cost, so 8+3 keeps nearly all of it.
  # Below ~44s the constraint stops being the split: it is IMBALANCE
  # (13+5 measured 43s to 81s across supposedly equal shards, because
  # round-robin balances namespace COUNTS and not durations) and then
  # the 26s fixed cost itself, which only AOT would move.
  #
  # Run the workflow with profile=true to collect the per-namespace
  # durations a duration-weighted split would need. Each shard then
  # prints its table at the end of its log as well as uploading it.
  #
  # ── WHERE THE TIME ACTUALLY GOES, MEASURED (runs 26 and 27) ─────────
  #
  # Run 26, 13+5 pinned to GitHub-hosted: 20 jobs, all started within a
  # second of each other, shard steps 25-60s, WALL CLOCK 97s.
  # Run 27, 8+3 on the self-hosted cluster: 11 test jobs onto 8 runners
  # so three queued (one waited 9m32s), shard steps 317-453s,
  # WALL CLOCK 17m22s.
  #
  # Same commit content, ~10x apart, and the cluster is the slow side.
  # Run 27's shard 3 says where a shard's 352s goes — the timestamps in
  # its own log, against kaocha's reported 92.36s of test time:
  #
  #   ~147s  silence: JVM boot, then compiling what the first test
  #          namespace transitively requires. 70k lines of Clojure and
  #          no AOT anywhere, so this is a from-source compile that
  #          EVERY shard repeats. Effectively FIXED per shard.
  #   ~107s  usability warnings streaming: each test namespace loading,
  #          running the check battery its top-level defresource forms
  #          trigger. PROPORTIONAL to the shard's namespace count.
  #    ~98s  the tests (kaocha: 92.36s). PROPORTIONAL.
  #
  # So ~40% is fixed and ~60% divides. (The exact split inside the 147s
  # is not separately measured — some namespace loading hides in it —
  # so read it as an upper bound on the fixed part.)
  #
  # AOT is the change that attacks the fixed 147s, and it is the only
  # one that helps a shard that is already alone on a machine. The
  # other two shrink by sharding, which is why the shard count still
  # earns its keep even though imbalance is a second-order effect.
  #
  # On GitHub-hosted the same fixed cost is ~20-26s rather than ~147s,
  # which is why 97s is already close to the floor there: ~10s discover
  # + ~20s job setup and container init + the slowest shard. Both
  # splits land near that, and 8+3 is kept for using eight fewer of the
  # 20 concurrent jobs. What matters is
  # WHICH RUNNER: leaving CI_RUNNER unset is worth ~10x here, and the
  # cluster earns its keep as a fallback for when GitHub stops
  # scheduling (which it did, for the better part of an hour, on the
  # day this was written) rather than as the fast path.
  SHARDS_WAYMARK10: '8'
  SHARDS_WORKQUEUE10: '3'

jobs:
  # ── DOES THIS DIFF CONCERN THE SUITES? ──────────────────────────────
  #
  # What the `paths:` filter used to answer, answered here instead —
  # once, by a job whose result the `gate` job below can read. The list
  # in the case statement is the old filter, verbatim; there is now only
  # one copy of it, which is the point.
  #
  # ubuntu-latest deliberately, like `gate`: this does no work, and the
  # entire run waits on it, so it must not queue behind the cluster's
  # load.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
      # One flag per suite, from the path table in `detect`: every one
      # true except on a pull_request, which runs only what its paths
      # reach.
      waymark10: ${{ steps.detect.outputs.waymark10 }}
      workqueue10: ${{ steps.detect.outputs.workqueue10 }}
      calendar10: ${{ steps.detect.outputs.calendar10 }}
      factory10: ${{ steps.detect.outputs.factory10 }}
      localfire: ${{ steps.detect.outputs.localfire }}
      quick: ${{ steps.select.outputs.quick }}
      factory: ${{ steps.select.outputs.factory }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the diff is taken against the PR's base
          # commit or the push's previous tip, and a shallow clone may
          # hold neither.
          fetch-depth: 0
      - id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # ── THE PATH TABLE: WHICH SUITES A PULL REQUEST RUNS ─────────
          #
          #   changed path      suites that run
          #   ----------------  ------------------------------------------
          #   docs/**, *.md     none: the gate answers from the diff alone
          #   localfire/**      localfire
          #   calendar10/**     calendar10, workqueue10
          #   factory10/**      factory10, workqueue10
          #   workqueue10/**    workqueue10
          #   waymark10/**      waymark10, calendar10, factory10, workqueue10
          #   anything else     all of them: .github/, Makefile, Dockerfile.*,
          #                     scripts/, a tree this table does not know
          #
          # A suite runs for its own tree and for every tree its deps.edn
          # reaches: workqueue10 needs waymark10, calendar10 and factory10;
          # calendar10 and factory10 need waymark10. localfire reaches
          # waymark10 only through its :test alias, for the one round trip
          # of R-9.2, and a waymark10 PR leaves it out on purpose — main
          # runs it on the merge.
          #
          # "workqueue10" is check-queue in `quick` plus the test-queue
          # matrix; "calendar10" and "localfire" are steps of `quick`.
          #
          # ONLY a pull_request is narrowed. A push to main and a dispatch
          # run every suite whenever the diff touches code, exactly as
          # before, so a narrowed PR cannot hide a break past its merge.
          SUITES="waymark10 workqueue10 calendar10 factory10 localfire"
          declare -A reach=()
          suites_for () {
            case "$1" in
              docs/*|*.md)    ;;
              localfire/*)    reach[localfire]=1 ;;
              calendar10/*)   reach[calendar10]=1; reach[workqueue10]=1 ;;
              factory10/*)    reach[factory10]=1; reach[workqueue10]=1 ;;
              workqueue10/*)  reach[workqueue10]=1 ;;
              waymark10/*)    reach[waymark10]=1; reach[calendar10]=1
                              reach[factory10]=1; reach[workqueue10]=1 ;;
              *)              for s in $SUITES; do reach[$s]=1; done ;;
            esac
          }

          # code=, then one flag per suite: every one true under `all`,
          # the table's answer otherwise.
          emit () {
            echo "code=$1" >> "$GITHUB_OUTPUT"
            for s in $SUITES; do
              if [ "$2" = all ] || [ -n "${reach[$s]:-}" ]; then
                echo "$s=true" >> "$GITHUB_OUTPUT"
              else
                echo "$s=false" >> "$GITHUB_OUTPUT"
              fi
            done
          }

          say_yes () { emit true all; echo "$1"; exit 0; }

          # A workflow_dispatch has no base, and a brand-new branch's
          # first push reports the all-zeros sha. Both mean "no diff to
          # narrow this down" — run everything rather than guess.
          case "${BASE_SHA:-}" in
            ''|0000000000000000000000000000000000000000) say_yes "no base commit for this event — running the suites" ;;
          esac

          have () { git cat-file -e "${1}^{commit}" 2>/dev/null; }
          have "$BASE_SHA" || git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          have "$HEAD_SHA" || git fetch --no-tags --depth=1 origin "$HEAD_SHA" 2>/dev/null || true
          have "$BASE_SHA" || say_yes "base ${BASE_SHA} not reachable — running the suites"
          have "$HEAD_SHA" || HEAD_SHA=HEAD

          files=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          echo "--- changed files ---"
          echo "$files"
          echo "---------------------"

          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              waymark10/*|calendar10/*|workqueue10/*|factory10/*|localfire/*|.github/workflows/tests.yml|.github/actions/*|.github/scripts/*)
                echo "code path: $f"
                code=true ;;
            esac
            if [ "$EVENT" = pull_request ]; then
              suites_for "$f"
            fi
          done <<< "$files"

          if [ "$EVENT" = pull_request ]; then
            # The table decides a pull request: code is whatever it
            # reached, so an unknown path runs everything and a docs-only
            # diff runs nothing.
            code=false
            echo "pull request — the suites this diff reaches:"
            for s in $SUITES; do
              if [ -n "${reach[$s]:-}" ]; then
                code=true
                echo "  $s: runs"
              else
                echo "  $s: skipped"
              fi
            done
            emit "$code" table
          else
            emit "$code" all
          fi
          if [ "$code" = true ]; then
            echo "this diff touches code — the suites run"
          else
            echo "no code paths in this diff — the suites are skipped"
          fi

      # ── WHICH SUITES A NARROWED DISPATCH RUNS ──────────────────────────
      #
      # Empty `only` (every push, every PR, a plain dispatch) answers yes
      # to both and nothing below it changes. Set, each of its tokens
      # must name a test namespace in one of the trees, or
      # ns/test-name inside one; a name found nowhere FAILS this job, and with it the gate, so a
      # misspelt namespace cannot report a green that ran nothing.
      # quick holds calendar10's and localfire's suites, test-factory
      # holds factory10's; the two sharded suites are narrowed by
      # `discover`, from the same name.
      - id: select
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, pathlib, re, sys

          # Several tokens may be given, split on spaces or commas; each
          # is resolved on its own, and every suite that holds any of
          # them runs.
          tokens = [t for t in re.split(r"[\s,]+", os.environ.get("ONLY", "")) if t]
          if not tokens:
              print("quick=true")
              print("factory=true")
              sys.exit(0)

          # Each becomes a --focus argument; hold it to the shape of a
          # Clojure test id before anything reads it.
          shape = [t for t in tokens
                   if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*(/[A-Za-z0-9._*+!?<>=-]+)?", t)]
          if shape:
              print(f"only: {', '.join(repr(t) for t in shape)} is not a namespace or ns/test-name",
                    file=sys.stderr)
              sys.exit(1)

          def namespaces(root):
              base = pathlib.Path(root, "test")
              return {str(p.relative_to(base).with_suffix("")).replace("/", ".").replace("_", "-")
                      for p in base.rglob("*_test.clj")} if base.is_dir() else set()

          suites = {r: namespaces(r) for r in
                    ("waymark10", "workqueue10", "calendar10", "localfire", "factory10")}
          homes = set()
          missing = []
          for t in tokens:
              ns = t.split("/", 1)[0]
              home = [r for r, names in suites.items() if ns in names]
              if not home:
                  missing.append(t)
                  continue
              homes.update(home)
              print(f"only: {t} lives in {', '.join(home)}", file=sys.stderr)
          # One unknown token refuses the whole list: a typo must not
          # come back green beside the names that did resolve.
          if missing:
              print(f"only: no test namespace for {', '.join(missing)} in any suite", file=sys.stderr)
              sys.exit(1)
          print(f"quick={str(bool({'calendar10', 'localfire'} & homes)).lower()}")
          print(f"factory={str('factory10' in homes).lower()}")
          PY

  # The cheap signal, first: neither of these needs a database, and a
  # declaration error should not wait behind a JVM suite to be told.
  quick:
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && needs.changes.outputs.quick == 'true' &&
      (needs.changes.outputs.workqueue10 == 'true' || needs.changes.outputs.calendar10 == 'true' ||
       needs.changes.outputs.localfire == 'true')
    runs-on: ${{ inputs.runner == 'github' && 'ubuntu-latest' || (vars.CI_RUNNER || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-clojure
        with:
          cli-version: ${{ env.CLOJURE_CLI_VERSION }}
      # -Sdeps "$CLJ_SDEPS" points tools.deps at this job's own Maven
      # repository, which setup-clojure restored under runner.temp and
      # named in that variable. Every clojure call in this file carries
      # it, and it goes before -M — the CLI stops reading its own flags
      # there. Why: .github/actions/setup-clojure/action.yml.
      # Each step answers to its own flag from the path table, so a
      # localfire PR does not pay for calendar10 and a waymark10 PR does
      # not run localfire. Every flag is true off a pull_request.
      - name: check-queue — declaration gate, no database
        if: needs.changes.outputs.workqueue10 == 'true'
        run: cd workqueue10 && clojure -Sdeps "$CLJ_SDEPS" -M:check
      - name: calendar10 — pure translation, no database or network
        if: needs.changes.outputs.calendar10 == 'true'
        run: cd calendar10 && clojure -Sdeps "$CLJ_SDEPS" -M:test
      # localfire belongs here rather than in a job of its own: its
      # suite needs no database and no network past the loopback, so it
      # costs seconds beside the two above instead of minutes and a
      # postgres service container (docs/spec-local-fire.md R-9.1).
      - name: localfire — the fire wire, loopback only, no database
        if: needs.changes.outputs.localfire == 'true'
        run: cd localfire && clojure -Sdeps "$CLJ_SDEPS" -M:test
      - name: JVM crash report
        if: failure()
        uses: ./.github/actions/jvm-crash-report
        with:
          name: quick

  # ── THE FACTORY, ON ITS OWN ──────────────────────────────────────────
  #
  # factory10 (waymark-fp62.6.2) is the day job's module beside
  # workqueue10 and calendar10. Its own group, on the same pattern as
  # the others, and deliberately WITHOUT a postgres service: both of
  # its kinds are pure declarations, and its suite judges envelopes
  # and schemas rather than stored rows. A shard matrix would be two
  # JVM boots for one namespace, so this stays one job — `discover`
  # above splits only the two suites that have namespaces to split.
  #
  # The declaration gate runs first, for the reason `quick` exists: a
  # declaration error should not wait behind a suite to be told.
  test-factory:
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && needs.changes.outputs.factory == 'true' &&
      needs.changes.outputs.factory10 == 'true'
    runs-on: ${{ inputs.runner == 'github' && 'ubuntu-latest' || (vars.CI_RUNNER || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-clojure
        with:
          cli-version: ${{ env.CLOJURE_CLI_VERSION }}
      # -Sdeps "$CLJ_SDEPS" before -M, as everywhere in this file:
      # this job's own Maven repository, from setup-clojure.
      - name: check-factory — declaration gate, no database
        run: cd factory10 && clojure -Sdeps "$CLJ_SDEPS" -M:check
      - name: factory10 — the change family, no database or network
        run: cd factory10 && clojure -Sdeps "$CLJ_SDEPS" -M:test
      - name: JVM crash report
        if: failure()
        uses: ./.github/actions/jvm-crash-report
        with:
          name: test-factory

  # The matrix is built from the tree, so adding a test file needs no
  # edit here. Namespaces come from paths: test/a/b_test.clj is
  # a.b-test, which is the convention every file in both suites follows.
  discover:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ inputs.runner == 'github' && 'ubuntu-latest' || (vars.CI_RUNNER || 'ubuntu-latest') }}
    outputs:
      waymark10: ${{ steps.split.outputs.waymark10 }}
      workqueue10: ${{ steps.split.outputs.workqueue10 }}
    steps:
      - uses: actions/checkout@v4
      - id: split
        env:
          N_WAYMARK10: ${{ env.SHARDS_WAYMARK10 }}
          N_WORKQUEUE10: ${{ env.SHARDS_WORKQUEUE10 }}
          # Checked by `changes` already: test ids, or empty.
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib

          def namespaces(root):
              out = []
              for p in sorted(pathlib.Path(root, "test").rglob("*_test.clj")):
                  rel = p.relative_to(pathlib.Path(root, "test")).with_suffix("")
                  out.append(str(rel).replace("/", ".").replace("_", "-"))
              return out

          def weights(names):
              """seconds per namespace, from the last profiling run.

              MISSING FILE -> every weight equal, which makes the LPT
              split below degenerate to balancing COUNTS, i.e. exactly
              the round-robin this replaced. A missing or stale table
              can therefore never be worse than what came before.
              """
              table = {}
              f = pathlib.Path(".github/namespace-seconds.tsv")
              if f.exists():
                  for line in f.read_text().splitlines():
                      if line.startswith("#") or not line.strip():
                          continue
                      secs, _, ns = line.partition("\t")
                      try:
                          table[ns.strip()] = float(secs)
                      except ValueError:
                          pass
              known = [table[n] for n in names if n in table]
              # The per-namespace LOAD cost — kaocha times test
              # execution, but every namespace also pays the check
              # battery its top-level defresource forms trigger at
              # import, and that is invisible here. Run 27 measured the
              # two as comparable in total (107s loading against 98s of
              # tests), so one mean duration per namespace is the
              # honest estimate. It also keeps the split from parking
              # twenty cheap namespaces on one shard, since each still
              # carries a floor.
              mean = (sum(known) / len(known)) if known else 1.0
              # A namespace with no recorded time is NEW. Give it the
              # mean rather than zero, or a new test file would land
              # free and pile up on one shard until the next refresh.
              return {n: table.get(n, mean) + mean for n in names}

          def shards(names, n):
              # Longest-processing-time-first: sort by cost descending,
              # then repeatedly put the next namespace on whichever
              # shard is currently lightest. A 4/3-of-optimal bound on
              # the makespan, and the makespan is exactly what a run
              # waits for — it ends when its SLOWEST shard ends.
              #
              # Round-robin balanced namespace COUNTS, which is not the
              # same thing: it left test10 shard 4 at 63s against a 30s
              # median, and the run waited for the 63.
              #
              # Ties break on the name so the split is reproducible —
              # a matrix that shuffled between runs would make every
              # comparison meaningless.
              w = weights(names)
              order = sorted(names, key=lambda x: (-w[x], x))
              groups = [[] for _ in range(n)]
              load = [0.0] * n
              for name in order:
                  i = min(range(n), key=lambda k: (load[k], k))
                  groups[i].append(name)
                  load[i] += w[name]
              import sys as _s
              print("  predicted shard seconds: "
                    + " ".join(f"{x:.0f}" for x in load), file=_s.stderr)
              return [{"id": i + 1, "nses": "\n".join(sorted(g))}
                      for i, g in enumerate(groups) if g]

          # A narrowed dispatch: the tokens (namespaces, or ns/test-names,
          # which kaocha's --focus takes as they are) that live in a
          # suite go in ONE shard of it, one per line so each gets its
          # own --focus; a suite holding none gets an empty list — its
          # matrix job is skipped on that, since an empty matrix fails
          # a run. Split as `changes` splits them.
          import re
          only = [t for t in re.split(r"[\s,]+", os.environ.get("ONLY", "")) if t]

          for key, root, envvar in (("waymark10", "waymark10", "N_WAYMARK10"),
                                    ("workqueue10", "workqueue10", "N_WORKQUEUE10")):
              names = namespaces(root)
              if only:
                  mine = [t for t in only if t.split("/", 1)[0] in names]
                  m = [{"id": 1, "nses": "\n".join(mine)}] if mine else []
                  print(f"{key}={json.dumps(m)}")
                  print(f"# {key}: only={' '.join(mine)}, {len(m)} shard",
                        file=__import__("sys").stderr)
                  continue
              m = shards(names, int(os.environ[envvar]))
              print(f"{key}={json.dumps(m)}")
              print(f"# {key}: {len(names)} namespaces over {len(m)} shards",
                    file=__import__("sys").stderr)
          PY

  test10:
    needs: [changes, discover]
    if: >-
      needs.changes.outputs.code == 'true' && needs.discover.outputs.waymark10 != '[]' &&
      needs.changes.outputs.waymark10 == 'true'
    runs-on: ${{ inputs.runner == 'github' && 'ubuntu-latest' || (vars.CI_RUNNER || 'ubuntu-latest') }}
    strategy:
      # One shard failing must not hide the others: the point of a
      # split suite is seeing every failure in one round.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.discover.outputs.waymark10) }}
    name: test10 (shard ${{ matrix.shard.id }})
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ckopsa
          POSTGRES_DB: waymark10_test
          POSTGRES_HOST_AUTH_METHOD: trust
        # No fixed host port: on a self-hosted runner the host is shared
        # with every other shard and with the household's own services
        # (5433 there is immich's postgres). Docker picks a free one and
        # the job reads it back from job.services.postgres.ports.
        ports: ['5432']
        options: >-
          --health-cmd "pg_isready -U ckopsa -d waymark10_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-clojure
        with:
          cli-version: ${{ env.CLOJURE_CLI_VERSION }}
      # Where the service container is. CI_SERVICE_HOST comes from the
      # self-hosted runner's environment (home-infrastructure's
      # github-runner.hcl) because that host's docker daemon publishes
      # on its LAN address, not loopback; a GitHub-hosted VM leaves it
      # unset and localhost is right there. create-test-databases.sh
      # and the DSN below both read PGHOST/PGPORT.
      #
      # AND IT CAN ARRIVE AS THE LITERAL TEMPLATE. That variable is
      # `${attr.unique.network.ip-address}` in the jobspec, and when Nomad
      # cannot resolve an interpolation it leaves the RAW TEXT rather than
      # erroring or emptying it -- so an allocation created while the
      # node's network fingerprint was missing carries the string itself.
      # `:-` cannot catch that: the value is neither unset nor empty.
      #
      # It does not heal. Env is interpolated once, at allocation
      # creation, and an ephemeral runner restarts its task inside the
      # same allocation, so the bad value lives as long as the alloc does.
      # On 2026-09-20 three of twenty-six runners were poisoned that way
      # and ~1 shard in 8 failed for hours with
      #   postgres never accepted a connection on ${attr.unique...}:32790
      # which reads like a slow service container and is nothing of the
      # kind. Recovering needs `nomad alloc stop` on the host side; this
      # guard is so CI does not care.
      #
      # The fallback is the routing table, not localhost: the runner uses
      # host networking, so this is the node's own LAN address -- which is
      # exactly what the service container is published on, and what
      # localhost is NOT on that box.
      - name: Locate the postgres service
        env:
          SERVICE_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          host="${CI_SERVICE_HOST:-localhost}"
          case "$host" in
            *'${'*)
              host="$(ip route get 1.1.1.1 2>/dev/null | awk '{print $7; exit}')"
              host="${host:-localhost}"
              echo "::warning::CI_SERVICE_HOST arrived unresolved; using ${host}."
              ;;
          esac
          {
            echo "PGHOST=${host}"
            echo "PGPORT=${SERVICE_PORT}"
            # The suite's other databases. Each of these tests falls back
            # to localhost:5433/<its db> when its variable is unset, which
            # was silently true on GitHub-hosted runners (fixed port, own
            # VM) and is false anywhere else. Name them all, from the one
            # host:port the service actually got. The list of databases
            # is scripts/test-databases.sh; the names are the getenv sites
            # in waymark10/test.
            echo "WAYMARK10_D_DSN=jdbc:postgresql://${host}:${SERVICE_PORT}/waymark10_d_test?user=ckopsa"
            echo "WAYMARK10_INTENTS_DSN=jdbc:postgresql://${host}:${SERVICE_PORT}/waymark10_intents_test?user=ckopsa"
            echo "WAYMARK10_LIVE_DSN=jdbc:postgresql://${host}:${SERVICE_PORT}/waymark10_live_test?user=ckopsa"
            echo "WAYMARK10_PRESENCE_DSN=jdbc:postgresql://${host}:${SERVICE_PORT}/waymark10_presence_test?user=ckopsa"
          } >> "$GITHUB_ENV"
          echo "postgres service at ${host}:${SERVICE_PORT}"
      - name: Create the test databases
        run: .github/scripts/create-test-databases.sh

      - name: Run shard
        env:
          # The Makefile's test10 DSN, with the host and port the service
          # actually got (see "Locate the postgres service").
          WAYMARK10_TEST_DSN: jdbc:postgresql://${{ env.PGHOST }}:${{ env.PGPORT }}/waymark10_test?user=ckopsa
          FOCUS_NS: ${{ matrix.shard.nses }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          # tee, so a failing suite still leaves its timings behind;
          # pipefail keeps clojure's exit code rather than tee's.
          # Built as an array, never interpolated into the command line:
          # these names come from filenames in the tree, and on a public
          # repo a fork's PR chooses those filenames.
          args=()
          while IFS= read -r ns; do
            [ -n "$ns" ] && args+=(--focus "$ns")
          done <<< "$FOCUS_NS"
          # Opt-in: kaocha's profiling plugin prints the slowest tests and
          # namespaces, which is what a duration-weighted split needs.
          if [ "${PROFILE:-false}" = "true" ]; then
            args+=(--plugin kaocha.plugin/profiling --profiling-count 500)
          fi
          echo "shard ${{ matrix.shard.id }}: ${#args[@]} focus flags"
          # -Sdeps before -M: this job's own Maven repository, from
          # setup-clojure. See the quick job above.
          cd waymark10 && clojure -Sdeps "$CLJ_SDEPS" -M:test "${args[@]}" 2>&1 | tee ../shard-output.txt
      # A JVM that died says so in hs_err_pid*.log next to the suite;
      # the banner in the log above is eight lines of it. Keep the rest.
      - name: JVM crash report
        if: failure()
        uses: ./.github/actions/jvm-crash-report
        with:
          name: test10-${{ matrix.shard.id }}

      # The timings, at the END of the log, where a `tail` finds them.
      # The artifact keeps the full output; this keeps the part anyone
      # actually reads, and reaches a caller who cannot fetch artifacts
      # from blob storage. always(), so a failing shard still reports.
      - name: Namespace timings
        if: inputs.profile && always()
        run: |
          set -euo pipefail
          echo "=== namespace timings (seconds, tests, ns) — shard ${{ matrix.shard.id }} ==="
          ./.github/scripts/namespace-timings.sh shard-output.txt

      # Only when asked. v4 requires a unique artifact name per job.
      - name: Upload timings
        if: inputs.profile && always()
        uses: actions/upload-artifact@v4
        with:
          name: timings-test10-${{ matrix.shard.id }}
          path: shard-output.txt
          retention-days: 3

