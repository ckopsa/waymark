# The composer's sitting as a beads formula (waymark-3z3, the owner's
# direction): the work order any agent run can be handed. Wisp it per
# run — `bd mol wisp sitting` — claim the steps oldest-first, do what
# each says, close it, and `bd mol squash` the wisp to a digest when
# the sitting ends. The molecule IS the instruction: each step teaches
# the agent where to look within waymark and which walls hold there.
#
# The law behind every step is docs/spec-outcome-menu.md § "The
# composer contract"; the same walk in prose is
# .claude/skills/sitting/SKILL.md. The doors enforce most of the law
# and refuse with sentences that name the fix — trust the refusals.
#
# CREDENTIALS, two lawful shapes — use whichever the runner has:
# - ENV-VAR RUNNERS (Jules and kin): `scripts/sitting-run.sh` does it
#   for you — it mints a fresh 1-hour bearer at run start, proves it,
#   and leaves it at `.sitting/latest/bearer` (0600). By hand it is
#   TOKEN="$(scripts/agent-bearer.sh)". Either way send
#   `Authorization: Bearer <token>` plus
#   `X-Waymark-Grant: $WAYMARK_GRANT_ID` on every request.
# - TICK-MANAGED RUNNERS: read {{state_file}} (mode 600) and send
#   `Cookie: waymark_session=<session_token>` plus the grant header;
#   scripts/standing-agent-tick.sh owns renewal.
# Either way a refusal means STOP and say so — a sitting never
# knocks, never spends re-entry, never invents another way in.

formula = "sitting"
description = "One composer sitting at the waymark door: read the house, index the facts people said, answer every pull and every unanswered turn, advance the arrivals (enriching a bare task is a whole answer, compose an outcome only for a goal larger than any single row), diagnose before any burial, score what you did not write, journal what was and was not done."

[vars]
base_url = { default = "https://work.kopsa.info" }
state_file = { default = "~/.waymark-agent.json" }

[[steps]]
id = "read"
title = "Read the house — evidence before anything"
description = """
FIRST, and it does this whole step mechanically: run
`scripts/sitting-run.sh`. It mints the bearer, proves it and the
grant with one GET, pulls every address below into
`.sitting/latest/rows/`, and works out the lists the later steps are
defined in terms of — offered requests, threads whose last turn is
not yours, turns no insight cites yet, bundles carrying no judgment
of yours, declines owed a diagnosis — into `.sitting/latest/
manifest.md`. It also runs the composer PROBES and writes the run's
WORK ORDERS at the top of that manifest: at most two assignments with
their material already fetched and the write each expects. Read the
manifest, work orders first; do not re-fetch what it already holds.
If it stops, stop with it and report its sentence.

Two shapes the driver already gets right and a hand-rolled read gets
wrong: a COLLECTION answers a projection while a row read at its own
address answers `data` in full (evidence and routing live only
there — the snapshot keeps both, `<kind>.json` and
`<kind>.full.json`), and paging rides `page[size]` (max 100) and
`page[number]`, never `?limit=`, which 422s.

What it read, in the order the sitting wants it, writing NOTHING yet:
1. GET {{base_url}}/api/-/welcome — the house's own orientation.
2. GET {{base_url}}/api/-/diagnosis — the tally: shown-and-declined,
   exposure. ?outcome=<id> narrows to one.
3. GET {{base_url}}/api/composition_requests?state=offered — the
   standing pulls. Every one of these is owed an answer this sitting.
4. The feed through the owner's eyes: the feed document's own
   preview_as capability (the welcome names the address). A preview
   writes nothing — that is law, not a gap.
5. Evidence the grant admits: {{base_url}}/api/values,
   /api/people (the roster's plural — only an affirmed/current person is a usable
   companion), /api/tasks, /api/chore_runs, /api/events, /api/media,
   /api/verdict_reasons (the house's decline words).
6. The threads: {{base_url}}/api/remarks?subject_kind=&subject_id=
   for every outcome, piece, insight and request this composer has
   touched — the default sort is oldest-first and reads like the
   conversation it is. Also read the previous sittings' journal
   entries if any exist; they name what was deliberately left
   alone and why.
7. What already stands: {{base_url}}/api/outcomes — offered,
   answered, AND declined — so the compose step can judge "not yet
   suggested" against the record rather than against this run's
   memory. A high-frequency fleet's runs are blind to each other
   except through this read.
8. What is already written down: {{base_url}}/api/insights — so the
   index step never publishes a fact twice — and your own
   {{base_url}}/api/ranking_notes — so the score step knows which
   bundles still carry no judgment of yours.
Record what you found for the later steps: open requests, threads
whose LAST turn is a person's, facts stated in those turns that no
insight yet carries, declines with words, what has already been
suggested, which bundles you have not scored, evidence worth
composing from.
"""

[[steps]]
id = "index"
title = "Index what people said — a fact becomes a row before it becomes a plan"
depends_on = ["read"]
description = """
A person's turn often carries a FACT about the house — "Wellesley is
sick", "we're rescheduling", "the wood arrived", "Grandpa lands on
the 3rd". Left in the thread it is prose only this run can see; the
next run, the rank, and the diagnosis are all blind to it. So before
any answer or any composition: for each fact in a person's turn
that no existing insight carries (the read step's list), publish
one at POST {{base_url}}/api/insights — one sentence stating the
fact as the house's own record, evidence citing the remark's address
({{base_url}}/api/remarks/<id>) and any row it is about, and the one
light next step the fact points at (offer_kind / offer_action /
offer_id — most often a door on the outcome the thread sits on, or
on the person or event it names). LIGHT means the door asks for
NOTHING — complete on a task, take_it_back on a tickler,
still_stands on a value. A door that takes input is refused however
natural it reads: prioritize wants a rank, and a card offers a
decision, never a form; prepared input belongs in an outcome PIECE.
Those three fields are the whole offer — never send offer_href, the
engine derives the address from the kind and the id. The door
refuses an insight with no citation (cites-what-it-claims) or no
offered step (offers-something-light): both are the law working,
not a gap.
Then compose FROM the insight, never from the remark alone, and
cite the insight in the outcome's evidence. State the fact; never
judge it — an insight indexes, it does not decide. A turn that
holds no fact (a question, a thanks, a preference) indexes nothing.
"""

[[steps]]
id = "answer-requests"
title = "Answer every standing composition request"
depends_on = ["read"]
description = """
A person's pull is NEVER capped, and state=offered means UNANSWERED
BY DEFINITION: the staging itself is what answers a request — in the
same transaction, moving its state — so an existing outcome that
merely resembles the request answers nothing. If a request reads
offered, it is owed a fresh outcome citing it, full stop; "an
outcome like that already exists" is never a reason to skip one.
For each composition_request in state offered (from the read step):
stage an outcome at
POST {{base_url}}/api/outcomes whose request_id names the request,
with 2-5 outcome_pieces whose friction is genuinely pre-paid. The
walls that will judge you, in the door's own words if you miss —
and one the door cannot: a piece makes something READY (a create or
a hold with its input prepared); a piece firing a completion door
(complete/finish/take) on a row that already stands records work
nobody did, and is not friction pre-paid. The door-enforced walls:
name a LIVE value the house holds; cite EVERYTHING you read in
evidence (all offenders are named at once — fix them in one round);
routes_through only when a loved activity truly carries it, absent
is allowed and honest; the prepared input must fit the target door,
and every date in it (starts_at/ends_at, a deadline) is in the
FUTURE — the manifest's `now` is the line, an hour already past is a
bug
(a 422 is your bug, and a piece may name any door in the house).
The staging itself answers the request — no door on the request kind
is yours to touch. Read the engine-written impact line back on every
piece before counting the stage done: a composer that never read its
own is proposing blind.
"""

[[steps]]
id = "answer-threads"
title = "Answer every unanswered turn"
depends_on = ["index"]
description = """
A thread whose last turn is a person's and not the composer's is a
work order (waymark-b4s). For each one found in the read step:
answer with a reply remark — POST {{base_url}}/api/remarks with the
same {subject_kind, subject_id}, says carrying your answer, and
in_reply_to naming their turn — or with a recomposition whose
evidence cites what they said, or both. A question gets words; a
fact ("the wood arrived") gets a composition that uses it; a
suggestion gets an outcome that takes it or a turn saying honestly
why not. When the turn changes the standing of an outcome it sits
on — a date slid, a plan is on hold, someone is sick — say so ON
THAT OUTCOME in a reply remark: what changed, what you did about it
(the insight you indexed, the follow-up you staged, by id), and what
you left alone. The feed must be able to read why a bundle slipped
without opening the thread. NEVER reword anybody's turn but your own
(the door refuses by name); NEVER read a remark as a verdict — words
decline nothing, and the person's taps stay the only doors that
decide.
AND ONE THREAD YOU MAY NOT ANSWER IN WORDS AT ALL (waymark-vf8): an
outcome in `iterating` is one the household handed back to YOU, and
the remark door is closed to the hand that can rework it — a reply
saying "understood, I will rework this" is refused by name
(`words-do-not-answer`) at the rework door's own address, because a
promise has no state while the bundle sits off their feed. Answer it
at POST {{base_url}}/api/outcomes/<id>/-/rework, with your words in
`says` (required, at most 240 characters — it is posted as your turn
on the thread). A round that changes no piece is a LAWFUL answer:
if the plan still stands, or you cannot stage what was asked, commit
and say so — the bundle goes back on their feed and they may decline
it. Leaving it in `iterating` is the one wrong answer.
"""

[[steps]]
id = "compose"
title = "Work the work orders — enrich a bare task, compose only for a real goal"
depends_on = ["answer-requests", "answer-threads"]
description = """
THE READING THIS STEP WORKS FROM is the manifest's § "YOUR WORK
ORDERS" (waymark-48a): at most two assignments a closed set of probes
built out of the snapshot — a bare task due soonest, an event inside
ten days nothing prepares for, a roster companion the last week of
Gate traffic names and no insight records, a live value nothing
standing serves. Each order already names its SUBJECT ADDRESS, the
MATERIAL to read (rows beside it in the house, and whatever the live
Gate rigs answered — material to act on, never an address to cite),
and the EXPECTED WRITE: which kind, which fields, which addresses to
cite, which light door to offer. Do them in the order given, one row
each. They are a CEILING: nothing past them is required, and an
order you cannot answer honestly is SKIPPED and said so in the
journal. Next run, `sitting-run.sh verify` prints one line per order
— answered by <row>, or UNANSWERED.
WHAT THIS STEP OWES (waymark-mho): not an outcome. It advances the
run's ARRIVALS (manifest `arrivals` — rows new since the last run,
the material the probes drew from) as far as the evidence honestly
goes, and enriching a bare task is a whole answer.
ENRICH (the lightest write, always lawful): for a manifest
`bare_tasks` entry — actionable, no detail, unspoken-for — publish an
insight
(POST {{base_url}}/api/insights) that ANNOTATES it: evidence citing
the task AND the source you read, a finding that makes it actionable
(what it is for, where/when/with what, its next physical step), and
offer_kind/offer_id/offer_action naming the task's own next door — a
NO-INPUT one (complete is the usual door on a task); prioritize takes
a rank and offers-something-light refuses it, so a rank goes in an
outcome PIECE, never in a finding's offer.
Never edit the task's fields — only the household edits its rows.
Dig BEYOND the house for that context: the manifest's `gate.tools`
are the read tools this grant admits (email, Telegram, texts — POST
{{base_url}}/api/-/gate/<tool>). What you learn is evidence to act
on, never an address to cite; name the source in prose, copy no
message body, read tools only.
COMPOSE (only for a real goal): stage an outcome ONLY when an
arrival plus its situated graph implies a GOAL LARGER THAN ANY
SINGLE EVIDENCE ROW — an end-state the house wants, not a task
restated. A bundle whose goal equals one task, or whose only work
is re-prioritizing an existing task, is a WRAPPER, not an outcome —
enrich instead. Every piece serves that one goal. Never a twin of a
standing_outcome. When a real goal IS there, stage every genuinely
distinct outcome — 2-5 pieces each, friction genuinely
pre-paid, a live value named, everything read cited. What
distinctness demands: check the manifest's `standing_outcomes` (its "Already standing"
section — every offered/accepted outcome and the rows it cites) and
the prior journals, and NEVER stage a twin of a bundle that already
stands — a candidate with the same goal, or citing the same evidence
row, as one already standing — the rank cannot tell twins apart, so a duplicate
adds noise where the law wants choice. Sameness is the only
scarcity; quantity is free.
THE DIAGNOSIS DUTY (8um law 4) survives the cap's deletion whole:
before any recomposition of a shown-and-declined prior, read its
verdict_reason words (wrong_time is not wrong_piece is not
never_this), publish an insight at POST {{base_url}}/api/insights
CITING the decline — the verdict_reason row, its word quoted; when
no reason row stands say "no reason given" and cite the outcome (the
manifest's `declines[].cite` is the list). ONLY a decline that owes
one: diagnosis_stands=true means nothing, ever — never twice. Its
offered step is a NO-INPUT door the offered row admits NOW, from the
manifest's `offer_candidates` (the prior's standing evidence rows
and their declared doors — complete on a standing task is the usual
shape; prioritize takes a rank and is refused); the declined prior
is terminal and admits none, so expire/retire on it is burial, not a
step. The
no-burial-without-a-diagnosis wall demands the citation. The recomposition then re-enters COOLED (:early),
never buried: the rank chooses WHICH, never WHETHER.
NEVER tap a verdict or affirm a value or person unless your grant
admits that door — and NEVER on a row you wrote (four eyes; no grant
opens it). Your standing sitting scope admits create/restate and
nothing else, so still_stands/revise/retire and the verdict doors are
absent for you: observed create/restate only, and affirmation is a
person's act. If the owner wants one done in his name he approves an
approval_request naming that exact action, and the transition then
records the grant you acted under.
"""

[[steps]]
id = "score"
title = "Score what you did not write — the fleet ranks itself"
depends_on = ["compose"]
description = """
This step runs EVERY sitting, composed or not: ranking is its own
duty, not a tail on staging. The order is the crown's declared rank;
your part of it is the judgment input, one note per bundle. For
every bundle you can see that carries NO live ranking_note of yours
(the read step's list), newest first — a run that stops short of
three while three are listed has left this step undone; the
manifest's `unscored_bundles` IS that list, newest first and already
filtered of your own rows: POST
{{base_url}}/api/ranking_notes with {subject_kind, subject_id}, a
score 0-1, one sentence saying what the bundle STANDS ON in the
house's own terms (the value it serves, what its pieces make ready,
the timing, the decline word if one was said) — never how the idea
feels — in NO MORE THAN 240 CHARACTERS — the schema counts — and
evidence = the bundle's whole `cite` list from the manifest (the
bundle, its value, its pieces, the verdict words on it, insights
about it), never the bundle alone: a score read off a headline is
not a judgment. Every entry is the address of ONE ROW
(/api/outcome_pieces/<id>), never a filtered collection URL, which
cites-what-it-read refuses by name. The walls: never a
row you wrote (not-your-own-row); one live note per row per author
(one-live-note-per-row-and-author) — a changed mind RESTATES its
note, it never files a second; a person dismisses a note, an agent
never does. Your score is a judgment beside the engine's numbers,
quoted on the card as yours — the numbers themselves (asked-for,
declared value, early, cooled, declined, fresh) are the recipe's,
and a composer who thinks a weight is wrong proposes new numbers
through recipe_proposal and leaves the order to the person who
applies it.
"""

[[steps]]
id = "journal"
title = "Journal the sitting — including what was left alone"
depends_on = ["score"]
description = """
One journal entry — POST {{base_url}}/api/journals with {title,
body}, and it needs no grant scope: :journal is an OWN-SURFACE kind,
so an agent writes and reads its own entries by being itself. Prior
entries are `.sitting/latest/manifest.md` § "Prior sittings".
The entry closes the sitting: what was staged (ids), which
facts were indexed (insight ids), which requests were answered,
which threads were answered, which diagnoses were published, which
bundles were scored, and — just as load-bearing — what was
deliberately NOT composed and why (a `not_before` date not yet
reached, evidence not yet in the house, a person still unaffirmed).
The next sitting reads this first. A run writes only what its work
orders and the owed lists name (waymark-mho): one that advanced its
arrivals (or had none), enriched what was bare, and owed nothing
else may write nothing at all — a lawful no-op leaves no journal. Write this journal only when the sitting actually did
something. Then close this molecule's steps and squash the wisp.
LAST, always: run `scripts/sitting-run.sh verify` and put its output
in your report. It lists every row this principal wrote since the
run started, straight off the engine — the only proof from OUTSIDE
the run that the sitting happened at all — and grades the manifest's
work orders one line each (`ORDER <probe> <subject>: answered by
<row>` / `UNANSWERED`, where answered means a row you wrote CITES the
subject address). A verify that says NOTHING after a manifest that
owed something is a failed run, not a quiet one; an UNANSWERED order
is lawful only if the journal says why it was skipped.
"""
