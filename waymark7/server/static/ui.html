   plain mono chip — never a dead link. onAct runs before the walk or the
   navigation (a dialog hosting the chip closes itself there). */
function remedyChips(remedies, doc, onAct) {
  if (!remedies || !remedies.length) return null;
  const docKind = (doc.kind || "").replace(/_collection$/, "");
  const box = el("div", {class:"remedies"});
  for (const token of remedies) {
    const dot = String(token).indexOf(".");
    const kind = dot > 0 ? token.slice(0, dot) : "";
    const action = dot > 0 ? String(token).slice(dot + 1) : String(token);
    if (kind === docKind && doc.actions?.[action]) {
      box.append(el("button", {type:"button", class:"chip remedy",
        title: `${token} — this action is on this page`,
        onclick: () => { onAct && onAct(); pulseAction(action); }},
        "→ " + label(action, doc.actions[action])));
    } else if (action === "create") {
      const chip = el("span", {class:"chip",
        title: `${token} — a remedy elsewhere`}, String(token));
      box.append(chip);
      wellKnown().then(w => {
        const col = w.collections?.[kind];
        if (col) chip.replaceWith(el("a", {class:"chip remedy",
          href: "#"+col, onclick: () => { onAct && onAct(); },
          title: `${token} — opens the ${pretty(kind)}s page`},
          `+ new ${pretty(kind)}`));
      }).catch(() => {});
    } else {
      box.append(el("span", {class:"chip",
        title: `${token} — a remedy this page can't reach directly`},
        String(token)));
    }
  }
  return box;
}

/* The chip's walk: take the eye to the named action's button. */
function pulseAction(name) {
  const btn = $(`#view button[data-action="${CSS.escape(name)}"]`);
  if (!btn) return;
  btn.scrollIntoView({behavior:"smooth", block:"center"});
  btn.focus({preventScroll: true});
  btn.classList.add("pulse");
  setTimeout(() => btn.classList.remove("pulse"), 1500);
}

/* ── an embedded collection (a link with embed:true): the rows render on
   the detail page itself, with the same table — and the same honest
   per-row buttons — the collection screen uses. The fetch is best-effort:
   a failure is a quiet line, never a broken page. Embeds refresh with the
   page render, not on their own stream. ─────────────────────────────── */
function embedSection(rel, link) {
  const head = el("div", {class:"embed-head"},
    el("b", {}, link.summary || title(rel)),
    link.badge != null
      ? el("span", {class:"badge", title:"count, per the server"},
          String(link.badge)) : null,
    el("a", {class:"open", href:"#"+link.href}, "open ↗"));
  const bodyBox = el("div", {}, el("span", {class:"muted"}, "…"));
  const sec = el("div", {class:"embed"}, head, bodyBox);
  (async () => {
    let env;
    try {
      const {res, body} = await api(link.href);
      if (!res.ok) throw new Error(body?.title || `HTTP ${res.status}`);
      env = body;
    } catch (e) {
      bodyBox.textContent = "";
      bodyBox.append(el("div", {class:"muted"},
        `couldn't load — ${e.message || e}`));
      return;
    }
    const hints = await dataHints((env.kind || "").replace(/_collection$/, ""));
    const total = env.data?.total ?? (env.data?.items || []).length;
    head.insertBefore(el("span", {class:"muted mono",
      style:"font-size:11px", title:"fetched just now"}, `${total} total`),
      head.lastChild);
    bodyBox.textContent = "";
    const items = env.data?.items || [];
    // the create affordance rides the embed itself — you file the next
    // statement from the account, never only from the empty state. An
    // attachment collection wears the upload flow; the filter this embed
    // was fetched with prefills its target (this very account).
    const create = env.actions?.create;
    const createBtn = () => {
      if (!create) return null;
      const prefill = filterPrefill(link.href, create);
      const btn = env.kind === "attachment_collection"
        ? uploadButton({entry: create, doc: env, prefill, small: true,
            onDone: b => go(b.self)})
        : actionButton({name:"create", entry: create, doc: env, label:"New",
            small: true, prefill, onDone: b => go(b.self)});
      btn.classList.add("primary");
      return btn;
    };
    if (!items.length) {
      bodyBox.append(el("span", {class:"kc-none"}, "none yet"));
      const btn = createBtn();
      if (btn) bodyBox.append(" ", btn);
      return;
    }
    bodyBox.append(itemTable(items, hints,
      new Set(env.meta?.recomputing || []), null,
      env.kind === "attachment_collection"
        ? {rowAction: it => downloadButton(it, true)} : undefined));
    const btn = createBtn();
    if (btn)
      bodyBox.append(el("div", {class:"actions", style:"margin-top:10px"},
        btn));
  })();
  return sec;
}

/* ── the decision surface screen (design 6.0 §4): an ordinary envelope
   whose data is the anchor's — title from the declared template,
   showcased actions first and prominent, members pre-embedded by the
   server (no client-side fetch), each with its "open ↗" to the real
   collection. Nothing here is invented: the surface declared it. ────── */
function renderSurface(view, doc, hints) {
  hints = hints || {};
  const panel = el("div", {class:"panel"});
  const surfaceName = doc.kind.slice("surface:".length);
  const anchor = doc.links?.anchor;
  panel.append(el("div", {class:"crumbs"},
    el("a", {href:"#"}, "Workspace"),
    ...(anchor ? [" / ", el("a", {href:"#"+anchor.href, title: anchor.href},
                            title(anchor.kind || ""))] : []),
    " / ", el("span", {class:"surface-mark", title: doc.kind},
      "⧉ " + pretty(surfaceName))));
  panel.append(el("h2", {}, doc.display?.title || title(surfaceName)),
    el("div", {}, el("span", {class:"chip "+tone(doc), title: doc.state},
      doc.display?.state?.label ?? title(doc.state)),
      el("span", {class:"version"}, `v${doc.meta.version}`)));
  panel.append(el("div", {class:"summary"}, doc.summary));
  const banner = recomputeBanner(doc);
  if (banner) panel.append(banner);
  const recomputing = new Set(doc.meta?.recomputing || []);

  // the read surface up front, as on the resource page (members arrive
  // embedded below with their own heads; the chips are the scent)
  const chips = linkChips(doc);
  if (chips) panel.append(chips);

  // the server already ordered showcase-then-declared; the flag only
  // adds the prominence ring — order is the definition's, not this
  // client's to re-derive
  const bar = el("div", {class:"actions"});
  for (const [name, entry] of Object.entries(doc.actions || {})) {
    const btn = actionButton({name, entry, doc, onDone: () => render()});
    if (entry.showcased) {
      btn.classList.add("suggested");
      btn.append(el("span", {class:"suggest-chip",
        title: "showcased by this surface's definition"}, "showcased"));
    }
    bar.append(btn);
  }
  // the anchor's honest refusals, ranked exactly as the resource page
  // ranks them: reasons at the bar, boilerplate compressed to the footer
  const {blocked, grouped, gated} = splitRefusals(doc);
  for (const [name, entry] of blocked)
    bar.append(el("button", {class:"blocked", disabled:"",
      title: entry.reason || ""}, label(name, entry)));
  panel.append(bar);
  const notes = blockedNotes(blocked, doc);
  if (notes) panel.append(notes);

  // the anchor's data, through the anchor kind's own field renderer
  const table = el("table", {class:"kv"});
  for (const [f, v] of Object.entries(doc.data || {})) {
    const h = hints[f] || {xd: {}};
    if (h.xd.hidden) continue;
    table.append(el("tr", {},
      el("td", {class:"k", title: f}, h.xd.label || title(f)),
      el("td", {}, Array.isArray(v) && (doc.parts?.[f] || h.items)
        ? rowsTable(v, doc, doc.parts?.[f], h.items)
        : recomputing.has(f)
          ? recomputingCell(v)
          : hintedValue(h.xd, v, doc.data, h.src, h.auth))));
  }
  panel.append(el("details", {open:""},
    el("summary", {class:"muted"}, "Data"), table));

  // members arrive pre-embedded, in the declared order
  for (const [rel, m] of Object.entries(doc.embedded || {}))
    panel.append(memberSection(rel, m));

  // the anchor's history: a surface's own self is /surfaces/… (no events
  // route), so replay the ANCHOR's transition log — the surface renders it
  if (anchor?.href) panel.append(historySection(`${anchor.href}/-/events`));

  const footer = notNowFooter(grouped, gated, doc);
  if (footer) panel.append(footer);
  view.append(panel);
  watchResource(doc);
}

/* One embedded member: the declared table (x-display.columns names the
   columns and their order), the honest total, and the "open ↗" to the
   real collection — the rows came in the envelope; nothing is fetched
   except the target kind's display hints. */
function memberSection(rel, m) {
  const head = el("div", {class:"embed-head"},
    el("b", {}, m.summary || title(rel)),
    el("span", {class:"muted mono", style:"font-size:11px",
                title: "count, per the server"},
      `${m.total ?? (m.items || []).length} total`),
    el("a", {class:"open", href:"#"+m.href}, "open ↗"));
  const box = el("div", {});
  const sec = el("div", {class:"embed"}, head, box);
  if (m.problem) {
    box.append(el("div", {class:"muted"},
      `couldn't load — ${m.problem.detail || m.problem.title || ""}`));
    return sec;
  }
  const items = m.items || [];
  if (!items.length) {
    box.append(el("span", {class:"kc-none"}, "none yet"));
    return sec;
  }
  (async () => {
    const hints = await dataHints((m.kind || "").replace(/_collection$/, ""));
    box.append(itemTable(items, hints, new Set(),
      m["x-display"]?.columns));
  })();
  return sec;
}

/* ── actions: buttons, forms from input schema, confirm, dry-run ────── */
function label(name, entry) { return entry.display?.label || title(name); }
function tone(doc) {
  const t = doc.display?.state?.tone;
  if (t) return t;
  return "";
}
function fmt(v) {
  if (v === null || v === undefined) return el("span", {class:"muted"}, "—");
  if (typeof v === "boolean")
    return v ? "✓" : el("span", {class:"muted"}, "—");
  if (Array.isArray(v)) {
    if (!v.length) return el("span", {class:"muted"}, "—");
    if (v.every(x => x && typeof x === "object" && !Array.isArray(x)))
      return rowsTable(v);
    return el("span", {}, ...v.map(x =>
      el("span", {class:"chip", style:"margin-right:4px"}, String(x))));
  }
  if (typeof v === "object") return kvTable(v);
  return String(v);
}

/* Provenance cells (design §1): the schema's x-source, made visible.
   The tooltip claims only what the wire actually says. */
function derivedCell(v) {
  return el("span", {class:"v-derived",
      title:"ƒ derived — computed by the definition; one definition, "
          + "every consumer"},
    el("span", {class:"fmark"}, "ƒ"), " ", fmt(v));
}
function authoredCell(v, authority) {
  return el("span", {},
    el("span", {class:"v-authored",
        title:"authored — an external authority owns this value; it is "
            + "read-only here"}, fmt(v)),
    el("span", {class:"src-chip"}, authority || "external"));
}
function recomputingCell(v) {
  return el("span", {class:"v-recomputing",
      title:"recomputing under a new definition — this stored value may "
          + "predate the current law"},
    el("span", {class:"spin-dot"}), fmt(v));
}

/* A list of objects as a table: union of keys in first-appearance order,
   all-null columns dropped (they appear once any row fills them in).
   With a parts group (doc.parts[field]), each row gains the scoped actions
   the server bound to it — honest per-row buttons, invented nowhere. */
function rowsTable(rows, doc, partGroup, itemHints) {
  itemHints = itemHints || {};
  // a column consumed as another column's link label carries no extra
  // information; hidden columns are machine plumbing
  const consumed = new Set(Object.values(itemHints)
    .map(xd => xd.label_field).filter(Boolean));
  const cols = [];
  for (const r of rows) for (const k of Object.keys(r))
    if (!cols.includes(k)) cols.push(k);
  const shown = cols.filter(c => rows.some(r => r[c] !== null && r[c] !== undefined)
    && !itemHints[c]?.hidden && !consumed.has(c)
    && !proseColumn(itemHints[c], rows, c));
  const table = el("table", {class:"items"}, el("thead", {},
    el("tr", {}, ...shown.map(c =>
        el("th", {title: c}, itemHints[c]?.label || title(c))),
      ...(partGroup ? [el("th", {})] : []))));
  const tbody = el("tbody", {});
  for (const r of rows) {
    const tr = el("tr", {}, ...shown.map(c =>
      el("td", {}, hintedValue(itemHints[c] || {}, r[c], r,
                               itemHints[c]?.source,
                               itemHints[c]?.authority))));
    if (partGroup) {
      const part = partGroup.items.find(p => p.key === r[partGroup.key]);
      const cell = el("td", {style:"white-space:nowrap"});
      for (const [name, entry] of Object.entries(part?.actions || {})
          .sort((a,b) => (a[1].display?.order ?? 5) - (b[1].display?.order ?? 5)))
        cell.append(actionButton({name, entry, doc, small: true,
                                  onDone: () => render()}));
      tr.append(cell);
    }
    tbody.append(tr);
  }
  table.append(tbody);
  return table;
}

function kvTable(obj) {
  const table = el("table", {class:"kv"});
  for (const [k, v] of Object.entries(obj))
    table.append(el("tr", {},
      el("td", {class:"k", title: k}, title(k)), el("td", {}, fmt(v))));
  return table;
}

function actionButton({name, entry, doc, label: lbl, small, onDone, prefill}) {
  const btn = el("button",
    {class: entry.display?.style === "primary" ? "primary"
          : entry.display?.style === "danger" ? "danger" : "",
     style: small ? "font-size:12px;padding:3px 8px" : "",
     "data-action": name,   // the remedy chip's walk finds it by name
     title: entry.display?.description || ""},
    lbl || label(name, entry));
  // effort as a subtle chip (assent is the floor and stays unmarked)
  if (!small && entry.effort && entry.effort !== "assent")
    btn.append(el("span", {class:"effort-chip",
      title: `effort: ${entry.effort}`}, entry.effort));
  btn.addEventListener("click", () =>
    actionDialog({name, entry, doc, onDone, prefill}));
  return btn;
}

function schemaFields(schema) {
  const props = schema?.properties || {};
  return Object.entries(props).map(([fname, s]) => {
    const sub = s.anyOf ? s.anyOf.find(o => o.type !== "null") || {} : s;
    return {name: fname, schema: sub, raw: s,
            required: (schema.required || []).includes(fname),
            display: s["x-display"] || {}};
  });
}

/* An array of plain strings: the schema already says everything a list
   editor needs — demanding raw JSON for it would be dishonest effort. */
function isStringList(schema) {
  return schema.type === "array" &&
    (schema.items?.type === "string" || schema.items === undefined);
}

let wellKnownCache = null;   // caches the PROMISE: concurrent callers
function wellKnown() {       // (nav + document, both racing at boot)
  if (!wellKnownCache)       // share one discovery fetch
    wellKnownCache = api(`${BASE}/.well-known/waymark`).then(
      r => r.body,
      err => { wellKnownCache = null; throw err; });
  return wellKnownCache;
}

/* ── data-field display hints from the published data schema (§8) ──────
   {field: {xd, src, auth, items}}: xd = the field's x-display (widget/
   hidden/label/label_field), src = its x-source (derived|authored|absent
   = written), auth = its x-authority (WHO owns an authored value), items
   = per-column x-display (+source/authority) for list-of-object
   fields. */
const dataHintsCache = {};
async function dataHints(kind) {
  if (!(kind in dataHintsCache)) {
    try {
      const {res, body} = await api(`${BASE}/schemas/${kind}`);
      dataHintsCache[kind] = res.ok ? body : {};
    } catch { dataHintsCache[kind] = {}; }
  }
  const xdOf = p => {
    if (!p || typeof p !== "object") return {};
    const sub = p.anyOf ? p.anyOf.find(o => o.type !== "null") || {} : p;
    return p["x-display"] || sub["x-display"] || {};
  };
  const srcOf = p => {
    if (!p || typeof p !== "object") return null;
    const sub = p.anyOf ? p.anyOf.find(o => o.type !== "null") || {} : p;
    return p["x-source"] || sub["x-source"] || null;
  };
  const authOf = p => {
    if (!p || typeof p !== "object") return null;
    const sub = p.anyOf ? p.anyOf.find(o => o.type !== "null") || {} : p;
    return p["x-authority"] || sub["x-authority"] || null;
  };
  const out = {};
  for (const [f, p] of Object.entries(dataHintsCache[kind].properties || {})) {
    const sub = p.anyOf ? p.anyOf.find(o => o.type !== "null") || {} : p;
    const itemProps = (sub.items || p.items || {}).properties;
    out[f] = {xd: xdOf(p), src: srcOf(p), auth: authOf(p),
      items: itemProps ? Object.fromEntries(
        Object.entries(itemProps).map(([k, v]) =>
          [k, {...xdOf(v), source: srcOf(v), authority: authOf(v)}])) : null};
  }
  return out;
}

/* A cross-resource reference: a link to the referenced resource, labeled by
   the sibling label_field when the server denormalized a name, else by the
   referenced resource's own summary (fetched lazily). Raw ids are machine
   plumbing — humans get the thing, not the token. */
/* Plumbing reads ride the lookup route class (design §3): the server
   knows option-filling and label resolution are not navigation by which
   route was traversed — there is no flag to remember to send. */
function lookupHref(colHref) {
  return colHref.replace(`${BASE}/`, `${BASE}/-/lookup/`);
}

function resourceRef(kind, id, text) {
  const a = el("a", {href: "#", title: id},
    text || `${pretty(kind)} · ${String(id).slice(0, 8)}`);
  wellKnown().then(w => {
    const col = w.collections?.[kind];
    if (!col) return;
    a.href = "#" + col + "/" + id;
    if (!text) api(`${lookupHref(col)}/${id}?depth=summary`).then(({res, body}) => {
      if (res.ok && body.summary) a.textContent = body.summary;
    }).catch(() => {});
  });
  return a;
}

/* Value cell for one data field/column, honoring its x-display hint and
   its declared provenance (x-source; x-authority names WHO owns an
   authored value). Written fields render plain. */
function hintedValue(xd, value, row, src, authority) {
  if (xd.widget === "resource" && value)
    return resourceRef(xd.kind, value, xd.label_field ? row?.[xd.label_field] : null);
  if (xd.widget === "prose" && value)
    return el("div", {style:"white-space:pre-wrap;max-width:640px;" +
      "max-height:320px;overflow-y:auto"}, String(value));
  if (src === "derived") return derivedCell(value);
  if (src === "authored") return authoredCell(value, authority);
  return fmt(value);
}

/* Long-form text has no business in a table — declared prose is excluded,
   and undeclared long strings are excluded defensively (the detail page
   still shows them; a column of paragraphs orients nobody). */
function proseColumn(xd, rows, col) {
  if (xd?.widget === "prose") return true;
  return rows.some(r => typeof r?.[col] === "string" && r[col].length > 120);
}

/* Fill a <select> from the collection behind a {widget:"resource", kind,
   params?} field hint: option value = the id, label = the summary. Only
   when the collection fits on one server page (default page[size]=25,
   router.py split_query) — a <select> beyond that would silently drop
   every row past page 1, so a truncated fetch swaps in a searchable
   combobox instead (buildResourceCombobox below). */
async function populateResourceOptions(select, kind, params, required) {
  const index = await wellKnown();
  let href = index.collections?.[kind];
  if (!href) return;
  href = lookupHref(href);
  if (params && Object.keys(params).length)
    href += (href.includes("?") ? "&" : "?") + new URLSearchParams(params);
  const {res, body} = await api(href);
  if (!res.ok) return;
  const items = body.data.items || [];
  if (!body.links?.next) {
    for (const item of items)
      select.append(el("option", {value: item.self.split("/").pop(),
                                  title: item.self}, item.summary));
    return;
  }
  // more than one page: by the time this resumes (a real fetch happened),
  // every synchronous step of the dialog build — including any prefill
  // assignment to `select.value` — has already run, so it's safe to read
  // here and carry over to the combobox's hidden field
  const pendingValue = select.value;
  const combo = buildResourceCombobox(select.name, items, body.links.next.href,
                                      required);
  combo.hidden.value = pendingValue;
  select.replaceWith(combo.el);
  await combo.ready;
}

/* ── the combobox a truncated <select> swaps into: starts from the page
   already fetched, keeps pulling pages in the background (capped, and
   honest about it) so search reaches the whole collection — never just a
   silently shorter one. Type to filter by summary; picking a row writes
   the id into the hidden field the form actually submits. ───────────── */
function buildResourceCombobox(name, firstPageItems, nextHref, required) {
  const hidden = el("input", {type:"hidden", name});
  const search = el("input", {type:"text", class:"combo-search",
    autocomplete: "off",
    placeholder: required ? "type to search…" : "type to search, or leave blank"});
  const panel = el("div", {class:"combo-panel"});
  const wrap = el("div", {class:"combo"}, hidden, search, panel);
  const items = [...firstPageItems];
  const CAP = 2000;   // a hard ceiling so one huge collection can't hang the form
  let next = nextHref, truncated = false, loading = true;

  const idOf = it => it.self.split("/").pop();
  const labelFor = id => items.find(it => idOf(it) === id)?.summary;
  const hint = text => el("div", {class:"combo-empty muted"}, text);

  const render = () => {
    const q = search.value.trim().toLowerCase();
    const pool = q ? items.filter(it => (it.summary || "").toLowerCase().includes(q))
                   : items;
    const matches = pool.slice(0, 50);
    panel.textContent = "";
    for (const it of matches)
      panel.append(el("div", {class:"combo-option",
        // el()'s attrs only wire up "onclick" via addEventListener — any
        // other onXxx key becomes an inert stringified-attribute no-op
        onclick: () => {
          hidden.value = idOf(it);
          search.value = it.summary;
          panel.style.display = "none";
        }}, it.summary));
    if (loading) panel.append(hint("loading…"));
    else if (!matches.length) panel.append(hint("no matches"));
    else if (matches.length < pool.length)
      panel.append(hint(`showing ${matches.length} of ${pool.length} — `
                        + "refine your search"));
    if (truncated)
      panel.append(hint(`only the first ${items.length} loaded — search `
                        + "text to narrow further"));
  };
  search.addEventListener("input", () => {
    // typing again abandons whatever was picked — a stale hidden id the
    // visible text no longer names would submit silently wrong
    if (hidden.value && labelFor(hidden.value) !== search.value) hidden.value = "";
    panel.style.display = "block";
    render();
  });
  search.addEventListener("focus", () => { panel.style.display = "block"; render(); });
  document.addEventListener("click", e => {
    if (!wrap.contains(e.target)) panel.style.display = "none";
  });

  const ready = (async () => {
    while (next && items.length < CAP) {
      const {res, body} = await api(next);
      if (!res.ok) break;
      items.push(...(body.data.items || []));
      next = body.links?.next?.href;
    }
    truncated = !!next;
    loading = false;
    if (hidden.value && !search.value) {
      const lbl = labelFor(hidden.value);
      if (lbl) search.value = lbl;
    }
    if (panel.style.display === "block") render();
  })();
  return {el: wrap, hidden, ready};
}

function formValue(field, raw) {
  if (raw === "" || raw == null) return undefined;
  const t = field.schema.type;
  if (t === "number") return Number(raw);
  if (t === "integer") return parseInt(raw, 10);
  if (t === "boolean") return raw === "true" || raw === "on";
  if (isStringList(field.schema))
    return raw.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  if (t === "array" || t === "object") { try { return JSON.parse(raw); } catch { return raw; } }
  return raw;
}

/* ── the compound blast radius (design §6): what the act spans, listed
   before anyone commits to it. Each effect entry names {service, op,
   compensate} — the undo is part of the advertised contract, so the
   confirm reads "calls: blob.copy (compensated by blob.delete)". A bare
   "svc.op" string is the older wire, kept readable. ─────────────────── */
function blastLines(effect) {
  const out = [];
  if (effect.creates?.length)
    out.push("creates: " + effect.creates.map(pretty).join(", "));
  if (effect.advances?.length)
    out.push("advances: " + effect.advances.join(", "));
  if (effect.effects?.length)
    out.push("calls: " + effect.effects.map(e =>
        typeof e === "string" ? e
          : `${e.service}.${e.op}` + (e.compensate
              ? ` (compensated by ${e.service}.${e.compensate})` : ""))
      .join(", ") + (effect.deferred ? " (deferred)" : ""));
  return out;
}

/* The confirm dialog: consequences in the serif, the whole act listed. */
function confirmAct({name, entry, effect}) {
  return new Promise(resolve => {
    const dlg = $("#confirmdlg");
    dlg.textContent = "";
    let settled = false;
    const done = v => { settled = true; dlg.close(); resolve(v); };
    const lines = [
      `${label(name, entry)} moves this to '${pretty(effect.to ?? "—")}'`
        + (effect.terminal ? " — terminal, no way back." : "."),
      ...blastLines(effect),
    ];
    dlg.append(el("div", {class:"body"},
      el("h3", {}, "Confirm: " + label(name, entry)),
      ...lines.map(l => el("p", {class:"consequence"}, l)),
      el("div", {class:"buttons"},
        el("button", {type:"button", onclick: () => done(false)}, "Cancel"),
        el("button", {type:"button",
            class: entry.display?.style === "danger" ? "danger" : "primary",
            onclick: () => done(true)}, label(name, entry)))));
    dlg.onclose = () => { if (!settled) resolve(false); };
    dlg.showModal();
  });
}

/* ── batch (design §7): the collection form of the act. Minimal and
   honest: one JSON object per line, N inputs → N verdicts. ──────────── */
function batchSection(entry, doc, draft) {
  const b = entry.batch;
  const ta = el("textarea", {rows: 8, class: "mono",
    placeholder: '{"field": "value"} — one JSON object per line'});
  const staged = draft?.values?.items;   // a batch draft stages {items:[…]}
  if (Array.isArray(staged) && staged.length)
    ta.value = staged.map(x => JSON.stringify(x)).join("\n");
  const dryBox = el("input", {type:"checkbox"});
  const out = el("div", {});
  const run = el("button", {type:"button", class:"primary", onclick: async () => {
    const lines = ta.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    const items = [];
    for (const [i, line] of lines.entries()) {
      try { items.push(JSON.parse(line)); }
      catch {
        out.textContent = "";
        out.append(problemBox({title: "Bad JSON",
          detail: `line ${i + 1} is not a JSON object`}));
        return;
      }
    }
    if (!items.length) {
      out.textContent = "";
      out.append(problemBox({title: "Nothing to send",
        detail: "add one JSON object per line"}));
      return;
    }
    const href = entry.batch.href + (dryBox.checked ? "?dry_run=1" : "");
    const {res, body: rb} = await api(href, {method: "POST",
      headers: {"Content-Type": "application/json",
                "Idempotency-Key": uuid()},
      body: JSON.stringify({items})});
    out.textContent = "";
    if (!res.ok) {
      out.append(problemBox(rb));
      // an atomic abort still carries every item's verdict — show them
      if (rb.verdicts) out.append(verdictGrid({...(rb.report || {}),
                                               verdicts: rb.verdicts}));
      return;
    }
    out.append(verdictGrid(rb.data || rb));
    if (!dryBox.checked) render();
  }}, "Run batch");
  return el("details", {class:"batchbox"},
    el("summary", {},
      `batch — ${b.atomic ? "all or nothing" : "item by item"}, `
      + `up to ${b.max_items}`),
    ta,
    el("div", {class:"buttons", style:"justify-content:flex-start"},
      run,
      el("label", {style:"display:flex;align-items:center;gap:5px;" +
                         "font-size:12px;margin:0"}, dryBox, "dry run")),
    out);
}

/* The verdict grid: index and outcome are machine truth (mono, colored);
   the reason is the server's sentence (serif). Renders the batch shape
   ({verdicts:[{index, verdict, reason}]}) and the older bulk-report shape
   ({refusals:[{self, reason}]}) alike. */
function verdictGrid(report) {
  report = report || {};
  const box = el("div", {class:"verdictbox"});
  box.append(el("div", {class:"verdict-totals mono"},
    `succeeded ${report.succeeded ?? 0} · refused ${report.refused ?? 0} `
    + `· failed ${report.failed ?? 0}`));
  const rows = [];
  for (const v of report.verdicts || [])
    rows.push([String(v.index), v.verdict === "ok" ? "succeeded" : v.verdict,
               v.reason]);
  for (const r of report.refusals || [])
    rows.push([r.self || "", "refused", r.reason]);
  if (rows.length) {
    const table = el("table", {class:"verdicts"}, el("thead", {},
      el("tr", {}, el("th", {}, "#"), el("th", {}, "outcome"),
        el("th", {}, "reason"))));
    const tb = el("tbody", {});
    for (const [i, outcome, reason] of rows)
      tb.append(el("tr", {},
        el("td", {class:"mono"}, i),
        el("td", {}, el("span", {class: "verdict-"
          + (outcome === "succeeded" ? "ok" : outcome)}, outcome)),
        el("td", {class:"reason"}, reason || "")));
    table.append(tb);
    box.append(table);
  }
  return box;
}

/* ── conditional arms (design §5): the input schema's if/then(/else),
   evaluated client-side as values change — the dependent fields reveal
   and demand the moment the comparison crosses the line. ────────────── */
function whenClauses(schema) {
  const out = [];
  const grab = o => { if (o && o.if && o.then) out.push(o); };
  grab(schema);
  for (const o of schema?.allOf || []) grab(o);
  return out;
}
function whenMatches(cond, raw) {
  if (raw === "" || raw == null) return false;
  if ("const" in cond) return String(raw) === String(cond.const);
  if ("enum" in cond) return cond.enum.map(String).includes(String(raw));
  for (const [kw, c] of Object.entries(cond)) {
    // ISO strings order lexicographically as they order temporally
    const v = typeof c === "number" ? Number(raw) : String(raw);
    if (kw === "minimum") return v >= c;
    if (kw === "exclusiveMinimum") return v > c;
    if (kw === "maximum") return v <= c;
    if (kw === "exclusiveMaximum") return v < c;
  }
  return false;
}
function condWord(cond) {
  if ("const" in cond) return `is ${pretty(String(cond.const))}`;
  if ("enum" in cond)
    return `is ${cond.enum.map(v => pretty(String(v))).join(" or ")}`;
  if ("exclusiveMinimum" in cond) return `is past ${cond.exclusiveMinimum}`;
  if ("minimum" in cond) return `is at or past ${cond.minimum}`;
  if ("exclusiveMaximum" in cond) return `is before ${cond.exclusiveMaximum}`;
  if ("maximum" in cond) return `is at or before ${cond.maximum}`;
  return "crosses the line";
}

async function actionDialog({name, entry, doc, onDone, prefill}) {
  const dlg = $("#dlg");
  dlg.textContent = "";
  // the envelope's draft is a snapshot from page render; the form must open
  // against the draft's CURRENT truth, or effort saved after that render
  // looks lost on reopen
  let draft = null;
  if (entry.draft?.href) {
    try {
      const res = await fetch(entry.draft.href, {headers: principalHeaders()});
      if (res.status === 200) {
        // v2: the draft is a sub-resource envelope (kind: "draft")
        const env = await res.json();
        draft = {values: env.data?.values || {}, revs: env.data?.revs || {},
                 saved_at: env.data?.saved_at, stale: env.data?.stale};
      }
    } catch { draft = null; }
  }
  const fields = schemaFields(entry.input);
  const needsConfirm = entry.safety?.confirm;
  const effect = entry.effect || {};
  const body = el("div", {class:"body"});
  const h3 = el("h3", {}, label(name, entry));
  if (entry.effort && entry.effort !== "assent")
    h3.append(el("span", {class:"effort-chip",
      title: `effort: ${entry.effort}`}, entry.effort));
  body.append(h3);
  body.append(el("div", {class:"effect"},
    el("span", {class:"mono"}, doc.state ? pretty(doc.state) : "—"),
    " → ", el("span", {class:"mono"}, pretty(effect.to)),
    (effect.terminal ? " (terminal)" : "") +
    (effect.emits ? ` · emits ${effect.emits.join(", ")}` : "") +
    (entry.safety?.idempotent === false ? " · not idempotent" : "")));
  // the blast radius (design §6): the whole act, listed up front — a
  // person sees what a compound spans before committing to any of it
  const blast = blastLines(effect);
  if (blast.length)
    body.append(el("div", {class:"blast"},
      el("b", {}, "this action is a compound act"),
      ...blast.map(l => el("div", {class:"consequence"}, l))));
  // advisory warnings (E1): the server's own sentences, up front — each
  // with its remedies as chips (the chip closes this dialog before it
  // walks or navigates)
  if (entry.warnings?.length)
    body.append(el("div", {class:"warnbox"},
      ...entry.warnings.flatMap(w => [
        el("div", {class:"consequence"}, `⚠ ${w.reason}`),
        remedyChips(w.remedies, doc, () => dlg.close())])));
  const form = el("form", {method:"dialog"});
  const errBox = el("div", {});
  const dry = el("div", {class:"dryrun muted"}, entry.input ? "" : "");
  const fieldsByName = {};
  for (const f of fields) {
    // const = server pre-bound (a scoped action's key): submitted, never asked
    if (f.schema.const !== undefined) continue;
    // readOnly (x-source: derived/authored): the engine owns this value —
    // a form that asked for it would be advertising a write the invoker
    // refuses (design §1)
    if (f.raw.readOnly || f.schema.readOnly) continue;
    fieldsByName[f.name] = f;
    const wrap = el("div", {class:"field", "data-field": f.name});
    // label is the server-emitted x-display.label (§8); title() only guards
    // against a non-conformant server that omits it
    wrap.append(el("label", {for:"f_"+f.name, title: f.name},
      f.display.label || title(f.name),
      el("span", {class:"req", style: f.required ? "" : "display:none"},
        " *")));
    let input, optionsReady = null;
    if (f.display.widget === "resource" && f.display.kind) {
      // x-display {widget:"resource", kind, params?}: options come from the
      // referenced collection — still envelope-driven (index → collection)
      input = el("select", {name:f.name, id:"f_"+f.name});
      if (!f.required) input.append(el("option", {value:""}, "—"));
      optionsReady = populateResourceOptions(input, f.display.kind,
                                             f.display.params, f.required);
    } else if (f.schema.enum) {
      input = el("select", {name:f.name, id:"f_"+f.name});
      if (!f.required) input.append(el("option", {value:""}, "—"));
      for (const v of f.schema.enum) input.append(el("option", {value:v}, pretty(v)));
    } else if (f.schema.type === "boolean") {
      input = el("select", {name:f.name, id:"f_"+f.name});
      if (!f.required) input.append(el("option", {value:""}, "—"));
      input.append(el("option", {value:"true"}, "true"),
                   el("option", {value:"false"}, "false"));
    } else if (f.display.widget === "prose") {
      // long-form gets a real editing surface, never a one-line input
      input = el("textarea", {name:f.name, id:"f_"+f.name, rows: 12,
        maxlength: f.schema.maxLength});
    } else if (isStringList(f.schema)) {
      // list of strings: one entry per line — the schema declared the
      // shape, so the client never asks a human to type JSON
      input = el("textarea", {name:f.name, id:"f_"+f.name, rows: 5,
        placeholder: "one per line"});
    } else if (["array", "object"].includes(f.schema.type)) {
      input = el("textarea", {name:f.name, id:"f_"+f.name, rows: 5,
        placeholder: "JSON " + f.schema.type});
    } else {
      input = el("input", {name:f.name, id:"f_"+f.name,
        type: f.schema.format === "date" ? "date"
            : ["number","integer"].includes(f.schema.type) ? "number" : "text",
        step:"any", placeholder: f.schema.format || f.schema.type || "",
        maxlength: f.schema.maxLength});
    }
    // precedence: the principal's saved draft, then the caller's prefill
    // (the collection filter already in view), then the server default —
    // which for prefill actions is the document's current value (§10.1)
    const draftVal = draft?.values?.[f.name];
    const initial = draftVal !== undefined ? draftVal
      : prefill?.[f.name] !== undefined ? prefill[f.name]
      : f.schema.default;
    if (initial !== undefined && initial !== null) {
      const val = isStringList(f.schema) && Array.isArray(initial)
        ? initial.join("\n")
        : typeof initial === "object"
          ? JSON.stringify(initial) : String(initial);
      input.value = val;
      // a resource select's options land async — re-assert the value once
      // they have (a select can't hold a value its options don't offer)
      if (optionsReady) optionsReady
        .then(() => { if (!input.value) input.value = val; })
        .catch(() => {});
    }
    if (f.display.help) wrap.append(el("div", {class:"muted", style:"font-size:11px"}, f.display.help));
    wrap.append(input, el("div", {class:"field-error", id:"err_"+f.name}));
    form.append(wrap);
  }

  // x-display.relation {op, with, side} (§5): comparison-related inputs
  // constrain each other live — the left side of a<=b takes max from the
  // right, the right takes min from the left (mirrored for >=/>)
  for (const f of fields) {
    const rel = f.display.relation;
    if (!rel || rel.op === "==") continue;
    const mine = form.elements[f.name], other = form.elements[rel.with];
    if (!mine || !other || mine.tagName !== "INPUT") continue;
    const lessOp = rel.op === "<=" || rel.op === "<";
    const prop = (lessOp === (rel.side === "left")) ? "max" : "min";
    const bound = () => other.value ? mine.setAttribute(prop, other.value)
                                    : mine.removeAttribute(prop);
    other.addEventListener("input", bound);
    bound();
  }

  // conditional arms from When (§5): watch the trigger, reveal/require the
  // dependent fields the moment the declared comparison crosses the line,
  // with a one-line note in the document's own voice
  for (const clause of whenClauses(entry.input)) {
    const trigger = Object.keys(clause.if.properties || {})[0];
    const trigEl = trigger && form.elements[trigger];
    if (!trigEl || typeof trigEl.closest !== "function") continue;
    const cond = clause.if.properties[trigger];
    const deps = (clause.then.required || []).filter(d => form.elements[d]);
    if (!deps.length) continue;
    const note = el("div", {class:"when-note", style:"display:none"});
    trigEl.closest(".field").append(note);
    const apply = () => {
      const on = whenMatches(cond, trigEl.value);
      note.style.display = on ? "" : "none";
      note.textContent = on
        ? `${pretty(trigger)} ${condWord(cond)} — `
          + `${deps.map(pretty).join(" and ")} now required`
        : "";
      for (const d of deps) {
        const wrap = form.elements[d].closest(".field");
        // forbids_otherwise (an else clause) hides the arm entirely
        if (wrap) wrap.style.display = (clause.else && !on) ? "none" : "";
        form.elements[d].required = on;
        const req = wrap && wrap.querySelector(".req");
        if (req) req.style.display =
          (on || fieldsByName[d]?.required) ? "" : "none";
      }
    };
    trigEl.addEventListener("input", apply);
    trigEl.addEventListener("change", apply);
    apply();
  }

  const collect = () => {
    if (!entry.input) return null;
    const out = {};
    for (const f of fields) {
      if (f.schema.const !== undefined) { out[f.name] = f.schema.const; continue; }
      const v = formValue(f, new FormData(form).get(f.name));
      if (v !== undefined) out[f.name] = v;
    }
    return out;
  };

  // server-side draft autosave: effort persists across dismissal, devices,
  // and clients — the envelope advertised where (entry.draft.href)
  let flushDraft = null, disarmDraft = null, ws = null;
  const draftBar = el("div", {class:"dryrun muted"});
  if (entry.draft) {
    const stamp = t => new Date(t).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    const savedNote = el("span", {},
      draft?.saved_at ? `draft saved ${stamp(draft.saved_at)}` : "");
    const peers = el("span", {class:"muted"});
    if (draft?.stale)
      draftBar.append(el("span", {class:"bad"},
        `⚠ draft from an older version of this ${pretty(doc.kind)} — review before submitting · `));
    // the collab seam: waymark-relay/2 — per-field revisions on the wire,
    // so the merge discipline is the protocol's, not this form's. Losing
    // the socket just falls back to the plain PUT below.
    let lastKnown = {...(draft?.values || {})};
    const revs = {...(draft?.revs || {})};
    const dirty = new Set();  // fields with local edits not yet sent
    const applyRemoteField = (k, v, rev) => {
      if (rev !== undefined) {
        if (rev <= (revs[k] || 0)) return;  // we already hold this or newer
        revs[k] = rev;
      }
      lastKnown[k] = v;
      const input = form.elements[k];
      if (!input) return;
      // hold off only while the user has unsent keystrokes in this exact
      // field — a stale send comes back as a reject carrying the truth;
      // a merely-focused field still receives edits, caret preserved
      if (input === document.activeElement && dirty.has(k)) return;
      const val = v == null ? ""
        : typeof v === "object" ? JSON.stringify(v) : String(v);
      if (input === document.activeElement) {
        const s = input.selectionStart, e = input.selectionEnd;
        input.value = val;
        try { input.setSelectionRange(s, e); } catch {}
      } else input.value = val;
    };
    const showPeers = (participants) => {
      const me = principalHeaders()["X-Principal-Id"] || "anonymous";
      const others = (participants || []).filter(p => p.id !== me);
      peers.textContent = others.length
        ? ` · editing with ${others.map(p => p.display || p.id).join(", ")}` : "";
    };
    if (entry.draft.collab) {
      const h = principalHeaders();
      const q = new URLSearchParams();
      if (h["X-Principal-Id"]) {
        q.set("principal-id", h["X-Principal-Id"]);
        q.set("principal-type", h["X-Principal-Type"] || "human");
        q.set("principal-display", h["X-Principal-Display"] || h["X-Principal-Id"]);
        if (h["X-Principal-Roles"]) q.set("principal-roles", h["X-Principal-Roles"]);
      }
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      const sep = entry.draft.collab.href.includes("?") ? "&" : "?";
      try {
        ws = new WebSocket(`${proto}//${location.host}${entry.draft.collab.href}${sep}${q}`);
        ws.onmessage = (ev) => {
          const m = JSON.parse(ev.data);
          if (m.type === "state") {
            for (const [k, v] of Object.entries(m.values || {}))
              applyRemoteField(k, v, (m.revs || {})[k]);
            showPeers(m.participants);
            if (m.saved_at) savedNote.textContent = `draft saved ${stamp(m.saved_at)}`; }
          else if (m.type === "update") { applyRemoteField(m.field, m.value, m.rev);
            savedNote.textContent = `${m.actor?.display || m.actor?.id} edited ${stamp(m.saved_at)}`; }
          else if (m.type === "reject") {
            // our edit was based on a stale revision: the server sent the
            // field's truth — show it and let the user continue from there
            dirty.delete(m.field);
            applyRemoteField(m.field, m.value, m.rev);
            savedNote.textContent = "edit overtaken — showing the latest"; }
          else if (m.type === "presence") showPeers(m.participants);
          else if (m.type === "saved") { revs[m.field] = m.rev;
            savedNote.textContent = `draft saved ${stamp(m.saved_at)}`; }
          else if (m.type === "closed") { ws = null; disarmDraft && disarmDraft(); dlg.close(); }
        };
        ws.onclose = () => { ws = null; peers.textContent = ""; };
      } catch { ws = null; }
    }
    let timer = null;
    const saveDraft = async () => {
      timer = null;
      const all = collect() || {};
      if (ws && ws.readyState === 1) {
        // send only what changed, one relay/2 frame per field, each pinned
        // to the revision it was based on — the server rejects stale edits
        // with the truth instead of silently clobbering anyone
        for (const f of fields) {
          const v = all[f.name] === undefined ? null : all[f.name];
          const known = lastKnown[f.name] === undefined ? null : lastKnown[f.name];
          if (JSON.stringify(v) !== JSON.stringify(known)) {
            lastKnown[f.name] = v;
            ws.send(JSON.stringify({type: "update", field: f.name, value: v,
                                    base_rev: revs[f.name] || 0}));
          }
        }
        dirty.clear();
        return;
      }
      const res = await fetch(entry.draft.href, {
        method: "PUT", headers: {"Content-Type": "application/json",
                                 ...principalHeaders()},
        body: JSON.stringify(all)});
      dirty.clear();
      if (res.ok) {
        // v2: the save returns the draft envelope
        const b = await res.json();
        if (b.data?.revs) Object.assign(revs, b.data.revs);
        savedNote.textContent = `draft saved ${stamp(b.data?.saved_at || Date.now())}`;
      }
    };
    form.addEventListener("input", (ev) => {
      if (ev.target?.name) dirty.add(ev.target.name);
      clearTimeout(timer);
      timer = setTimeout(saveDraft, ws ? 400 : 1000);
    });
    // a dismissal inside the debounce window must not lose the keystrokes —
    // but a submit/discard must disarm, or the pending save resurrects a
    // draft the server just consumed
    flushDraft = () => { if (timer) { clearTimeout(timer); saveDraft(); } };
    disarmDraft = () => { clearTimeout(timer); timer = null; flushDraft = null; };
    const discard = el("button", {type: "button",
      style: "font-size:11px;padding:2px 8px;margin-left:8px"}, "Discard draft");
    discard.addEventListener("click", async () => {
      disarmDraft && disarmDraft();
      await fetch(entry.draft.href, {method: "DELETE",
                                     headers: principalHeaders()});
      dlg.close(); onDone && onDone(doc);
    });
    draftBar.append(savedNote, discard, peers);
  }

  // blur-time dry_run = the inline-validation affordance (§7.1)
  const runDry = async () => {
    const {res, body: b} = await invoke(entry, doc, collect(), {dryRun: true});
    if (res.ok) { dry.textContent = "✓ valid"; dry.className = "dryrun ok"; }
    else {
      dry.textContent = "✗ " + (b.detail || b.title);
      dry.className = "dryrun bad";
      showFieldErrors(b.errors || {});
    }
  };
  if (entry.input) form.addEventListener("focusout", runDry);

  const showFieldErrors = (errors) => {
    for (const f of fields) {
      const box = $("#err_"+f.name);
      if (box) box.textContent = (errors[f.name] || []).join("; ");
    }
  };

  // an unacknowledged advisory guard (E1) comes back as 409 with an
  // `acknowledge` block naming the header + guard names the caller must
  // resend to proceed — render it like the pre-shown entry.warnings box
  // above, and retry with that header on confirm, instead of dead-ending
  // in problemBox with no way forward
  const attemptSubmit = async (acknowledge) => {
    const {res, body: b} = await invoke(entry, doc, collect(), {acknowledge});
    if (res.status === 409 && b.acknowledge?.names?.length) {
      errBox.textContent = "";
      errBox.append(el("div", {class:"warnbox"},
        el("div", {class:"consequence"}, `⚠ ${b.detail || b.title}`),
        ...(b.warnings || []).flatMap(w => [
          el("div", {class:"consequence"}, w.reason),
          remedyChips(w.remedies, doc, () => dlg.close())]),
        el("div", {class:"buttons", style:"justify-content:flex-start"},
          el("button", {type:"button", class:"primary",
              onclick: () => attemptSubmit(b.acknowledge)},
            "Acknowledge and continue"))));
      return;
    }
    if (!res.ok) { errBox.textContent = ""; errBox.append(problemBox(b));
                   showFieldErrors(b.errors || {}); return; }
    disarmDraft && disarmDraft();  // the invoke consumed the draft
    dlg.close();
    maybeUndoToast(name, doc, b);
    onDone && onDone(b);
  };
  const buttons = el("div", {class:"buttons"},
    el("button", {type:"button", onclick: () => dlg.close()}, "Cancel"),
    el("button", {type:"button",
        class: entry.display?.style === "danger" ? "danger" : "primary",
        onclick: async () => {
          if (needsConfirm && !(await confirmAct({name, entry, effect})))
            return;
          await attemptSubmit(null);
        }},
      needsConfirm ? label(name, entry) + "…" : label(name, entry)));
  form.append(draftBar, dry, errBox, buttons);
  body.append(form);
  // the batch form (design §7), when the entry advertises one
  if (entry.batch) body.append(batchSection(entry, doc, draft));
  dlg.append(body);
  // however the dialog is dismissed (Cancel, Escape), flush any keystrokes
  // still inside the debounce window, then refresh the page's envelope
  dlg.onclose = entry.draft
    ? () => { flushDraft && flushDraft();
              if (ws) { try { ws.close(); } catch {} ws = null; }
              render(); } : null;
  dlg.showModal();
}

/* ── the attachment upload affordance (design E5): the two-phase
   reserve→PUT-bytes flow, driven end to end from the wire. The create
   action's own href reserves the row; discovery's attachment_bytes names
   where the bytes go. name and mime are read off the chosen File (typing
   them was the old form's cruelty); the target (resource_kind/resource_id)
   rides in from the collection filter — filing "statements against THIS
   account" already fixed it. A server that advertises no bytes route falls
   back to the generic form, so the client still invents nothing. ──────── */
function uploadButton({entry, doc, prefill, onDone, small}) {
  const btn = el("button", {class:"primary", "data-action":"create",
    style: small ? "font-size:12px;padding:3px 8px" : ""}, "Upload file");
  btn.addEventListener("click", () =>
    uploadDialog({entry, doc, prefill, onDone}));
  return btn;
}

function humanSize(n) {
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
  return `${(n / 1024 / 1024).toFixed(1)} MB`;
}

async function uploadDialog({entry, doc, prefill, onDone}) {
  const w = await wellKnown().catch(() => ({}));
  // no bytes route advertised (older engine): the generic form is the
  // honest fallback — the client drives no route it wasn't handed
  if (!w.attachment_bytes)
    return actionDialog({name:"create", entry, doc, onDone, prefill});
  prefill = prefill || {};
  const props = entry.input?.properties || {};
  const dlg = $("#dlg");
  dlg.textContent = "";
  dlg.onclose = null;
  const body = el("div", {class:"body"});
  body.append(el("h3", {}, "Upload a file"),
    el("div", {class:"effect"}, "reserved → uploaded · the bytes are "
      + "written once"));

  // the target: when the collection filter already fixed it (filing
  // against THIS account), it is stated, not asked; from the raw
  // collection the two fields are the only thing left to pick
  const hasTarget = "resource_kind" in prefill && "resource_id" in prefill;
  if (hasTarget)
    body.append(el("div", {class:"upload-target"}, "against: ",
      resourceRef(prefill.resource_kind, prefill.resource_id)));

  const form = el("form", {method:"dialog"});
  const targetInputs = {};
  if (!hasTarget)
    for (const k of ["resource_kind", "resource_id"]) {
      if (!(k in props)) continue;
      const inp = el("input", {name:k, id:"f_"+k, type:"text",
        value: prefill[k] || ""});
      targetInputs[k] = inp;
      form.append(el("div", {class:"field"},
        el("label", {for:"f_"+k}, pretty(k)), inp));
    }

  const file = el("input", {type:"file", id:"f_file"});
  const preview = el("div", {class:"upload-preview"}, "no file chosen");
  const notesProp = props.notes
    ? (props.notes.anyOf?.find(o => o.type !== "null") || props.notes) : null;
  const notesField = notesProp
    ? el("textarea", {name:"notes", id:"f_notes", rows: 3,
        maxlength: notesProp.maxLength}) : null;
  const upBtn = el("button", {type:"button", class:"primary",
    disabled:"true"}, "Upload");

  let chosen = null;
  file.addEventListener("change", () => {
    chosen = file.files && file.files[0];
    if (chosen) {
      preview.className = "upload-preview chosen";
      preview.textContent = `${chosen.name} · `
        + `${chosen.type || "application/octet-stream"} · `
        + `${humanSize(chosen.size)}`;
      upBtn.removeAttribute("disabled");
    } else {
      preview.className = "upload-preview";
      preview.textContent = "no file chosen";
      upBtn.setAttribute("disabled", "true");
    }
  });
  form.append(el("div", {class:"field"},
    el("label", {for:"f_file"}, "File"), file, preview));
  if (notesField)
    form.append(el("div", {class:"field"},
      el("label", {for:"f_notes"}, "Notes (optional)"), notesField));
  const errBox = el("div", {});

  // the reserve is remembered across a failed bytes PUT, so a retry
  // re-sends the bytes into the SAME reserved row instead of minting a
  // second orphan (bytes write once into a reserved attachment)
  let reservedId = null, reservedBody = null;
  const doUpload = async () => {
    if (!chosen) return;
    errBox.textContent = "";
    upBtn.setAttribute("disabled", "true");
    if (!reservedId) {
      const target = hasTarget
        ? {resource_kind: prefill.resource_kind,
           resource_id: prefill.resource_id}
        : Object.fromEntries(Object.entries(targetInputs)
            .map(([k, i]) => [k, i.value]));
      // name and mime come off the File; the create's other bound
      // constants (a scoped collection's key) ride along untouched
      const create = {...target, name: chosen.name,
        mime: chosen.type || "application/octet-stream"};
      if (notesField && notesField.value.trim())
        create.notes = notesField.value;
      for (const [k, s] of Object.entries(props))
        if (s.const !== undefined) create[k] = s.const;
      const {res, body: b} = await invoke(entry, doc, create, {});
      if (!res.ok) {
        errBox.append(problemBox(b));
        upBtn.removeAttribute("disabled");
        return;
      }
      reservedBody = b;
      reservedId = String(b.self).split("/").pop();
    }
    // phase two — the bytes: PUT to the advertised route; the server
    // stamps size + sha256 and moves the row to uploaded
    const url = w.attachment_bytes.replace("{id}",
      encodeURIComponent(reservedId));
    let putBody = null;
    try {
      const res = await fetch(url, {method:"PUT",
        headers: {...principalHeaders(),
          "Content-Type": chosen.type || "application/octet-stream"},
        body: chosen});
      putBody = res.status === 204 ? null
        : await res.json().catch(() => null);
      if (!res.ok) {
        errBox.append(problemBox(putBody || {title:"Upload failed",
          detail: `the bytes route returned ${res.status} — the file is `
            + "reserved; try uploading again"}));
        upBtn.removeAttribute("disabled");   // retry re-PUTs the same reserve
        return;
      }
    } catch {
      errBox.append(problemBox({title:"Upload failed",
        detail: "could not reach the bytes route — the file is reserved; "
          + "try again"}));
      upBtn.removeAttribute("disabled");
      return;
    }
    dlg.close();
    const toast = $("#toast");
    toast.textContent = `${chosen.name} uploaded ✓`;
    toast.style.display = "block";
    setTimeout(() => toast.style.display = "none", 6000);
    onDone && onDone(putBody || reservedBody);
  };
  upBtn.addEventListener("click", doUpload);

  // a cancel after a reserve-then-failed-PUT left a reserved row behind:
  // refresh so the collection shows it honestly (a success navigates away)
  const cancel = () => { dlg.close(); if (reservedId) render(); };
  form.append(errBox, el("div", {class:"buttons"},
    el("button", {type:"button", onclick: cancel}, "Cancel"),
    upBtn));
  body.append(form);
  dlg.append(body);
  dlg.showModal();
}

/* ── the other half of design E5: getting the bytes back. The bytes route
   (discovery's attachment_bytes, GET) is behind the same act gate as any
   read, and the dev client carries identity in X-Principal-* headers — a
   bare <a href> would arrive unauthenticated. So both View and Download
   fetch WITH the headers and hand off a blob: Download saves it under the
   file's name; View opens types a browser renders inline in a new tab.
   Only meaningful while a row is `uploaded` (a reserved row has no bytes —
   the GET honestly 404s). ───────────────────────────────────────────── */
function isViewable(mime) {
  return /^(image\/|text\/)/.test(mime || "") || mime === "application/pdf";
}

async function attachmentBytesUrl(id) {
  const w = await wellKnown().catch(() => ({}));
  return w.attachment_bytes
    ? w.attachment_bytes.replace("{id}", encodeURIComponent(id)) : null;
}

async function fetchAttachmentBlob(id) {
  const url = await attachmentBytesUrl(id);
  if (!url) return null;
  try {
    const res = await fetch(url, {headers: principalHeaders()});
    if (!res.ok) { toast(`couldn't fetch the file — ${res.status}`); return null; }
    return await res.blob();
  } catch { toast("couldn't reach the file"); return null; }
}

async function downloadAttachment(id, name) {
  const blob = await fetchAttachmentBlob(id);
  if (!blob) return;
  const obj = URL.createObjectURL(blob);
  const a = el("a", {href: obj, download: name || "file"});
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(obj), 10000);
}

async function viewAttachment(id) {
  const blob = await fetchAttachmentBlob(id);
  if (!blob) return;
  const obj = URL.createObjectURL(blob);
  window.open(obj, "_blank");
  // the new tab needs the object alive until it has loaded the bytes
  setTimeout(() => URL.revokeObjectURL(obj), 60000);
}

/* The per-row download for an uploaded attachment (the statements table):
   null for a reserved row, which has no bytes to fetch. */
function downloadButton(item, small) {
  if (!item || item.state !== "uploaded") return null;
  const id = String(item.self).split("/").pop();
  const btn = el("button", {
    style: small ? "font-size:12px;padding:3px 8px" : "",
    title:"download this file"}, "↓ Download");
  btn.addEventListener("click", () => downloadAttachment(id, item.data?.name));
  return btn;
}

async function invoke(entry, doc, body, {dryRun, acknowledge}) {
  const headers = {"Content-Type": "application/json"};
  if (entry.safety?.fence && doc.meta?.etag)
    headers["If-Match"] = doc.meta.etag;
  if (entry.safety?.idempotent === false)
    headers["Idempotency-Key"] = uuid();
  // a retry after the 409 acknowledge prompt below (design E1): the
  // problem body names its own header + names, so this never hardcodes
  // "Waymark-Acknowledge" — a future guard on a different header still works
  if (acknowledge?.header && acknowledge.names?.length)
    headers[acknowledge.header] = acknowledge.names.join(",");
  const href = entry.href + (dryRun ? "?dry_run=1" : "");
  return api(href, {method: entry.method || "POST", headers,
                    body: JSON.stringify(body ?? {})});
}

/* undo toast = inverse action present in the post-action document */
function maybeUndoToast(name, before, after) {
  const backTo = before.state;
  const inverse = Object.entries(after.actions || {})
    .find(([, a]) => a.effect?.to === backTo);
  const toast = $("#toast");
  toast.textContent = `${name} ✓`;
  if (inverse && backTo && after.state !== backTo) {
    const [invName, invEntry] = inverse;
    toast.append(el("button", {onclick: async () => {
      await invoke(invEntry, after, invEntry.input ? {} : null, {});
      toast.style.display = "none";
      render();
    }}, `undo (${label(invName, invEntry)})`));
  }
  toast.style.display = "block";
  setTimeout(() => toast.style.display = "none", 6000);
}

function problemBox(p) {
  const box = el("div", {class:"problem"},
    el("b", {}, p.title || "Error"), " — ",
    el("span", {class:"detail"}, p.detail || ""));
  if (p.errors) box.append(el("ul", {},
    ...Object.entries(p.errors).map(([f, msgs]) =>
      el("li", {}, `${f}: ${msgs.join("; ")}`))));
  if (p.resource) box.append(el("div", {style:"margin-top:4px"},
    el("a", {href:"#"+p.resource.self, onclick: () => setTimeout(render, 50)},
      "view current state")));
  return box;
}

/* ── events: the ledger + live re-render (§6) ───────────────────────── */
async function sse(href, onEvent) {
  // fetch-based SSE so principal headers ride along
  while (true) {
    try {
      const res = await fetch(href, {headers: principalHeaders()});
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        buf += decoder.decode(value, {stream: true});
        let idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
          const data = frame.split("\n").find(l => l.startsWith("data:"));
          if (data) onEvent(JSON.parse(data.slice(5)));
        }
      }
    } catch (e) { /* server restarting */ }
    await new Promise(r => setTimeout(r, 2000));
  }
}

/* ── follow a principal (supervision): their transitions steer this
   screen. The stream already names the actor on every event; following is
   a client-side filter plus navigation — no new affordances invented. ── */
let followId = localStorage.getItem("wm-follow-id") || null;
let followName = localStorage.getItem("wm-follow-name") || null;

function follow(actor) {
  followId = actor.id;
  followName = actor.display || actor.id;
  localStorage.setItem("wm-follow-id", followId);
  localStorage.setItem("wm-follow-name", followName);
  followChip();
  startPresenceFollow();
}
function unfollow() {
  followId = followName = null;
  localStorage.removeItem("wm-follow-id");
  localStorage.removeItem("wm-follow-name");
  followChip();
  stopPresenceFollow();
}

/* Presence: the followed principal's NAVIGATION, not just their commits.
   An ephemeral stream (never stored, never audited) — your screen goes
   where they merely look, and lands before they even act. */
let followAbort = null;
function stopPresenceFollow() {
  if (followAbort) { followAbort.abort(); followAbort = null; }
}
function startPresenceFollow() {
  stopPresenceFollow();
  if (!followId) return;
  followAbort = new AbortController();
  presenceLoop(followId, followAbort);
}
async function presenceLoop(id, ctl) {
  while (followId === id && !ctl.signal.aborted) {
    try {
      const res = await fetch(
        `${BASE}/-/presence?actor=${encodeURIComponent(id)}`,
        {headers: principalHeaders(), signal: ctl.signal});
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        buf += decoder.decode(value, {stream: true});
        let idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
          const data = frame.split("\n").find(l => l.startsWith("data:"));
          if (!data) continue;
          const ev = JSON.parse(data.slice(5));
          // form engagement (from wire facts: draft GET / dry-run /
          // discard) shows in the chip; plain views clear it
          if (followStatus)
            followStatus.textContent = !ev.action ? ""
              : ev.via === "discard" ? ` · discarded '${pretty(ev.action)}' draft`
              : ev.via === "dry_run" ? ` · filling '${pretty(ev.action)}'`
              : ` · in '${pretty(ev.action)}' form`;
          const here = location.hash.slice(1);
          if (ev.self && ev.self !== here && !$("#dlg").open)
            location.hash = "#" + ev.self;
        }
      }
    } catch (e) { if (ctl.signal.aborted) return; /* server restarting */ }
    await new Promise(r => setTimeout(r, 2000));
  }
}
let followStatus = null;
function followChip() {
  const chip = $("#followchip");
  chip.style.display = followId ? "inline-block" : "none";
  chip.textContent = "";
  followStatus = null;
  if (followId) {
    followStatus = el("span", {class:"muted"}, "");
    chip.append(`following ${followName}`, followStatus,
      el("button", {title: `copy a link — whoever opens it also follows ${followName}`,
                    onclick: () => copyFollowLink(followId, followName)}, "🔗"),
      el("button", {title: "stop following", onclick: unfollow}, "✕"));
  }
}

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 4000);
}

/* A follow link: opening it follows the named principal and lands on the
   sharer's current page (the hash rides along). It changes only the
   opener's own screen — it grants nothing. */
function followLink(id, name) {
  const q = new URLSearchParams({follow: id});
  if (name && name !== id) q.set("follow_name", name);
  return `${location.origin}${location.pathname}?${q}${location.hash}`;
}
async function copyFollowLink(id, name) {
  const url = followLink(id, name);
  try {  // clipboard needs a secure context; prompt() is the LAN fallback
    await navigator.clipboard.writeText(url);
    toast(`link copied — opening it follows ${name || id}`);
  } catch { prompt("copy this follow link:", url); }
}
$("#sharefollow").onclick = () => {
  const id = principalHeaders()["X-Principal-Id"];
  if (!id) { toast("pick a principal first"); return; }
  copyFollowLink(id, id);
};

// a shared follow link: ?follow=<id> starts following on open, then the
// query strips so reloads and copied URLs stay clean (the hash — the
// sharer's page — survives)
const bootParams = new URLSearchParams(location.search);
if (bootParams.get("follow")) {
  followId = bootParams.get("follow");
  followName = bootParams.get("follow_name") || followId;
  localStorage.setItem("wm-follow-id", followId);
  localStorage.setItem("wm-follow-name", followName);
  history.replaceState(null, "", location.pathname + location.hash);
}

followChip();
startPresenceFollow();  // resume a persisted (or link-started) follow

/* ── the ledger rows: time in mono, the actor marked by type, machine
   facts quiet, and the law loud — exactly once, when it changes ─────── */
const ACTOR_MARKS = {human: "●", agent: "◆", system: "○"};
function evTime(at) {
  return el("span", {class:"ev-time"},
    new Date(at).toLocaleTimeString([], {hour12: false}));
}
function actorChip(actor) {
  return el("span", {class:"actor-chip",
      title: `follow ${actor.display || actor.id}'s actions`,
      onclick: () => follow(actor)},
    el("span", {class:"actor-mark " + (actor.type || "human")},
      ACTOR_MARKS[actor.type] || "●"),
    " ", actor.display || actor.id);
}
function anchorMark(ev) {
  // defined_by: the law revision this write was validated under (§3)
  return ev.defined_by
    ? el("span", {class:"anchor",
        title: `defined by law revision ${ev.defined_by}`}, "⚖")
    : null;
}
function fmtScalar(v) {
  return v === null || v === undefined ? "—"
    : typeof v === "object" ? JSON.stringify(v) : String(v);
}
function ledgerRow(ev, isFollowed) {
  return el("div", {class: "ev" + (isFollowed ? " followed" : "")},
    el("div", {class:"ev-head"},
      evTime(ev.at), " ", actorChip(ev.actor), anchorMark(ev)),
    el("div", {class:"ev-body"},
      `${pretty(ev.action)} · `,
      el("a", {href:"#"+ev.self, title: `${ev.from ?? "·"} → ${ev.to}`},
        `${pretty(ev.kind)}: ${ev.from ? pretty(ev.from) : "·"} → ${pretty(ev.to)}`)));
}
function derivRow(ev) {
  // a derivation-class event: a declared fact flipped — quiet, mono
  return el("div", {class:"ev deriv"},
    evTime(ev.at), " ",
    el("a", {href:"#"+ev.self, title: `cause: ${ev.cause || "?"}`},
      `ƒ ${pretty(ev.fact)}: ${fmtScalar(ev.from)} → ${fmtScalar(ev.to)}`),
    anchorMark(ev));
}
function obsRow(ev) {
  // observation-class (only if subscribed): dimmest — someone looked
  return el("div", {class:"ev obs"},
    evTime(ev.at), " ", ev.event || "observation",
    ev.self ? el("a", {href:"#"+ev.self, style:"margin-left:4px"},
      pretty(ev.kind || "")) : null);
}
/* The law line — the signature: a full-width violet rule when the
   definition itself transitions. Degrades to the stored summary; enriched
   from the revision row (rev N, diff classes, reversion, backfill). */
function lawLineRow(ev) {
  const detail = el("span", {class:"law-detail"},
    ev.summary || ev.self.split("/").pop().slice(0, 8));
  const row = el("div", {class:"ev law-line"},
    el("div", {},
      el("span", {class:"law-stamp"},
        "⚖ ", ev.action === "settle" ? "backfill settled"
            : ev.action === "create" ? "law recorded" : "law revised"),
      " · ", el("a", {href:"#"+ev.self, class:"law-link"}, detail)),
    evTime(ev.at));
  api(ev.self.replace(`${BASE}/`, `${BASE}/-/lookup/`)).then(({res, body}) => {
    if (!res.ok || !body.data) return;
    const d = body.data;
    const bits = [`${pretty(d.target_kind || "")} · rev ${d.revision}`];
    const byClass = {};
    for (const key of ["added", "removed", "changed"])
      for (const e of d.diff?.[key] || [])
        (byClass[e.class] = byClass[e.class] || [])
          .push(e.path.split(".").slice(-2).join("."));
    for (const [cls, paths] of Object.entries(byClass)) {
      const uniq = [...new Set(paths)];
      bits.push(`${cls}: ${uniq.slice(0, 3).join(", ")}`
        + (uniq.length > 3 ? "…" : ""));
    }
    if (d.diff?.reverts_to != null)
      bits.push(`↩ reverts to rev ${d.diff.reverts_to}`);
    if (d.backfill_pending?.length)
      bits.push(`recomputing: ${d.backfill_pending.map(pretty).join(", ")}`);
    detail.textContent = bits.join(" · ");
  }).catch(() => {});
  return row;
}

/* ── the per-resource history panel (design §5) ─────────────────────────
   Every envelope carries an `events` link — an SSE stream that, connected
   with `Last-Event-ID: 0`, replays this resource's whole transition log.
   The stream stays open for live events after the replay, and there is no
   end-of-backlog sentinel, so a one-shot read can't know it is "done": we
   read frames until the burst goes quiet (an idle gap), then abort. The
   live edge is covered without a second subscription — the activity drawer
   re-runs render() on any transition to the resource in view, which
   rebuilds this panel. */
function fetchReplay(href, {idle = 500} = {}) {
  return new Promise(async (resolve) => {
    const ctl = new AbortController();
    const frames = [];
    let timer = null;
    const settle = () => { clearTimeout(timer); ctl.abort(); resolve(frames); };
    const bump = () => { clearTimeout(timer); timer = setTimeout(settle, idle); };
    bump();
    try {
      const res = await fetch(href, {signal: ctl.signal,
        headers: {...principalHeaders(), "Last-Event-ID": "0"}});
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        buf += decoder.decode(value, {stream: true});
        let idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
          const data = frame.split("\n").find(l => l.startsWith("data:"));
          if (data) { frames.push(JSON.parse(data.slice(5))); bump(); }
        }
      }
    } catch (e) { /* aborted on idle, or the server hiccupped */ }
    clearTimeout(timer); resolve(frames);   // idempotent: settle may have won
  });
}

/* A history row: the ledger's shape (time · actor · action · from → to)
   plus the two things the ledger withholds — the row's law stamp, compact,
   and the recorded inputs (§5) when the wire carried them (a scoped
   principal, or an action without record=Inputs(), simply has none). */
function lawStampChip(ev) {
  return ev.defined_by
    ? el("span", {class:"anchor law-chip",
        title: `defined by law revision ${ev.defined_by}`},
        "⚖ " + String(ev.defined_by).slice(0, 8))
    : null;
}
function inputsBlock(inputs) {
  if (inputs == null || typeof inputs !== "object" || Array.isArray(inputs))
    return null;
  const keys = Object.keys(inputs);
  if (!keys.length) return null;
  // a single prose field (a reject's notes, say) reads as text under the row
  if (keys.length === 1 && typeof inputs[keys[0]] === "string")
    return el("div", {class:"ev-inputs prose"}, inputs[keys[0]]);
  const t = el("table", {class:"kv"});
  for (const k of keys)
    t.append(el("tr", {}, el("td", {class:"k", title: k}, title(k)),
      el("td", {}, fmtScalar(inputs[k]))));
  return el("div", {class:"ev-inputs"}, t);
}
function historyRow(ev) {
  const row = el("div", {class:"ev"},
    el("div", {class:"ev-head"},
      evTime(ev.at), " ", actorChip(ev.actor), lawStampChip(ev)),
    el("div", {class:"ev-body"},
      `${pretty(ev.action)} · `,
      el("a", {href:"#"+ev.self, title: `${ev.from ?? "·"} → ${ev.to}`},
        `${ev.from ? pretty(ev.from) : "·"} → ${pretty(ev.to)}`)));
  const inp = inputsBlock(ev.inputs);
  if (inp) row.append(inp);
  return row;
}
/* Expansion persists across renders (a module var, like the drawer's open
   state) so a live re-render doesn't slam an opened panel shut. Loading is
   lazy: the replay fires when the panel is open — on expand, or on a
   re-render that lands it already open. */
let historyOpen = false;
function historySection(streamHref) {
  const count = el("span", {class:"muted mono", style:"font-size:11px"});
  const body = el("div", {class:"history-body"});
  const sec = el("details", historyOpen ? {class:"history", open:""}
                                        : {class:"history"},
    el("summary", {class:"muted"}, "History ", count), body);
  let loaded = false;
  const load = () => {
    if (loaded) return;
    loaded = true;
    body.append(el("span", {class:"muted"}, "…"));
    fetchReplay(streamHref).then(frames => {
      if (!document.contains(body)) return;   // superseded by a re-render
      const trans = frames.filter(f => (f.class || "transition") === "transition");
      trans.sort((a, b) => (b.version ?? 0) - (a.version ?? 0));  // newest first
      body.textContent = "";
      count.textContent = trans.length ? `(${trans.length})` : "";
      if (!trans.length)
        return body.append(el("span", {class:"kc-none"}, "no transitions yet"));
      for (const ev of trans) body.append(historyRow(ev));
    }).catch(() => {
      if (!document.contains(body)) return;
      body.textContent = "";
      body.append(el("div", {class:"muted"}, "couldn't load history"));
    });
  };
  sec.addEventListener("toggle", () => {
    historyOpen = sec.open;
    if (sec.open) load();
  });
  if (historyOpen) load();
  return sec;
}

/* ── the activity drawer: the ledger's one global home. The firehose
   subscription below never pauses — closed, arrivals count into the
   pip (violet the moment the law moves: the one thing you'd want to
   know landed while you weren't looking); opening clears it. Open
   state persists across navigation and reload; Escape closes only
   from inside the drawer, so modal dialogs keep their own Escape. ──── */
const ledgerEl = $("#ledger");
const ledgerToggle = $("#ledgertoggle");
const ledgerPip = $("#ledgerpip");
let ledgerUnread = 0, ledgerUnreadLaw = false;
function paintPip() {
  if (!ledgerUnread) { ledgerPip.style.display = "none"; return; }
  ledgerPip.textContent = ledgerUnread > 99 ? "99+" : String(ledgerUnread);
  ledgerPip.className = ledgerUnreadLaw ? "law" : "";
  ledgerPip.style.display = "inline-block";
}
const ledgerIsOpen = () => ledgerEl.classList.contains("open");
function setLedger(open, opts) {
  const moveFocus = !opts || opts.focus !== false;
  ledgerEl.classList.toggle("open", open);
  ledgerToggle.setAttribute("aria-expanded", String(open));
  localStorage.setItem("wm.ledger.open", open ? "1" : "0");
  if (open) {
    ledgerUnread = 0; ledgerUnreadLaw = false; paintPip();
    if (moveFocus) ledgerEl.focus();
  } else if (moveFocus) ledgerToggle.focus();
}
ledgerToggle.addEventListener("click", () => setLedger(!ledgerIsOpen()));
$("#ledgerclose").addEventListener("click", () => setLedger(false));
ledgerEl.addEventListener("keydown", ev => {
  if (ev.key === "Escape") { ev.stopPropagation(); setLedger(false); }
});
// restore before first paint: the script runs pre-render, so a drawer
// persisted open lands open with no entrance slide
if (localStorage.getItem("wm.ledger.open") === "1")
  setLedger(true, {focus: false});

const seen = new Set();  // dedupe — at-least-once delivery
sse(`${BASE}/-/events`, ev => {
  // every frame declares its class on the wire now; the fallback covers
  // older servers whose transition frames carried none
  const cls = ev.class || "transition";
  const key = cls === "transition"
    ? `t:${ev.self}#${ev.version}`       // (self, version) is the identity
    : `${cls}:${ev.self}#${ev.fact || ev.event}#${ev.at}`;
  if (seen.has(key)) return;
  seen.add(key);
  const feed = $("#feed");
  const isFollowed = cls === "transition" && followId
    && ev.actor && ev.actor.id === followId;
  let lawLine = false;
  if (cls === "derivation") feed.prepend(derivRow(ev));
  else if (cls === "observation") feed.prepend(obsRow(ev));
  else if (ev.kind === "definition"
           && ["revise", "create", "settle"].includes(ev.action)) {
    // the law moved: `revise` is the deploy's honest spelling (design
    // §2); `create` is revision 1's first recording (and older servers'
    // spelling for every revision); `settle` pays the backfill debt
    lawLine = true;
    feed.prepend(lawLineRow(ev));
    for (const k of Object.keys(lawRevCache)) delete lawRevCache[k];
  } else feed.prepend(ledgerRow(ev, isFollowed));
  if (!ledgerIsOpen()) {   // closed ≠ torn down: the drawer accumulates,
    ledgerUnread += 1;     // and the toggle admits how much arrived
    if (lawLine) ledgerUnreadLaw = true;
    paintPip();
  }
  const here = location.hash.slice(1).split("?")[0];
  // following: go where they went — unless a dialog is open (never yank a
  // human out of a form they're typing in; the feed still highlights)
  if (isFollowed && ev.self !== here && !$("#dlg").open) {
    location.hash = "#" + ev.self;
    return;  // hashchange triggers the render
  }
  // live update: if we're looking at this resource (or its collection), refetch
  if (here && (ev.self === here ||
               ev.self.startsWith(here + "/") ||
               here === ev.self.replace(/\/[^/]+$/, "")))
    render();
});

let watched = null;
function watchResource(doc) { watched = doc.self; }

$("#apphost").textContent = location.host;  // the honest app identity
renderNav();  // discovery → nav on every load, deep links included
render();
</script>
</body>
</html>
