<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waymark</title>
<!-- no favicon route on the engine: declare none, so the browser's
     automatic /favicon.ico probe doesn't 404 in every console -->
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  /* ── provenance is the aesthetic ─────────────────────────────────────
     Every color and face encodes where a piece of truth comes from:
     serif = server prose (the document speaking), mono = machine truth
     (facts, states, ids, law tokens), sans = this client's own chrome.
     Verdigris is the one action color; violet is reserved exclusively
     for definition/deploy vocabulary — the law is visibly not an app
     concern, and nothing else may borrow its color. */
  :root {
    --paper: #FAFAF8; --panel: #FFFFFF; --ink: #20261F; --muted: #6B7268;
    --line: #E4E5E0; --chip: #EFF1EC;
    --verdigris: #2E6E4E; --verdigris-deep: #245A3F; --verdigris-wash: #E7F0EA;
    --refusal: #93342B; --refusal-wash: #F7ECEA;
    --warn: #8A5A00; --warn-wash: #F6EFDF;
    --law: #5B4B9E; --law-wash: #EDEAF6;
    --radius: 4px;
    --shadow: 0 1px 2px rgba(32,38,31,.06);
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 14px/1.5 var(--sans); }
  a { color: var(--verdigris); text-decoration: none; }
  a:hover { text-decoration: underline; color: var(--verdigris-deep); }
  code, .mono { font-family: var(--mono); font-size: 12px; }
  code { background: var(--chip); padding: 1px 5px; border-radius: 3px; }
  .prose { font-family: var(--serif); }
  :focus-visible { outline: 2px solid var(--verdigris); outline-offset: 1px;
                   border-radius: 2px; }

  header { display: flex; align-items: center; gap: 14px; padding: 10px 20px;
           background: var(--panel); border-bottom: 1px solid var(--line);
           position: sticky; top: 0; z-index: 5; flex-wrap: wrap; row-gap: 4px; }
  header h1 { font-size: 15px; font-weight: 800; letter-spacing: .04em;
              margin: 0; }
  header h1 a { color: var(--ink); }
  header nav { display: inline-flex; align-items: center; flex-wrap: wrap; }
  header nav a { margin-right: 12px; font-size: 13px; }
  header .spacer { flex: 1; }
  /* engine kinds tuck behind a quiet ⋯ at the far right of the nav —
     domain kinds are the workspace; the machinery waits its turn */
  .nav-more-wrap { position: relative; }
  .nav-more { border: none; background: none; color: var(--muted);
              font-size: 15px; line-height: 1; padding: 2px 7px;
              border-radius: 3px; }
  .nav-more:hover { color: var(--ink); background: var(--chip);
                    border: none; }
  .nav-menu { position: absolute; top: calc(100% + 4px); left: 0;
              z-index: 30; background: var(--panel);
              border: 1px solid var(--line); border-radius: var(--radius);
              box-shadow: var(--shadow); padding: 6px 0; min-width: 170px;
              display: none; }
  .nav-menu a { display: block; padding: 5px 14px; margin: 0;
                font-size: 13px; color: var(--ink); white-space: nowrap; }
  .nav-menu a:hover { background: var(--chip); text-decoration: none; }
  .nav-menu .law-mark { color: var(--law); }
  /* the machinery's divider: secondary domain kinds lead the overflow,
     the engine kinds sit below this quiet rule — shown only when both
     share the menu, so a pure-engine overflow reads as it always did */
  .nav-menu-label { padding: 6px 14px 3px; margin-top: 4px;
                    border-top: 1px solid var(--line);
                    font: 600 9.5px var(--sans); letter-spacing: .06em;
                    text-transform: uppercase; color: var(--muted); }
  /* the law stamp: which revision of the law produced this screen */
  #lawstamp a { font-family: var(--mono); font-size: 11px; color: var(--law);
                background: var(--law-wash); border: 1px solid var(--law-wash);
                border-radius: 3px; padding: 2px 8px; white-space: nowrap; }
  #lawstamp a:hover { border-color: var(--law); text-decoration: none; }

  select, input, textarea, button {
    font: 13.5px/1.4 var(--sans); color: inherit; border: 1px solid var(--line);
    border-radius: var(--radius); padding: 6px 9px; background: var(--panel); }
  textarea.mono { font-family: var(--mono); font-size: 12px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--verdigris); color: #fff;
                   border-color: var(--verdigris); }
  button.primary:hover, button.primary:active {
    background: var(--verdigris-deep); border-color: var(--verdigris-deep); }
  button.danger  { background: var(--panel); color: var(--refusal);
                   border-color: var(--refusal); }
  button.danger:hover { background: var(--refusal); color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  /* effort as a subtle chip riding the button, not a text suffix */
  .effort-chip { font: 600 9.5px var(--sans); border-radius: 3px;
                 padding: 1px 5px; margin-left: 6px; vertical-align: 1px;
                 background: var(--chip); color: var(--muted); }
  button.primary .effort-chip, button.danger:hover .effort-chip {
    background: rgba(255,255,255,.25); color: #fff; }

  main { max-width: 1200px; margin: 18px auto; padding: 0 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line);
           border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px;
           overflow-x: auto; box-shadow: var(--shadow); }
  .crumbs { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
  .crumbs .id { font-family: var(--mono); font-size: 11.5px; }
  h2 { margin: 4px 0 2px; font-size: 19px; font-weight: 800;
       letter-spacing: -.01em; }
  /* the summary is the server's own sentence — it IS the orientation */
  .summary { font-family: var(--serif); font-size: 17.5px; line-height: 1.4;
             color: var(--ink); margin: 6px 0 14px; }
  .muted { color: var(--muted); }

  /* machine truth wears the mono: states, ids, versions, counts */
  .chip { display: inline-block; font-family: var(--mono); font-size: 11px;
          background: var(--chip); color: var(--ink);
          border-radius: 3px; padding: 2px 8px; }
  .chip.warning { background: var(--warn-wash); color: var(--warn); }
  .chip.ok      { background: var(--verdigris-wash); color: var(--verdigris-deep); }
  .chip.danger  { background: var(--refusal-wash); color: var(--refusal); }
  .version { font-family: var(--mono); font-size: 11px; color: var(--muted);
             margin-left: 8px; }

  /* field provenance: derived wears the ƒ and a dotted underline;
     authored is italic mono with the authority named in a chip;
     written stays plain — the default needs no costume */
  .v-derived { font-family: var(--mono); font-size: 12.5px;
               border-bottom: 1px dotted var(--muted); cursor: help; }
  .fmark { color: var(--verdigris); font-style: italic; user-select: none; }
  .v-authored { font-family: var(--mono); font-style: italic;
                font-size: 12.5px; cursor: help; }
  .src-chip { font: 600 9.5px var(--sans); color: var(--muted);
              background: var(--chip); border-radius: 3px; padding: 1px 5px;
              margin-left: 5px; vertical-align: 1px; }
  .v-recomputing { color: var(--muted); font-family: var(--mono);
                   font-size: 12.5px; }
  .spin-dot { display: inline-block; width: 7px; height: 7px;
              border-radius: 50%; background: var(--verdigris);
              margin-right: 6px; vertical-align: 1px;
              animation: pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .2; } }
  .recompute-banner { border: 1px solid var(--line);
              border-left: 3px solid var(--verdigris);
              border-radius: var(--radius); padding: 8px 12px;
              margin: 0 0 12px; font-size: 13px; color: var(--muted); }

  table.kv { border-collapse: collapse; width: 100%; }
  table.kv td { padding: 6px 10px 6px 0; vertical-align: top;
                border-bottom: 1px solid var(--line); }
  table.kv td.k { color: var(--muted); width: 32%; font-size: 13px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }

  /* the can't-yet section: the reason is server prose, so it's serif;
     a clock-gated hope gets a live countdown */
  .cantyet .item { padding: 7px 0; font-size: 13px;
                   border-bottom: 1px solid var(--line); }
  .cantyet .item:last-child { border-bottom: none; }
  .cantyet .item b { font-weight: 700; }
  .cantyet .why { font-family: var(--serif); font-size: 14px;
                  color: var(--ink); margin: 2px 0; }
  .cantyet .hope { font-size: 12px; }
  .countdown { font-family: var(--mono); font-size: 12px;
               color: var(--verdigris-deep); }

  .unavail { margin-top: 10px; }
  .unavail .item { color: var(--muted); font-size: 13px; padding: 3px 0; }
  .unavail .item b { color: var(--ink); font-weight: 600; }

  /* remedies: the wire names the way out as "kind.action" chips — a walk
     to the button when the action is on this page, a link to the kind's
     collection for a create, plain mono text when neither resolves
     (never a dead link) */
  .remedies { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
  a.chip.remedy, button.chip.remedy {
    background: var(--verdigris-wash); color: var(--verdigris-deep);
    border: 1px solid var(--verdigris-wash); }
  a.chip.remedy:hover, button.chip.remedy:hover {
    border-color: var(--verdigris); text-decoration: none; }
  /* an action the wire's own remedies point at: it keeps its style and
     gains a quiet ring plus the "suggested" marker — emphasis only,
     nothing is demoted */
  button.suggested { border-color: var(--verdigris);
                     box-shadow: 0 0 0 2px var(--verdigris-wash); }
  .suggest-chip { font: 600 9.5px var(--sans); border-radius: 3px;
                  padding: 1px 5px; margin-left: 6px; vertical-align: 1px;
                  background: var(--verdigris-wash);
                  color: var(--verdigris-deep); }
  button.primary .suggest-chip { background: rgba(255,255,255,.25);
                                 color: #fff; }
  /* the remedy chip's walk: one short pulse where the eye should land —
     reduced motion stills the pulse, the outline still marks the spot */
  @keyframes remedy-pulse {
    50% { box-shadow: 0 0 0 6px var(--verdigris-wash); } }
  button.pulse { outline: 2px solid var(--verdigris); outline-offset: 1px;
                 animation: remedy-pulse .7s ease-in-out 2; }
  /* a link badge: a count the wire sent riding the link — 0 still
     renders (0 is information) */
  .badge { font-family: var(--mono); font-size: 10px; color: var(--muted);
           background: var(--chip); border-radius: 999px; padding: 1px 6px;
           margin-left: 6px; vertical-align: 1px; }
  /* embedded collections (links with embed:true): the rows live on the
     detail page itself; the full collection stays one ↗ away */
  .embed { border-top: 1px solid var(--line); margin-top: 14px;
           padding-top: 10px; }
  .embed-head { display: flex; align-items: baseline; gap: 8px;
                flex-wrap: wrap; margin-bottom: 6px; }
  .embed-head b { font-size: 13px; }
  .embed-head .open { font-size: 12px; margin-left: auto;
                      white-space: nowrap; }
  .rows .row { display: flex; align-items: center; gap: 10px; padding: 9px 4px;
               border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .rows .row .grow { flex: 1; min-width: 0; }

  table.items { border-collapse: collapse; width: 100%; }
  table.items th { text-align: left; font-size: 11px; color: var(--muted);
                   font-weight: 600; padding: 6px 10px 6px 0;
                   border-bottom: 2px solid var(--line); white-space: nowrap; }
  table.items td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line);
                   vertical-align: middle; }
  table.items td.rowactions { display: flex; gap: 6px; justify-content: flex-end;
                              border-bottom: none; flex-wrap: wrap; }
  table.items tr:hover td { background: var(--paper); }

  .filterbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: end;
               margin-bottom: 12px; }
  .filterbar label, .filterbar .flabel { display: flex; flex-direction: column;
                     font-size: 11px; color: var(--muted); gap: 3px; }
  .filterbar details.multi { position: relative; }
  .filterbar details.multi summary { font: 13.5px/1.4 var(--sans);
                     color: var(--ink); border: 1px solid var(--line);
                     border-radius: var(--radius); padding: 6px 9px;
                     background: var(--panel); cursor: pointer; list-style: none;
                     min-width: 80px; white-space: nowrap; }
  .filterbar details.multi summary::after { content: " ▾"; color: var(--muted); }
  .filterbar details.multi .options { position: absolute; z-index: 20;
                     margin-top: 2px; background: var(--panel);
                     border: 1px solid var(--line); border-radius: var(--radius);
                     padding: 8px 10px; display: flex; flex-direction: column;
                     gap: 5px; box-shadow: 0 1px 2px rgba(32,38,31,.06);
                     max-height: 40vh; overflow-y: auto; }
  .filterbar details.multi .options label { flex-direction: row;
                     align-items: center; gap: 6px; font-size: 13px;
                     color: var(--ink); white-space: nowrap; }
  .facet-count { font-family: var(--mono); font-size: 10.5px;
                 color: var(--muted); }

  /* ── the home dashboard: one flat card per domain kind — the count in
     mono, state facets as filtered links, the create affordance small
     and verdigris. A skeleton is just the empty bordered card. ─────── */
  .dash-grid { display: grid; gap: 12px; margin-bottom: 16px;
               grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .kind-card { background: var(--panel); border: 1px solid var(--line);
               border-radius: var(--radius); padding: 14px 16px;
               min-height: 108px; display: flex; flex-direction: column;
               gap: 8px; }
  .kind-card .kc-head { display: flex; align-items: baseline; gap: 8px;
                        justify-content: space-between; flex-wrap: wrap; }
  .kind-card h3 { margin: 0; font-size: 14px; font-weight: 800;
                  letter-spacing: -.01em; }
  .kind-card h3 a { color: var(--ink); }
  .kc-total { font-family: var(--mono); font-size: 27px; line-height: 1.1; }
  .kc-none { font-family: var(--serif); color: var(--muted);
             font-size: 14.5px; }
  .kc-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .kc-chips a.chip:hover { background: var(--verdigris-wash);
                           color: var(--verdigris-deep);
                           text-decoration: none; }
  .kc-recomputing { color: var(--muted); font-size: 11px;
                    white-space: nowrap; }
  .kc-foot { margin-top: auto; }
  /* the needs-attention strip: rendered only when something is nonzero —
     an empty dashboard never announces "0 problems" */
  .attention { background: var(--panel); border: 1px solid var(--line);
               border-left: 3px solid var(--warn);
               border-radius: var(--radius); padding: 8px 14px;
               margin-bottom: 14px; }
  .attention .item { font-family: var(--serif); font-size: 14.5px;
                     padding: 3px 0; }
  .attention .item .mono { font-size: 13px; font-weight: 500; }
  /* the app's honest identity: the host it is served from */
  #apphost { font-family: var(--mono); font-size: 11px; }
  @media (max-width: 600px) { #apphost { display: none; } }

  /* ── the ledger: time in mono, actors marked by type, derivation rows
     quiet, and the law line — the one loud violet rule — when the
     definition itself transitions. It lives in ONE place: the activity
     drawer — a fixed right-hand sheet on wide screens, a bottom sheet
     on narrow ones. ─────────────────────────────────────────────────── */
  #ledger { position: fixed; top: 0; right: 0; bottom: 0; width: 380px;
            max-width: 92vw; z-index: 15; background: var(--paper);
            border-left: 1px solid var(--line); box-shadow: var(--shadow);
            display: flex; flex-direction: column; padding: 12px 16px;
            transform: translateX(100%); visibility: hidden;
            transition: transform .18s ease-out, visibility 0s linear .18s; }
  #ledger.open { transform: none; visibility: visible;
                 transition: transform .18s ease-out; }
  #ledger:focus { outline: none; }   /* programmatic focus target */
  .ledger-head { display: flex; align-items: baseline; gap: 8px;
                 border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .ledger-scope { font-family: var(--mono); font-size: 10.5px;
                  color: var(--muted); }
  .ledger-close { border: none; background: none; color: var(--muted);
                  font-size: 14px; line-height: 1; padding: 3px 7px;
                  margin-left: auto; border-radius: 3px; }
  .ledger-close:hover { color: var(--ink); background: var(--chip);
                        border: none; }
  @media (max-width: 700px) {
    /* narrow screens: the drawer becomes a bottom sheet */
    #ledger { top: auto; left: 0; width: auto; max-width: none;
              height: 60vh; border-left: none;
              border-top: 1px solid var(--line);
              transform: translateY(100%); }
  }
  /* the unread pip on the toggle: mono count, verdigris — turned violet
     the moment a law line lands while the drawer is closed */
  #ledgerpip { display: none; font-family: var(--mono); font-size: 10px;
               font-weight: 500; background: var(--verdigris); color: #fff;
               border-radius: 999px; padding: 1px 6px; margin-left: 6px;
               vertical-align: 1px; }
  #ledgerpip.law { background: var(--law); }
  .feed { flex: 1; min-height: 0; margin-top: 6px; overflow-y: auto;
          overscroll-behavior: contain; }
  .feed .ev { padding: 7px 0; border-bottom: 1px solid var(--line);
              font-size: 13px; }
  .ev-time { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .actor-chip { font-weight: 600; cursor: pointer; font-size: 12.5px; }
  .actor-chip:hover { text-decoration: underline; }
  .actor-mark { font-size: 10px; }
  .actor-mark.human { color: var(--ink); }
  .actor-mark.agent { color: var(--verdigris); }
  .actor-mark.system { color: var(--muted); }
  .anchor { color: var(--law); font-size: 10px; cursor: help; margin-left: 5px; }
  .ev-body { margin-top: 1px; }
  .feed .ev.deriv { color: var(--muted); font-family: var(--mono);
                    font-size: 11.5px; }
  .feed .ev.deriv a { color: var(--muted); }
  .feed .ev.obs { color: var(--muted); opacity: .55; font-size: 12px; }
  .feed .ev.followed { background: var(--verdigris-wash);
                       border-left: 3px solid var(--verdigris);
                       padding-left: 6px; }
  .feed .ev.law-line { border-top: 2px solid var(--law);
                       border-bottom: 1px solid var(--line);
                       padding: 8px 0; animation: law-in .24s ease-out; }
  @keyframes law-in { from { opacity: 0; transform: translateY(-3px); } }
  .law-stamp { color: var(--law); font-weight: 700; font-size: 12.5px;
               white-space: nowrap; }
  .law-detail, .law-link { font-family: var(--mono); font-size: 11px;
               color: var(--law); }
  .law-link:hover { color: var(--law); }

  /* ── the per-resource history panel: this row's transition log,
     replayed from its -/events stream. Rows read like the ledger's, but
     also carry the row's law stamp and the recorded inputs (§5) the
     ledger deliberately withholds. ──────────────────────────────────── */
  .history { border-top: 1px solid var(--line); margin-top: 14px;
             padding-top: 8px; }
  .history > summary { cursor: pointer; font-size: 13px; }
  .history .ev { padding: 7px 0; border-bottom: 1px solid var(--line);
                 font-size: 13px; }
  .history .ev:last-child { border-bottom: none; }
  .law-chip { font-family: var(--mono); font-size: 10px; }
  .ev-inputs { margin: 4px 0 2px; padding: 6px 9px; background: var(--chip);
               border-radius: var(--radius); font-size: 12.5px; }
  .ev-inputs.prose { font-family: var(--serif); font-size: 13.5px;
                     line-height: 1.4; color: var(--ink); }
  .ev-inputs .kv td { padding: 1px 8px 1px 0; }

  /* ── the deploy history: the definitions collection as a screen ───── */
  .rev-row { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .rev-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .rev-token { font-family: var(--mono); font-size: 12.5px; font-weight: 500;
               color: var(--law); white-space: nowrap; }
  .rev-summary { font-size: 14px; margin: 4px 0; }
  .rev-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
              margin-top: 4px; }
  .diff-chip { font: 600 10px var(--sans); border-radius: 3px;
               padding: 1px 6px; background: var(--law-wash);
               color: var(--law); cursor: help; }
  .diff-chip.truth { background: var(--law); color: #fff; }
  .rev-revert { font-family: var(--mono); font-size: 11px; color: var(--law);
                font-weight: 500; }
  .rev-recomputing { font-size: 12px; color: var(--muted); }
  .hash { font-size: 10.5px; color: var(--muted); cursor: help; }

  /* ── declared decision surfaces (design 6.0 §4): the named views.
     They wear the law's violet because a surface IS a definition —
     fingerprinted, revised, in the deploy history like any law. ─────── */
  .surface-row { display: flex; flex-wrap: wrap; gap: 6px;
                 margin: 2px 0 12px; }
  a.surface-link { font-family: var(--mono); font-size: 11px;
                   color: var(--law); background: var(--law-wash);
                   border: 1px solid var(--law-wash); border-radius: 3px;
                   padding: 2px 8px; white-space: nowrap; }
  a.surface-link:hover { border-color: var(--law); text-decoration: none; }
  .surface-mark { color: var(--law); font-family: var(--mono);
                  font-size: 12px; }
  /* ordinary rels ride the same band as scent: rel + the wire's badge,
     up front where they inform the read instead of trailing it */
  a.link-chip { font-family: var(--mono); font-size: 11px;
                color: var(--ink); background: var(--chip);
                border: 1px solid var(--line); border-radius: 3px;
                padding: 2px 8px; white-space: nowrap; }
  a.link-chip:hover { border-color: var(--muted); text-decoration: none; }
  /* a guard-refused action keeps its seat in the bar, dimmed; its
     honest reason renders just below, at the point of intent */
  button.blocked { opacity: .55; cursor: not-allowed; }
  .blockedwhy { margin: 2px 0 4px; }
  .blockedwhy .item { font-size: 13px; padding: 3px 0; }
  .blockedwhy .item b { font-weight: 700; }
  .blockedwhy .why { font-family: var(--serif); font-size: 14px;
                     color: var(--ink); }

  #followchip { background: var(--verdigris-wash); color: var(--verdigris-deep);
                border-radius: 999px; padding: 3px 12px; font-size: 12px;
                font-weight: 600; display: none; white-space: nowrap; }
  #followchip button { border: none; background: none;
                       color: var(--verdigris-deep); padding: 0 0 0 6px;
                       font-weight: 700; }
  #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
           background: var(--ink); color: #fff; padding: 10px 18px;
           border-radius: var(--radius); display: none; z-index: 20;
           box-shadow: 0 1px 2px rgba(32,38,31,.06); max-width: 94vw;
           animation: toast-in .18s ease-out; }
  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } }
  #toast button { background: none; border: none; color: #9fd0b5;
                  margin-left: 10px; font-weight: 600; }

  /* refusals and problems speak in the server's voice: serif */
  .problem { background: var(--refusal-wash); border: 1px solid var(--line);
             border-left: 3px solid var(--refusal); color: var(--ink);
             border-radius: var(--radius); padding: 10px 14px;
             margin-bottom: 12px; }
  .problem b { color: var(--refusal); }
  .problem .detail { font-family: var(--serif); font-size: 14.5px; }
  .problem ul { margin: 6px 0 0; padding-left: 18px;
                font-family: var(--serif); font-size: 13.5px; }

  dialog { border: 1px solid var(--line); border-radius: var(--radius);
           padding: 0; width: min(460px, 94vw); max-height: 92dvh;
           overflow-y: auto; box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(32,38,31,.28); }
  dialog .body { padding: 18px; }
  dialog h3 { margin: 0 0 4px; font-weight: 800; }
  dialog .effect { color: var(--muted); font-size: 12.5px; margin-bottom: 12px; }
  dialog .effect .mono { font-size: 11.5px; }
  dialog form label { display: block; margin: 10px 0 3px; font-size: 12px;
                      color: var(--muted); }
  dialog form input, dialog form textarea, dialog form select { width: 100%; }
  dialog .field-error { color: var(--refusal); font-family: var(--serif);
                        font-size: 12.5px; margin-top: 2px; }
  dialog .buttons { display: flex; gap: 8px; justify-content: flex-end;
                    margin-top: 16px; }
  /* the attachment upload dialog (design E5): the target stated not asked,
     a file well, and the file's own facts echoed back before the send */
  .upload-target { font-size: 13px; margin: 2px 0 12px; }
  dialog input[type="file"] { padding: 10px; background: var(--paper);
                    border: 1px dashed var(--line); }
  .upload-preview { font-family: var(--mono); font-size: 12px;
                    margin: 6px 0 2px; color: var(--muted); }
  .upload-preview.chosen { color: var(--ink); }
  dialog .dryrun { font-size: 12px; margin-top: 10px; }
  dialog .dryrun.ok { color: var(--verdigris-deep); }
  dialog .dryrun.bad { color: var(--refusal); font-family: var(--serif);
                       font-size: 13px; }
  /* consequences — what an act will do — are read, not skimmed: serif */
  .consequence { font-family: var(--serif); font-size: 14.5px;
                 line-height: 1.45; margin: 6px 0; }
  .blast { border: 1px solid var(--line); border-radius: var(--radius);
           padding: 8px 12px; margin: 0 0 12px; }
  .blast b { font-size: 12px; }
  .warnbox { border: 1px solid var(--line); border-left: 3px solid var(--warn);
             border-radius: var(--radius); padding: 6px 12px; margin: 0 0 12px; }
  .warnbox .consequence { color: var(--warn); margin: 4px 0; }
  .when-note { font-family: var(--serif); font-size: 13px; color: var(--warn);
               margin: 4px 0 0; }
  .req { color: var(--refusal); }

  /* the searchable combobox a truncated Ref <select> swaps into */
  .combo { position: relative; }
  .combo-panel { position: absolute; top: calc(100% + 2px); left: 0; right: 0;
                 z-index: 20; background: var(--panel); border: 1px solid var(--line);
                 border-radius: var(--radius); box-shadow: var(--shadow);
                 max-height: 220px; overflow-y: auto; display: none; }
  .combo-option { padding: 6px 9px; font-size: 13.5px; cursor: pointer; }
  .combo-option:hover { background: var(--chip); }
  .combo-empty { padding: 6px 9px; font-size: 11.5px; color: var(--muted); }

  /* batch verdicts: index and outcome are machine truth, reasons are prose */
  .batchbox { margin-top: 14px; border-top: 1px solid var(--line);
              padding-top: 10px; }
  .batchbox summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
  .batchbox textarea { width: 100%; margin-top: 8px; }
  .verdict-totals { font-size: 11.5px; margin: 8px 0 4px; color: var(--muted); }
  table.verdicts { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  table.verdicts th { text-align: left; font-size: 10.5px; color: var(--muted);
                      padding: 4px 8px 4px 0;
                      border-bottom: 1px solid var(--line); }
  table.verdicts td { padding: 4px 8px 4px 0;
                      border-bottom: 1px solid var(--line);
                      vertical-align: top; }
  table.verdicts td.reason { font-family: var(--serif); font-size: 13px; }
  .verdict-ok { color: var(--verdigris-deep); font-weight: 600; }
  .verdict-refused { color: var(--refusal); font-weight: 600; }
  .verdict-failed { color: var(--refusal); font-weight: 700; }

  .pager { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
  .pager .muted { font-family: var(--mono); font-size: 11px; }

  /* ── motion budget: law-line entrance, toast slide, and the drawer's
     ~180ms slide only; everything else is still. Reduced motion stills
     all three (countdowns are text updates and keep ticking). ───────── */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .spin-dot { opacity: .5; }
  }

  /* ── small screens: one column, bigger targets, no zoom-on-focus ── */
  @media (max-width: 900px) {
    main { margin: 12px auto; padding: 0 10px; }
  }
  @media (max-width: 600px) {
    header { padding: 8px 10px; gap: 10px; }
    .panel { padding: 12px; }
    h2 { font-size: 17px; }
    .summary { font-size: 16px; }
    table.kv td.k { width: 40%; }
    /* iOS zooms into any control under 16px; match it and enlarge taps */
    select, input, textarea, button { font-size: 16px; padding: 8px 12px; }
    header #principal { font-size: 13px; padding: 4px 8px; }
    dialog { width: 94vw; }
    dialog .buttons { position: sticky; bottom: 0; background: var(--panel);
                      padding: 10px 0 2px; }
    .actions button { flex: 1 1 auto; }
    .rev-head { gap: 6px; }
  }
  /* touch devices at any width: comfortable targets */
  @media (pointer: coarse) {
    button { padding: 9px 14px; }
    .rows .row { padding: 12px 4px; }
  }
</style>
</head>
<body>
<header>
  <h1><a href="#">Waymark</a></h1>
  <span id="apphost" class="muted"></span>
  <nav id="kinds"></nav>
  <span id="lawstamp"></span>
  <span id="followchip"></span>
  <div class="spacer"></div>
  <label class="muted" style="font-size:12px">acting as&nbsp;
    <select id="principal">
      <option value="">anonymous</option>
      <option value="dana|human|" selected>dana (human)</option>
      <option value="manager|human|manager">manager (human)</option>
      <option value="agent-1|agent|">agent-1 (agent)</option>
    </select>
  </label>
  <button id="sharefollow" style="font-size:12px;padding:4px 10px"
          title="copy a link — whoever opens it starts following you, landing on your current page">
    🔗 follow me</button>
  <button id="ledgertoggle" style="font-size:12px;padding:4px 10px"
          aria-expanded="false" aria-controls="ledger"
          title="the live ledger — every transition as it lands">
    ◷ Activity<span id="ledgerpip"></span></button>
</header>
<main>
  <section id="view"></section>
</main>
<aside id="ledger" role="complementary" aria-label="Activity" tabindex="-1">
  <div class="ledger-head">
    <b>Activity</b>
    <span class="ledger-scope" id="ledgerscope"
          title="what this feed is showing — the whole workspace's stream, every kind">everything</span>
    <button class="ledger-close" id="ledgerclose" type="button"
            aria-label="close activity">✕</button>
  </div>
  <div class="feed" id="feed"></div>
</aside>
<div id="toast"></div>
<dialog id="dlg"></dialog>
<dialog id="confirmdlg"></dialog>

<script>
/* The generic human client (spec Part IV, informative):
   route = self · screen = envelope · buttons = actions · disabled-with-tooltip
   = unavailable · forms = input schema · filter bar = the collection query
   schema · live updates + activity feed = the events stream.
   It consumes only the envelope — it invents no affordances.

   v5 additions, still envelope-driven: field provenance from the data
   schema's x-source; meta.law as the header stamp; the definitions
   collection as the deploy history; law lines in the ledger when the
   definition kind itself transitions; live countdowns from
   becomes_available.at; the compound blast radius from effect; the batch
   form from the entry's batch advertisement; meta.recomputing honesty;
   conditional arms from the input schema's if/then. */
// Served at {base}/-/ui the page derives its API base from its own URL;
// served at the site root (engine.landing()) the server injects it.
const BASE = window.WAYMARK_BASE ??
  document.location.pathname.replace(/\/-\/ui$/, "");
const $ = (s, el=document) => el.querySelector(s);
// crypto.randomUUID needs a secure context (https or localhost); over plain
// HTTP on a LAN IP it's undefined, which would silently break every
// non-idempotent action. getRandomValues works everywhere; Math.random is
// the last resort (idempotency keys need uniqueness, not cryptographic
// strength).
const uuid = () => {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = new Uint8Array(16);
  (crypto.getRandomValues ? crypto.getRandomValues(b)
    : b.forEach((_, i) => b[i] = Math.floor(Math.random() * 256)));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map(x => x.toString(16).padStart(2, "0"));
  return `${h.slice(0,4).join("")}-${h.slice(4,6).join("")}-${h.slice(6,8).join("")}`
       + `-${h.slice(8,10).join("")}-${h.slice(10,16).join("")}`;
};
const pretty = s => String(s).replace(/_/g, " ");
const title = s => { const t = pretty(s); return t.charAt(0).toUpperCase() + t.slice(1); };
const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === "onclick") n.addEventListener("click", v);
    else if (k === "html") n.innerHTML = v;
    else if (v !== undefined && v !== null) n.setAttribute(k, v);
  }
  for (const kid of kids) if (kid != null)
    n.append(kid.nodeType ? kid : document.createTextNode(kid));
  return n;
};

function principalHeaders() {
  const v = $("#principal").value;
  if (!v) return {};
  const [id, type, roles] = v.split("|");
  const h = {"X-Principal-Id": id, "X-Principal-Type": type,
             "X-Principal-Display": id};
  if (roles) h["X-Principal-Roles"] = roles;
  return h;
}

async function api(href, opts={}) {
  const res = await fetch(href, {...opts,
    headers: {...principalHeaders(), ...(opts.headers||{})}});
  const body = res.status === 204 ? null : await res.json();
  return {res, body};
}

/* live countdown timers die with the screen that owns them */
const liveTimers = [];
function clearLiveTimers() {
  while (liveTimers.length) clearInterval(liveTimers.pop());
}

/* ── routing: the URL hash IS the resource href ─────────────────────── */
function go(href) { location.hash = href; }
window.addEventListener("hashchange", render);
$("#principal").addEventListener("change", render);

let renderSeq = 0;
async function render() {
  const seq = ++renderSeq;               // fetch first, swap after — a
  const href = location.hash.slice(1) || null;  // superseded render never
  const view = $("#view");                       // blanks the screen
  if (!href) { lawStamp(null); return renderHome(view, seq); }
  const {res, body} = await api(href);
  if (res.status < 400 && body.kind) {
    // hints come from the item kind's data schema, cached per kind — a
    // surface envelope's data is its ANCHOR's, so its hints are too
    const hintKind = body.kind.startsWith("surface:")
      ? body.links?.anchor?.kind : body.kind.replace(/_collection$/, "");
    var hints = hintKind ? await dataHints(hintKind) : {};
  }
  if (seq !== renderSeq) return;
  clearLiveTimers();
  view.textContent = "";
  lawStamp(res.status < 400 ? body : null);
  if (res.status >= 400) return view.append(problemBox(body));
  if (body.kind === "definition_collection") renderDeployHistory(view, body);
  else if (body.kind && body.kind.startsWith("surface:")) renderSurface(view, body, hints);
  else if (body.kind && body.kind.endsWith("_collection")) renderCollection(view, body, hints);
  else renderResource(view, body, hints);
}

/* ── the law stamp: the envelope's own meta.law_revision, read straight
   off the wire (design §3 — the server stamps "rev N" beside the id).
   The resolution fetch below survives only as the fallback for older
   servers whose meta carries the id alone. ──────────────────────────── */
const lawRevCache = {};   // definition row id → revision number
function lawStamp(doc) {
  const box = $("#lawstamp");
  box.textContent = "";
  const law = doc?.meta?.law;
  if (!law || !doc.kind) return;
  const kind = doc.kind.replace(/_collection$/, "");
  const rev = doc.meta.law_revision ?? lawRevCache[law];
  const a = el("a", {href: `#${BASE}/definitions?target_kind=${kind}`,
      title: `the law in force for ${pretty(kind)} — revision ${law}. `
           + `Click for the deploy history.`},
    "⚖ " + (rev !== undefined ? `rev ${rev}` : law.slice(0, 8)));
  box.append(a);
  if (rev === undefined)
    resolveLawRev(law, kind).then(r => {
      if (r != null && document.contains(a)) a.textContent = `⚖ rev ${r}`;
    });
}
async function resolveLawRev(law, kind) {
  try {
    const w = await wellKnown();
    const col = w.collections?.definition;
    if (!col) return null;
    // a plumbing read, so it rides the lookup route class
    const {res, body} = await api(
      `${lookupHref(col)}?target_kind=${encodeURIComponent(kind)}`);
    if (!res.ok) return null;
    for (const item of body.data.items || []) {
      const id = item.self.split("/").pop();
      const rev = item.data?.revision
        ?? (item.summary?.match(/revision (\d+)/) || [])[1];
      if (rev !== undefined) lawRevCache[id] = Number(rev);
    }
    return lawRevCache[law] ?? null;
  } catch { return null; }
}

/* ── the nav: built from discovery on EVERY load, whatever the route — a
   deep link hard-refreshed must not arrive without its navigation. Primary
   domain kinds sit inline; secondary domain kinds (discovery's
   secondary_kinds) and engine kinds (engine_kinds) tuck behind a quiet ⋯
   menu at the far right. The law judges prominence and ownership; this
   client renders those tiers and invents no relevance of its own — a
   server without either field gives every kind the inline seat it had.
   Independent of the document render: they own disjoint DOM, so neither
   async path can clobber the other in either order. ─────────────────── */
async function renderNav() {
  let w;
  try { w = await wellKnown(); } catch { return; }
  const nav = $("#kinds"); nav.textContent = "";
  const engine = new Set(w.engine_kinds || []);
  const secondary = new Set(w.secondary_kinds || []);
  const entries = Object.entries(w.collections || {});
  for (const [kind, href] of entries)
    if (!engine.has(kind) && !secondary.has(kind))
      nav.append(el("a", {href: "#"+href}, title(kind)+"s"));
  // secondary domain kinds lead the overflow, engine kinds follow it —
  // a kind marked both stays with the machinery (ownership is the stronger
  // fold: it is not the app's domain at all)
  const tuckedDomain = entries.filter(([kind]) =>
    secondary.has(kind) && !engine.has(kind));
  const tuckedEngine = entries.filter(([kind]) => engine.has(kind));
  if (tuckedDomain.length || tuckedEngine.length)
    nav.append(overflowMenu(tuckedDomain, tuckedEngine));
}

/* The ⋯ overflow: secondary domain kinds, then the engine machinery below
   a labeled rule. Keyboard-first (button = Enter/Space, Escape closes and
   returns focus, links take the global focus-visible ring); the definition
   kind wears its ⚖ — the law is findable, just not loud. A pure-engine
   overflow (no secondary domain kinds) reads exactly as it did before: no
   label, the machinery's own tooltip. */
function overflowMenu(domainEntries, engineEntries) {
  const wrap = el("span", {class:"nav-more-wrap"});
  const menu = el("div", {class:"nav-menu", role:"menu"});
  const btn = el("button", {class:"nav-more", type:"button",
    "aria-haspopup":"true", "aria-expanded":"false",
    title: domainEntries.length
      ? "more — secondary domain kinds and the engine's own resources"
      : "engine kinds — the machinery's own resources"}, "⋯");
  const close = () => { menu.style.display = "none";
                        btn.setAttribute("aria-expanded", "false"); };
  const open = () => { menu.style.display = "block";
                       btn.setAttribute("aria-expanded", "true");
                       (menu.querySelector("a") || btn).focus(); };
  btn.addEventListener("click", () =>
    menu.style.display === "block" ? close() : open());
  wrap.addEventListener("keydown", ev => {
    if (ev.key === "Escape" && menu.style.display === "block") {
      ev.stopPropagation(); close(); btn.focus(); }
  });
  document.addEventListener("pointerdown", ev => {
    if (!wrap.contains(ev.target)) close(); });
  const item = ([kind, href], law) =>
    el("a", {href: "#"+href, role:"menuitem", onclick: close},
      ...(law && kind === "definition"
        ? [el("span", {class:"law-mark"}, "⚖ ")] : []),
      title(kind)+"s");
  for (const e of domainEntries) menu.append(item(e, false));
  if (engineEntries.length) {
    if (domainEntries.length)
      menu.append(el("div", {class:"nav-menu-label"}, "Engine"));
    for (const e of engineEntries) menu.append(item(e, true));
  }
  wrap.append(btn, menu);
  return wrap;
}

/* Build a filtered link by merging params into the advertised href — the
   server owns its URL shapes; this client only ever adds a query. */
function mergeParams(href, params) {
  const [base, q] = href.split("?");
  const qs = new URLSearchParams(q || "");
  for (const [k, v] of Object.entries(params)) qs.set(k, v);
  const s = qs.toString();
  return s ? `${base}?${s}` : base;
}

/* ── the registry stamp: the whole workspace's law, for the home screen.
   The __registry__ definition row is the revision every kind's law rolls
   up into — one filtered lookup fetch, cached per principal. Any failure
   (no definition collection, 403, an empty registry) leaves the stamp
   alone: resource routes keep their per-kind stamp behavior. ─────────── */
const registryRevCache = {};   // principal value → revision | null
async function registryStamp(seq) {
  try {
    const w = await wellKnown();
    const col = w.collections?.definition;
    if (!col) return;
    const key = $("#principal").value;
    if (!(key in registryRevCache)) {
      const {res, body} = await api(mergeParams(lookupHref(col),
        {target_kind: "__registry__", state: "current"}));
      registryRevCache[key] = res.ok
        ? body.data?.items?.[0]?.data?.revision ?? null : null;
    }
    const rev = registryRevCache[key];
    if (rev == null || seq !== renderSeq || location.hash.slice(1)) return;
    const box = $("#lawstamp");
    box.textContent = "";
    box.append(el("a",
      {href: "#" + mergeParams(col, {target_kind: "__registry__"}),
       title: `the registry's law — revision ${rev} of what this workspace `
            + `is. Click for the deploy history.`},
      `⚖ rev ${rev}`));
  } catch { /* the stamp is a courtesy, never a blocker */ }
}

/* ── home: the dashboard — assembled entirely from what the wire already
   serves. One rows=none envelope per kind (a single COUNT, no rows) whose
   x-facets carry the per-state counts; the registry stamp is one cached
   lookup; the live ledger in the aside is the heartbeat. An engine-only
   registry (no domain kinds) falls back to the plain index. ──────────── */
async function renderHome(view, seq) {
  const w = await wellKnown();
  if (seq !== renderSeq) return;
  clearLiveTimers();
  view.textContent = "";
  registryStamp(seq);
  const engine = new Set(w.engine_kinds || []);
  const entries = Object.entries(w.collections || {});
  const domain = entries.filter(([kind]) => !engine.has(kind));
  if (!domain.length) return renderHomeIndex(view, w);

  const strip = el("div");             // fills only if something is nonzero
  const grid = el("div", {class:"dash-grid"});
  view.append(strip, grid);
  const attention = [];                // {order, node}

  const noteRecomputing = (kind, href, env) => {
    const facts = env?.meta?.recomputing;
    if (facts?.length) attention.push({order: 2, node:
      el("div", {class:"item"},
        el("a", {href: "#" + href},
          `${facts.map(pretty).join(" and ")} on ${pretty(kind)}s`),
        ` ${facts.length > 1 ? "are" : "is"} recomputing under a new`
        + ` definition.`)});
  };

  // one COUNT per domain kind, in parallel; each card lands (or leaves)
  // as its envelope resolves — the skeleton is the empty bordered card
  const settling = domain.map(([kind, href]) => {
    const card = el("div", {class:"kind-card"});
    grid.append(card);
    return fillDashCard(card, kind, href)
      .then(env => noteRecomputing(kind, href, env));
  });

  // engine vitals ride the same one-COUNT envelopes: x-facets carry the
  // per-state counts, so no second filtered fetch is needed. A refusal
  // (403/404) or a server without the state facet simply omits the item.
  const vital = (kind, states, sentence, order) => {
    const href = w.collections?.[kind];
    if (!href) return;
    settling.push(api(mergeParams(href, {rows: "none"})).then(({res, body}) => {
      if (!res.ok) return;
      noteRecomputing(kind, href, body);
      const facets = body.actions?.query?.input?.properties
        ?.state?.["x-facets"] || {};
      const live = states.filter(s => facets[s] > 0);
      const n = live.reduce((sum, s) => sum + facets[s], 0);
      if (n) attention.push({order, node: el("div", {class:"item"},
        el("a", {href: "#" + mergeParams(href, {state: live.join(",")})},
          el("span", {class:"mono"}, String(n)), " " + sentence(n)))});
    }).catch(() => {}));
  };
  // the needs-attention strip reads the DECLARATIONS first (design 6.0
  // §4): a surface with attention= nominates its anchor rows, and each
  // hit links to the named view. The hardcoded approvals/jobs items stay
  // only as the fallback for apps that declare nothing.
  const attSurfaces = Object.entries(w.surfaces || {})
    .filter(([, s]) => s.attention && s.collection);
  for (const [sname, s] of attSurfaces) {
    settling.push(api(mergeParams(s.collection,
        {...s.attention, "page[size]": 5})).then(({res, body}) => {
      if (!res.ok) return;
      const total = body.data?.total ?? 0;
      if (!total) return;
      const hits = (body.data?.items || []).map(it => {
        const id = it.self.split("/").pop();
        return el("span", {}, " · ", el("a",
          {href: "#" + s.href.replace("{anchor_id}", id),
           title: `open the ${pretty(sname)} view`}, it.summary));
      });
      attention.push({order: 0, node: el("div", {class:"item"},
        el("a", {href: "#" + mergeParams(s.collection, s.attention)},
          el("span", {class:"mono"}, String(total)),
          ` ${pretty(s.anchor)}${total === 1 ? "" : "s"} for `
          + `${pretty(sname)}.`),
        ...hits)});
    }).catch(() => {}));
  }
  if (!attSurfaces.length) {
    vital("approval_request", ["pending"],
      n => n === 1 ? "approval request awaits a decision."
                   : "approval requests await a decision.", 0);
    vital("job", ["running", "queued"],
      n => n === 1 ? "job is running or queued."
                   : "jobs are running or queued.", 1);
  }

  await Promise.allSettled(settling);
  if (seq !== renderSeq) return;
  if (attention.length) {
    attention.sort((a, b) => a.order - b.order);
    strip.append(el("div", {class:"attention"},
      ...attention.map(a => a.node)));
  } else strip.remove();
}

/* One domain kind's card: humanized name, the count in mono, state-facet
   chips as filtered links, the advertised create affordance, recomputing
   honesty. The envelope is the whole input; a refusal removes the card. */
async function fillDashCard(card, kind, href) {
  let env;
  try {
    const {res, body} = await api(mergeParams(href, {rows: "none"}));
    if (!res.ok) { card.remove(); return null; }   // degrade silently
    env = body;
  } catch { card.remove(); return null; }
  card.textContent = "";
  const head = el("div", {class:"kc-head"},
    el("h3", {}, el("a", {href: "#" + href}, title(kind) + "s")));
  if (env.meta?.recomputing?.length)
    head.append(el("span", {class:"kc-recomputing",
      title: `${env.meta.recomputing.map(pretty).join(", ")} recomputing `
           + `under a new definition`},
      el("span", {class:"spin-dot"}), "recomputing"));
  card.append(head);
  const total = env.data?.total ?? 0;
  if (!total)
    // an empty screen is an invitation to act, not a wall of zeroes
    card.append(el("div", {class:"kc-none"}, "none yet"));
  else {
    card.append(el("div", {class:"kc-total", title: `${total} total`},
      String(total)));
    const facets = env.actions?.query?.input?.properties
      ?.state?.["x-facets"] || {};
    const chips = Object.entries(facets).filter(([, n]) => n > 0);
    if (chips.length)
      card.append(el("div", {class:"kc-chips"}, ...chips.map(([s, n]) =>
        el("a", {class: "chip", href: "#" + mergeParams(href, {state: s}),
                 title: `${pretty(s)} ${pretty(kind)}s`},
          `${pretty(s)} ${n}`))));
  }
  const create = env.actions?.create;
  if (create) {
    const btn = actionButton({name: "create", entry: create, doc: env,
      label: "New", small: true, onDone: b => go(b.self)});
    btn.classList.add("primary");
    card.append(el("div", {class:"kc-foot"}, btn));
  }
  return env;
}

/* The plain .well-known index — the fallback for an engine-only registry
   (a workspace with no domain kinds has nothing to chart). */
function renderHomeIndex(view, body) {
  view.append(el("div", {class:"panel"},
    el("h2", {}, "Workspace"),
    el("p", {class:"muted mono", style:"font-size:11.5px"},
      `media type ${body.media_type}`),
    ...Object.entries(body.collections || {}).map(([kind, href]) =>
      el("div", {class:"rows"}, el("div", {class:"row"},
        el("a", {href:"#"+href, class:"grow"}, href),
        el("span", {class:"chip", title: kind}, title(kind)))))));
}

/* ── recomputing honesty (design §4): a deferred backfill is a banner,
   not a mystery — the fact still renders, its filters honestly don't ── */
function recomputeBanner(doc) {
  const facts = doc.meta?.recomputing;
  if (!facts || !facts.length) return null;
  const many = facts.length > 1;
  return el("div", {class:"recompute-banner"},
    el("span", {class:"spin-dot"}),
    `${facts.map(pretty).join(", ")} ${many ? "are" : "is"} recomputing `
    + `under a new definition — filters on ${many ? "them" : "it"} return `
    + `when it's caught up`);
}

/* Humans never read underscored tokens: the collection title renders
   once, and the server summary contributes only its informative tail —
   count and filters ("1 of 1 shown", "12 of 147 · state=active") — with
   the leading kind echo ("Grocery_lists · …") dropped entirely. */
function collectionTail(summary) {
  if (!summary) return "";
  const parts = String(summary).split(" · ");
  if (parts.length < 2) return pretty(summary);  // e.g. the scoped view
  return parts.slice(1).map(p => p.replace(/^filtered:\s*/, "")).join(" · ");
}

/* ── collection screen ──────────────────────────────────────────────── */
function renderCollection(view, doc, hints) {
  const panel = el("div", {class:"panel"});
  const colName = title(doc.kind.replace("_collection", "")) + "s";
  panel.append(el("div", {class:"crumbs"},
    el("a", {href:"#"}, "Workspace"), " / ", colName));
  panel.append(el("h2", {}, colName));
  const tail = collectionTail(doc.summary);
  if (tail) panel.append(el("div", {class:"summary"}, tail));
  const banner = recomputeBanner(doc);
  if (banner) panel.append(banner);

  // filter bar = the query action's input schema (§5); params for a
  // recomputing fact are simply absent from it, so nothing renders
  const query = doc.actions && doc.actions.query;
  if (query) panel.append(filterBar(query, doc.self));

  // create = the collection create affordance; active scalar filters that
  // name a create-schema property prefill the form — the user was already
  // looking at that slice, so the form starts there (still editable)
  const create = doc.actions && doc.actions.create;
  const bulk = Object.entries(doc.actions || {})
    .filter(([n, a]) => a.effect && a.effect.bulk);
  const bar = el("div", {class:"actions"});
  if (create) {
    const prefill = filterPrefill(doc.self, create);
    // attachments are a platform mechanism (design E5): filing one is a
    // file upload, not a metadata form — so the create wears the upload
    // affordance (which falls back to the plain form when the engine
    // advertises no bytes route). Every other kind keeps the generic New.
    bar.append(doc.kind === "attachment_collection"
      ? uploadButton({entry: create, doc, prefill, onDone: b => go(b.self)})
      : actionButton({name:"create", entry:create, doc,
          label:"New", prefill, onDone: b => go(b.self)}));
  }
  panel.append(bar);

  panel.append(itemTable(doc.data.items, hints,
    new Set(doc.meta?.recomputing || []), null,
    doc.kind === "attachment_collection"
      ? {rowAction: it => downloadButton(it, true)} : undefined));

  const pager = el("div", {class:"pager"});
  if (doc.links.prev) pager.append(el("a", {href:"#"+doc.links.prev.href}, "← prev"));
  pager.append(el("span", {class:"muted"},
    `page ${doc.data.page.number} · ${doc.data.total} total`));
  if (doc.links.next) pager.append(el("a", {href:"#"+doc.links.next.href}, "next →"));
  panel.append(pager);
  view.append(panel);
}

/* ── the deploy history: the definitions collection, rendered as what it
   is — the record of what the law has been, when. Violet is spent here
   and nowhere else. ─────────────────────────────────────────────────── */
function diffChips(diff) {
  const byClass = {};
  for (const key of ["added", "removed", "changed"])
    for (const e of diff?.[key] || [])
      (byClass[e.class] = byClass[e.class] || []).push(e.path);
  const order = ["truth", "judgment", "shape", "advertisement"];
  return Object.entries(byClass)
    .sort((a, b) => order.indexOf(a[0]) - order.indexOf(b[0]))
    .map(([cls, paths]) => el("span",
      {class: "diff-chip " + cls, title: paths.join("\n")},
      `${cls} ×${paths.length}`));
}

function renderDeployHistory(view, doc) {
  const panel = el("div", {class:"panel"});
  panel.append(el("div", {class:"crumbs"},
    el("a", {href:"#"}, "Workspace"), " / ", "Deploy history"));
  panel.append(el("h2", {}, "Deploy history"));
  const tail = collectionTail(doc.summary);
  if (tail) panel.append(el("div", {class:"summary"}, tail));
  const banner = recomputeBanner(doc);
  if (banner) panel.append(banner);
  const query = doc.actions && doc.actions.query;
  if (query) panel.append(filterBar(query, doc.self));

  for (const item of doc.data.items) {
    const d = item.data || {};
    const row = el("div", {class:"rev-row"},
      el("div", {class:"rev-head"},
        el("a", {href:"#"+item.self, class:"rev-token", title: item.self},
          `⚖ rev ${d.revision ?? "?"}`),
        el("b", {}, pretty(d.target_kind || "")),
        el("span", {class:"chip " + (item.state === "current" ? "ok" : ""),
                    title: item.state},
          item.display?.state?.label ?? title(item.state))));
    if (d.change_summary)
      row.append(el("div", {class:"prose rev-summary"}, d.change_summary));
    const meta = el("div", {class:"rev-meta"});
    meta.append(...diffChips(d.diff));
    if (d.diff?.reverts_to != null)
      meta.append(el("span", {class:"rev-revert"},
        `↩ reverts to rev ${d.diff.reverts_to}`));
    if (d.backfill_pending?.length)
      meta.append(el("span", {class:"rev-recomputing"},
        el("span", {class:"spin-dot"}),
        `recomputing: ${d.backfill_pending.map(pretty).join(", ")}`));
    if (d.fingerprint_hash)
      meta.append(el("span", {class:"mono hash", title: d.fingerprint_hash},
        d.fingerprint_hash.slice(0, 12)));
    if (meta.childNodes.length) row.append(meta);
    panel.append(row);
  }
  if (!doc.data.items.length)
    panel.append(el("div", {class:"muted"}, "no revisions"));

  const pager = el("div", {class:"pager"});
  if (doc.links.prev) pager.append(el("a", {href:"#"+doc.links.prev.href}, "← prev"));
  pager.append(el("span", {class:"muted"},
    `page ${doc.data.page.number} · ${doc.data.total} total`));
  if (doc.links.next) pager.append(el("a", {href:"#"+doc.links.next.href}, "next →"));
  panel.append(pager);
  view.append(panel);
}

/* Collection items as a table. Columns are derived mechanically from the
   envelopes: scalar data fields shared by the rows (in schema order), plus
   state and the honest per-row actions (§5). Compound fields (arrays,
   objects) stay behind the row link. Provenance renders per column. */
function itemTable(items, hints, recomputing, declaredColumns, opts) {
  hints = hints || {};
  recomputing = recomputing || new Set();
  // an optional per-row affordance the caller supplies (e.g. an attachment
  // collection's Download) — a node or null per item, beside the honest
  // per-row action buttons
  const rowAction = opts?.rowAction;
  if (!items.length) return el("div", {class:"muted"}, "no rows");
  const isScalar = v => v === null || ["string","number","boolean"].includes(typeof v);
  const consumed = new Set(Object.values(hints)
    .map(h => h.xd?.label_field).filter(Boolean));
  const rowsData = items.map(i => i.data);
  // a surface member's x-display.columns (design 6.0 §4) names the
  // columns and their order; visibility already governed field presence,
  // so a column no row carries simply doesn't render
  const columns = declaredColumns
    ? declaredColumns.filter(k => items.some(i => k in i.data)
        && !hints[k]?.xd?.hidden)
    : Object.keys(items[0].data)
    .filter(k => items.every(i => isScalar(i.data[k]))
      && !hints[k]?.xd?.hidden && !consumed.has(k)
      && !proseColumn(hints[k]?.xd, rowsData, k));
  const anyActions = !!rowAction
    || items.some(i => i.actions && Object.keys(i.actions).length);

  const head = el("tr", {},
    el("th", {}, ""),
    ...columns.map(c => el("th", {title: c}, hints[c]?.xd?.label || title(c))),
    el("th", {}, "State"),
    anyActions ? el("th", {}, "") : null);
  const table = el("table", {class:"items"}, el("thead", {}, head));
  const tbody = el("tbody", {});
  for (const item of items) {
    const row = el("tr", {},
      // the row names itself by its summary — the id stays in the href
      el("td", {}, el("a", {href:"#"+item.self, title: item.self,
        style:"display:inline-block;max-width:340px;overflow:hidden;" +
              "text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom"},
        item.summary)),
      ...columns.map(c => el("td", {}, recomputing.has(c)
        ? recomputingCell(item.data[c])
        : hintedValue(hints[c]?.xd || {}, item.data[c], item.data,
                      hints[c]?.src, hints[c]?.auth))),
      el("td", {}, el("span", {class:"chip "+tone(item), title: item.state},
        item.display?.state?.label ?? title(item.state))));
    if (anyActions) {
      const cell = el("td", {class:"rowactions"});
      const extra = rowAction ? rowAction(item) : null;
      if (extra) cell.append(extra);
      if (item.actions) {           // honest per-row buttons (§5)
        for (const [name, entry] of Object.entries(item.actions))
          cell.append(actionButton({name, entry, doc:item, small:true,
            onDone: () => render()}));
      } else if (item.actions === null && !extra) {
        cell.append(el("span", {class:"muted", title:"row_affordances=False"}, "…"));
      }
      row.append(cell);
    }
    tbody.append(row);
  }
  table.append(tbody);
  return el("div", {style:"overflow-x:auto"}, table);
}

function filterBar(query, selfHref) {
  const bar = el("form", {class:"filterbar"});
  const params = new URLSearchParams((selfHref.split("?")[1]||""));
  const props = query.input.properties || {};
  for (const [name, schema] of Object.entries(props)) {
    if (name.startsWith("page[")) continue;
    let input;
    const optionLabel = v => {
      const count = schema["x-facets"]?.[v];
      return count !== undefined ? `${pretty(v)} (${count})` : pretty(v);
    };
    if (schema.enum && schema["x-in"] && name !== "sort") {
      // x-in: the server takes a comma list (any-of), so the control is a
      // dropdown of checkboxes serialized back to that comma list
      const chosen = new Set((params.get(name) || "").split(",").filter(Boolean));
      const sum = el("summary", {});
      const relabel = () => { sum.textContent = chosen.size
        ? [...chosen].map(pretty).join(", ") : "—"; };
      input = el("details", {class:"multi"}, sum,
        el("div", {class:"options"}, ...schema.enum.map(v => {
          const box = el("input", {type:"checkbox", name, value:v});
          box.checked = chosen.has(v);
          box.addEventListener("change", () => {
            box.checked ? chosen.add(v) : chosen.delete(v); relabel(); });
          const count = schema["x-facets"]?.[v];
          return el("label", {}, box, pretty(v), count !== undefined
            ? el("span", {class:"facet-count"}, ` ${count}`) : null);
        })));
      // close on pointerdown outside — NOT focusout: closing the <details>
      // while a label inside it is forwarding activation to its checkbox
      // freezes Chromium's main thread solid. Self-removing once this
      // render's DOM is gone.
      const closeOnOutside = ev => {
        if (!document.contains(input))
          document.removeEventListener("pointerdown", closeOnOutside);
        else if (!input.contains(ev.target)) input.open = false;
      };
      document.addEventListener("pointerdown", closeOnOutside);
      relabel();
    } else if (schema.enum) {
      input = el("select", {name});
      input.append(el("option", {value:""}, "—"));
      for (const v of schema.enum) input.append(el("option", {value:v}, optionLabel(v)));
      if (params.get(name)) input.value = params.get(name);
    } else {
      input = el("input", {name, value: params.get(name) || "",
        type: schema.type === "integer" || schema.type === "number" ? "number" : "text",
        step: "any", placeholder: schema.format || schema.type || ""});
    }
    // checkboxes bring their own labels, so their wrapper must not be one
    bar.append(el(input.tagName === "DETAILS" ? "div" : "label",
      {title: name, class: input.tagName === "DETAILS" ? "flabel" : null},
      schema["x-display"]?.label || title(name), input));
  }
  bar.append(el("button", {class:"primary", type:"submit"}, "Filter"));
  bar.addEventListener("submit", ev => {
    ev.preventDefault();
    const qs = new URLSearchParams();
    for (const [k,v] of new FormData(bar).entries())  // same-name checked
      if (v) qs.set(k, qs.has(k) ? `${qs.get(k)},${v}` : v);  // boxes join
    const base = selfHref.split("?")[0];
    go(qs.size ? `${base}?${qs}` : base);
  });
  return bar;
}

/* Active scalar filters whose names exactly match create-input properties
   become prefills. A comma list, a _gte/_lte bound, and paging/sort
   plumbing are queries, not values — they stay out of the form. */
function filterPrefill(selfHref, entry) {
  const props = entry.input?.properties || {};
  const out = {};
  for (const [k, v] of new URLSearchParams(selfHref.split("?")[1] || "")) {
    if (["page", "sort", "rows"].includes(k) || k.startsWith("page[")) continue;
    if (/_(gte|lte)$/.test(k)) continue;
    if (!v || v.includes(",")) continue;
    if (k in props) out[k] = v;
  }
  return out;
}

/* ── resource screen ────────────────────────────────────────────────── */
/* ── the read surface, up front ────────────────────────────────────────
   One chip band under the summary: declared surfaces (the law's violet)
   then ordinary rels with their badges — scent before the scroll, per
   the wire's own badge rationale. Crumb-covered rels (collection,
   parent, anchor), the event stream, and embedded rels' duplicates stay
   out; embeds still render inline with their own heads. */
const CHIP_SKIP = new Set(["events", "collection", "parent", "anchor"]);
function linkChips(doc) {
  const rels = Object.entries(doc.links || {})
    .filter(([r, l]) => l && !CHIP_SKIP.has(r));
  if (!rels.length) return null;
  rels.sort(([a], [b]) =>
    (a.startsWith("surface:") ? 0 : 1) - (b.startsWith("surface:") ? 0 : 1));
  const row = el("div", {class:"surface-row"});
  for (const [r, l] of rels)
    row.append(r.startsWith("surface:")
      ? el("a", {class:"surface-link", href:"#"+l.href, title:l.summary || r},
          "⧉ " + pretty(r.slice("surface:".length)) + " ↗")
      : el("a", {class:"link-chip", href:"#"+l.href, title:l.summary || r},
          pretty(r), l.badge != null
            ? el("span", {class:"badge", title:"count, per the server"},
                String(l.badge)) : null));
  return row;
}

/* ── refusals, ranked by what the reader can do with them ──────────────
   A countdown or a singular guard reason is decision fuel — it stays at
   the action bar (a dimmed button plus its honest reason). State gates
   and repeated identical reasons (the scoped-view case) carry no news
   per entry, so they compress into a closed "not now" footer. */
function splitRefusals(doc) {
  const timed = [], gated = [], byReason = new Map();
  for (const [name, entry] of Object.entries(doc.unavailable || {})) {
    const hope = entry.becomes_available;
    if (hope?.at) timed.push([name, entry]);
    else if (hope?.in_states) gated.push([name, entry]);
    else {
      const k = entry.reason || "";
      if (!byReason.has(k)) byReason.set(k, []);
      byReason.get(k).push([name, entry]);
    }
  }
  const blocked = [...timed], grouped = [];
  for (const g of byReason.values())
    if (g.length === 1) blocked.push(g[0]); else grouped.push(g);
  blocked.sort((a, b) =>
    (a[1].display?.order ?? 5) - (b[1].display?.order ?? 5));
  return {blocked, grouped, gated};
}

function blockedNotes(blocked, doc) {
  if (!blocked.length) return null;
  const box = el("div", {class:"blockedwhy"});
  for (const [name, entry] of blocked) {
    const item = el("div", {class:"item"},
      el("b", {}, label(name, entry)), " — ",
      el("span", {class:"why"}, entry.reason || ""),
      remedyChips(entry.remedies, doc));
    if (entry.becomes_available?.at)
      item.append(countdownEl(entry.becomes_available.at));
    else if (entry.becomes_available?.requires)
      item.append(el("div", {class:"hope muted"},
        `requires ${entry.becomes_available.requires}`));
    box.append(item);
  }
  return box;
}

function notNowFooter(grouped, gated, doc) {
  const n = grouped.reduce((s, g) => s + g.length, 0) + gated.length;
  if (!n) return null;
  const box = el("div", {class:"cantyet"});
  for (const g of grouped)          // one reason, many actions: say it once
    box.append(el("div", {class:"item"},
      el("b", {}, g.map(([nm, e]) => label(nm, e)).join(", ")),
      el("div", {class:"why"}, g[0][1].reason || ""),
      remedyChips(g[0][1].remedies, doc)));
  const byStates = new Map();       // state gates: one line per destination
  for (const [nm, e] of gated) {
    const k = e.becomes_available.in_states.map(pretty).join(", ");
    if (!byStates.has(k)) byStates.set(k, []);
    byStates.get(k).push(label(nm, e));
  }
  for (const [states, names] of byStates)
    box.append(el("div", {class:"item"},
      el("b", {}, names.join(", ")),
      el("span", {class:"muted"}, ` — available in ${states}`)));
  return el("details", {class:"unavail"},
    el("summary", {class:"muted"}, `not now (${n})`), box);
}

function renderResource(view, doc, hints) {
  hints = hints || {};
  const panel = el("div", {class:"panel"});
  const col = doc.links.collection || doc.links.parent;
  panel.append(el("div", {class:"crumbs"},
    el("a", {href:"#"}, "Workspace"), " / ",
    // link summaries like "All grocery_lists" are machine spellings —
    // humanize before rendering (never show underscored tokens)
    col ? el("a", {href:"#"+col.href}, pretty(col.summary || title(doc.kind)+"s"))
        : title(doc.kind),
    // the page names itself in human terms; the id stays hover-only
    " / ", el("span", {title: doc.self, class: doc.display?.title ? "" : "id"},
      doc.display?.title || doc.self.split("/").pop().slice(0,8))));
  panel.append(el("h2", {}, doc.display?.title || title(doc.kind)),
    el("div", {}, el("span", {class:"chip "+tone(doc), title: doc.state},
      doc.display?.state?.label ?? title(doc.state)),
      el("span", {class:"version"}, `v${doc.meta.version}`)));
  panel.append(el("div", {class:"summary"}, doc.summary));
  const banner = recomputeBanner(doc);
  if (banner) panel.append(banner);
  const recomputing = new Set(doc.meta?.recomputing || []);

  // the read surface up front: declared surfaces (design 6.0 §4) then
  // ordinary rels, badges riding — scent before the scroll
  const chips = linkChips(doc);
  if (chips) panel.append(chips);

  // buttons = actions, styled by display, gated by confirm; actions the
  // server scoped into parts render on their rows instead of up here
  const scopedNames = new Set();
  for (const group of Object.values(doc.parts || {}))
    for (const it of group.items)
      for (const n of Object.keys(it.actions)) scopedNames.add(n);
  const bar = el("div", {class:"actions"});
  // suggested actions (co-presence): remedies on this doc's own warnings
  // and unavailable reasons may name a same-kind action that IS here —
  // the way out gains a ring and a marker; nothing is demoted
  const suggested = new Set();
  const noteRemedies = list => {
    for (const t of list || []) {
      const dot = String(t).indexOf(".");
      if (dot > 0 && t.slice(0, dot) === doc.kind
          && doc.actions[t.slice(dot + 1)])
        suggested.add(t.slice(dot + 1));
    }
  };
  for (const entry of Object.values(doc.actions))
    for (const w of entry.warnings || []) noteRemedies(w.remedies);
  for (const entry of Object.values(doc.unavailable))
    noteRemedies(entry.remedies);
  const entries = Object.entries(doc.actions)
    .filter(([n]) => !scopedNames.has(n))
    .sort((a,b) => (a[1].display?.order ?? 5) - (b[1].display?.order ?? 5));
  for (const [name, entry] of entries) {
    const btn = actionButton({name, entry, doc, onDone: () => render()});
    if (suggested.has(name)) {
      btn.classList.add("suggested");
      btn.append(el("span", {class:"suggest-chip",
        title: "an advisory on this page names this action as the remedy"},
        "suggested"));
    }
    bar.append(btn);
  }
  // guard-refused actions keep their seats in the bar, dimmed; their
  // honest reasons render just below, at the point of intent
  const {blocked, grouped, gated} = splitRefusals(doc);
  for (const [name, entry] of blocked)
    bar.append(el("button", {class:"blocked", disabled:"",
      title: entry.reason || ""}, label(name, entry)));
  // an agent link (engine kind): the owner needs to copy its token to give
  // to the agent, and can follow the agent before it ever acts
  if (doc.kind === "grant") {
    if (doc.data?.token) {  // present only for the owner; the agent has it
      const apiBase = `${location.origin}${BASE}`;
      const link = `${apiBase}/.well-known/waymark?agent-token=${doc.data.token}`;
      const grantHref = `${location.origin}${doc.self}`;
      // what gets copied is a priming brief, not a bare URL: paste it into
      // the agent's context and it can bootstrap (install the CLI from
      // /cli), authenticate, and negotiate its own access — nothing here
      // grants anything; it only tells the agent how to ask
      const brief = [
        `You are "${doc.data.holder_name}", an agent holding a Waymark agent link.`,
        ``,
        `Server: ${apiBase}`,
        `Your token (keep it secret): ${doc.data.token}`,
        `Discovery link (carries your token): ${link}`,
        ``,
        `## Install the CLI`,
        `This host serves its own client. Fetch the install commands:`,
        `    curl ${location.origin}/cli`,
        `and run one of the lines it prints (uv tool install / pipx install of the served wheel).`,
        ``,
        `## Authenticate`,
        `Send the token as \`Authorization: Bearer <token>\` on every request. The CLI does this for you:`,
        `    export WAYMARK_BASE=${location.origin}`,
        `    export WAYMARK_TOKEN=${doc.data.token}`,
        `    waymark7 client index --api-base ${BASE || "/"}`,
        ``,
        `## Negotiate access`,
        `Your token starts with nothing beyond the public catalog and your own grant resource.`,
        `1. Read your grant:    waymark7 client get ${grantHref}`,
        `2. See the ask shape:  waymark7 client schema ${grantHref} request_access`,
        `3. Request the minimum your task needs — fields (clear|hashed), actions (open|approval), and a duration:`,
        `    waymark7 client act ${grantHref} request_access --json '{"task": "<why>", "requested_fields": {"<kind>": {"<field>": "clear"}}, "requested_actions": {"<kind>": {"<action>": "open"}}, "requested_hours": 24}'`,
        `4. A person reviews. Poll your grant until its state is "granted", then do your task.`,
        ``,
        `Actions shown as unavailable name request_access as the remedy — request more, don't retry.`,
        `Actions granted as "approval" return 202 with a pending approval a human decides; once approved, invoke its run action.`,
      ].join("\n");
      bar.append(el("button", {
        title: "copy a priming brief for the agent — its token, the discovery "
             + "link, CLI install from /cli, and how to negotiate access",
        onclick: async () => {
          try { await navigator.clipboard.writeText(brief);
                toast("agent brief copied — paste it into the agent's context"); }
          catch { prompt("agent brief (give it to the agent):", brief); }
        }}, "🔑 copy agent link"));
    }
    if (doc.data?.agent_principal) {
      const who = {id: doc.data.agent_principal, display: doc.data.holder_name};
      const on = followId === who.id;
      bar.append(el("button", {
        title: on ? `already following ${who.display}`
                  : `watch ${who.display}'s actions and navigation live`,
        onclick: on ? unfollow : () => { follow(who);
          toast(`following ${who.display}`); render(); }},
        on ? "✓ following this agent" : "👁 follow this agent"));
    }
  }
  // an uploaded attachment (design E5): offer its bytes back. The buttons
  // fetch with the acting principal's headers (a bare link can't), so they
  // sit here rather than as a naked href; View only for types a browser
  // renders inline. A reserved row has no bytes yet, so nothing shows.
  if (doc.kind === "attachment" && doc.state === "uploaded") {
    const id = doc.self.split("/").pop();
    if (isViewable(doc.data?.mime))
      bar.append(el("button", {title:"open in a new tab",
        onclick: () => viewAttachment(id)}, "View"));
    bar.append(el("button", {class:"primary", title:"save the file",
      onclick: () => downloadAttachment(id, doc.data?.name)}, "↓ Download"));
  }
  panel.append(bar);
  const notes = blockedNotes(blocked, doc);
  if (notes) panel.append(notes);

  // data: grouped by display.groups if declared, else all fields; arrays
  // with a parts group get their scoped actions as per-row buttons; fields
  // render per their data-schema x-display hints (hidden, references) and
  // their declared provenance (x-source)
  const groups = doc.display?.groups ||
    [{label: "Data", fields: Object.keys(doc.data)}];
  for (const g of groups) {
    const table = el("table", {class:"kv"});
    for (const f of g.fields) {
      const h = hints[f] || {xd: {}};
      if (h.xd.hidden) continue;
      table.append(el("tr", {},
        el("td", {class:"k", title: f}, h.xd.label || title(f)),
        el("td", {}, Array.isArray(doc.data[f]) && (doc.parts?.[f] || h.items)
          ? rowsTable(doc.data[f], doc, doc.parts?.[f], h.items)
          : recomputing.has(f)
            ? recomputingCell(doc.data[f])
            : hintedValue(h.xd, doc.data[f], doc.data, h.src, h.auth))));
    }
    const d = el("details", g.collapsed ? {} : {open:""},
      el("summary", {class:"muted"}, g.label || g.id), table);
    panel.append(d);
  }

  // embedded collections: links that declare embed:true render their rows
  // right here, in links order — the same table the collection page uses
  for (const [rel, l] of Object.entries(doc.links))
    if (l && l.embed) panel.append(embedSection(rel, l));

  // the resource's own history: its transition log, replayed from the
  // events link the envelope always carries (design §5), collapsed by
  // default — recorded inputs land here for a full-visibility reader
  panel.append(historySection(`${doc.self}/-/events`));

  // the compressed refusals: state gates and repeated identical reasons,
  // closed by default — derivable, not decision fuel
  const footer = notNowFooter(grouped, gated, doc);
  if (footer) panel.append(footer);
  view.append(panel);
  watchResource(doc);
}

/* A live countdown from becomes_available.at — ticking text, flipping to
   a re-fetch invitation once the moment passes. Text updates only, so it
   keeps ticking under prefers-reduced-motion. */
function countdownEl(at) {
  const span = el("div", {class:"hope countdown",
                          title: new Date(at).toLocaleString()});
  const tick = () => {
    const ms = new Date(at) - Date.now();
    if (ms <= 0) {
      span.textContent = "";
      span.append("may be open now — ",
        el("a", {href: "#" + location.hash.slice(1),
                 onclick: e => { e.preventDefault(); render(); }}, "refresh"));
      return true;
    }
    span.textContent = `opens in ${dur(ms)}`;
    return false;
  };
  if (!tick()) {
    const t = setInterval(() => { if (tick()) clearInterval(t); }, 1000);
    liveTimers.push(t);
  }
  return span;
}
function dur(ms) {
  const s = Math.floor(ms / 1000), m = Math.floor(s / 60),
        h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d) return `${d}d ${h % 24}h`;
  if (h) return `${h}h ${m % 60}m`;
  if (m) return `${m}m ${s % 60}s`;
  return `${s}s`;
}

/* ── remedies: the wire names the way out as "kind.action" tokens ──────
   Same kind and the action is on this page → a chip that walks to the
   button (scroll, focus, pulse). A create elsewhere → a link to that
   kind's collection, once discovery resolves it. Anything else stays a
